      /* ---------- Module 9: applied patterns ---------- */
      {
        id: 'a1', mod: 'applied', diff: 'medium', title: 'Ring buffer wraparound', fmt: 'dec',
        ask: 'A ring buffer of the given power-of-two size advances its index. What is the next index?',
        hint: 'idx = (idx + 1) & (SIZE - 1) — the mask replaces a modulo.',
        concept: 'Masking is a single-cycle AND while <code>%</code> may call a division routine on a Cortex-M0. It only works when the size is a power of two, which is why UART ring buffers always are.',
        setup() {const sz = pick([8, 16, 32, 64]); const idx = sz - 1 - rnd(0, 1); return {sz, idx, answer: String((idx + 1) & (sz - 1))};},
        render(s, shown) {
          const nx = (s.idx + 1) & (s.sz - 1);
          const bits = Math.log2(s.sz);
          return code(`#define SIZE ${s.sz}   // power of two\nhead = (head + 1) & (SIZE - 1);   // = & ${hx(s.sz - 1, 8)}`)
            + chips([['head', String(s.idx)], ['SIZE', String(s.sz)], ['mask', hx(s.sz - 1, 8), 'hot']])
            + (shown
              ? opBoard(8, s.idx + 1, s.sz - 1, '&', nx, true, {la: 'head+1', lr: 'head'})
              + note(`${s.idx} + 1 = ${s.idx + 1}${s.idx + 1 >= s.sz ? `, which needs ${bits + 1} bits — the mask drops the overflow bit and wraps to <b>0</b>.` : `, which still fits in ${bits} bits, so the mask changes nothing: <b>${nx}</b>.`}`)
              : '');
        }
      },
      {
        id: 'a2', mod: 'applied', diff: 'hard', title: 'Pack a command byte', fmt: 'hex',
        ask: 'Pack these three fields into one command byte. Give it in hex.',
        hint: 'Shift each field to its own position and OR them together: (mode << 6) | (dev << 3) | ch.',
        concept: 'The layout comes from the datasheet; your job is to place each field without letting one spill into another. Mask each value to its width if it comes from a variable.',
        setup() {
          const mode = rnd(0, 3), dev = rnd(0, 7), ch = rnd(0, 7);
          return {mode, dev, ch, answer: hx((mode << 6) | (dev << 3) | ch, 8)};
        },
        render(s, shown) {
          const F = [{hi: 7, lo: 6, name: 'MODE', tone: 1}, {hi: 5, lo: 3, name: 'DEVICE', tone: 2}, {hi: 2, lo: 0, name: 'CHANNEL', tone: 3}];
          const v = (s.mode << 6) | (s.dev << 3) | s.ch;
          return code(`cmd = (mode << 6) | (dev << 3) | ch;`)
            + valBoard(8, 0, {label: 'layout', fields: F})
            + chips([['MODE', `${s.mode} = 0b${bin(s.mode, 2)}`], ['DEVICE', `${s.dev} = 0b${bin(s.dev, 3)}`], ['CHANNEL', `${s.ch} = 0b${bin(s.ch, 3)}`]])
            + (shown
              ? valBoard(8, v, {label: 'cmd', fields: F, marks: maskMarks(v, 8, 'set')})
              + note(`<b>${hx(v, 8)}</b>. The three shifted values have no overlapping bits, so OR is safe — with overlap you would need to clear first.`)
              : valBoard(8, 0, {label: 'cmd', unknown: true}));
        }
      },
      {
        id: 'a3', mod: 'applied', diff: 'hard', title: 'Decode a sensor frame', fmt: 'dec',
        ask: 'Decode the highlighted field out of this 16-bit sensor frame. Give it in decimal.',
        hint: 'Shift right by the field offset, then mask to the field width.',
        concept: 'Exactly the same extraction as a peripheral register — the only difference is that the layout came from a protocol spec instead of a reference manual.',
        setup() {
          const st = rnd(0, 3), ch = rnd(0, 7), data = rnd(0, 0x7F);
          const frame = (st << 14) | (ch << 11) | (data << 4) | rnd(0, 15);
          const which = pick(['STATUS', 'CH', 'DATA']);
          const spec = {STATUS: [15, 14, st], CH: [13, 11, ch], DATA: [10, 4, data]}[which];
          return {frame, which, hi: spec[0], lo: spec[1], answer: String(spec[2])};
        },
        render(s, shown) {
          const F = [{hi: 15, lo: 14, name: 'STATUS', tone: 1}, {hi: 13, lo: 11, name: 'CH', tone: 2}, {hi: 10, lo: 4, name: 'DATA', tone: 3}, {hi: 3, lo: 0, name: 'CRC', tone: 4}];
          const w = s.hi - s.lo + 1;
          return title(`extract ${s.which} — bits [${s.hi}:${s.lo}]`)
            + code(`uint8_t v = (frame >> ${s.lo}) & ${hx(maskW(w), 8)};`)
            + valBoard(16, s.frame, {label: 'frame', fields: F, marks: rangeMarks(s.lo, s.hi)})
            + (shown
              ? valBoard(16, U(s.frame) >>> s.lo, {label: `>> ${s.lo}`, marks: rangeMarks(0, w - 1)})
              + valBoard(16, (U(s.frame) >>> s.lo) & maskW(w), {label: 'field', marks: maskMarks(maskW(w), 16, 'fill')})
              + note(`${s.which} = <b>${s.answer}</b>. Forgetting the mask would leave the higher fields attached to the top.`)
              : '');
        }
      },
      {
        id: 'a4', mod: 'applied', diff: 'medium', title: 'XOR checksum', fmt: 'hex',
        ask: 'Compute the XOR checksum of these bytes. Give it in hex.',
        hint: 'XOR them all together in order. XOR is associative, so the order does not matter.',
        concept: 'The cheapest integrity check there is, used by NMEA and many simple serial protocols. It catches single-bit errors but not a swapped pair of bytes.',
        setup() {
          const b = [rndByte(), rndByte(), rndByte(), rndByte()];
          return {b, answer: hx(b.reduce((a, x) => a ^ x, 0), 8)};
        },
        render(s, shown) {
          let h = code(`uint8_t cks = 0;\nfor (i = 0; i < len; i++) cks ^= buf[i];`)
            + chips(s.b.map((x, i) => [`buf[${i}]`, hx(x, 8)]));
          if (shown) {
            let acc = 0;
            s.b.forEach((x, i) => {const nx = acc ^ x; h += opBoard(8, acc, x, '^', nx, true, {la: i ? 'cks' : 'cks=0', lr: 'cks', plain: true}); acc = nx;});
            h += note(`Checksum = <b>${hx(acc, 8)}</b>. XOR the checksum back in and you get 0 — that is how the receiver verifies it.`);
          }
          return h;
        }
      },
      {
        id: 'a5', mod: 'applied', diff: 'hard', title: 'Debounce shift register', fmt: 'hex',
        ask: 'A button sampler shifts a new sample into an 8-bit history each tick. Give the new history value in hex.',
        hint: 'history = (history << 1) | sample, kept to 8 bits.',
        concept: 'When the history reads 0xFF or 0x00 the input has been stable for eight consecutive samples and you can accept the edge. No timers, no state machine.',
        setup() {const h = rndByte(), sample = rnd(0, 1); return {h, sample, answer: hx(((h << 1) | sample) & 0xFF, 8)};},
        render(s, shown) {
          const nh = ((s.h << 1) | s.sample) & 0xFF;
          return code(`hist = (hist << 1) | read_pin();   // ${s.sample}\nif (hist == 0xFF) pressed = true;\nif (hist == 0x00) pressed = false;`)
            + valBoard(8, s.h, {label: 'hist', marks: {7: 'drop'}})
            + (shown
              ? valBoard(8, nh, {label: 'new', marks: {0: 'fill'}})
              + note(`The oldest sample fell off the top and the new sample <b>${s.sample}</b> entered at bit 0. New value ${hx(nh, 8)} — ${nh === 0xFF ? 'eight consecutive 1s, so the press is confirmed.' : nh === 0 ? 'eight consecutive 0s, so the release is confirmed.' : 'still bouncing, no decision yet.'}`)
              : valBoard(8, 0, {label: 'new', unknown: true}));
        }
      },
      {
        id: 'a6', mod: 'applied', diff: 'hard', title: 'Scale an ADC reading', fmt: 'dec',
        ask: 'Convert this 12-bit ADC count to millivolts against a 3300 mV reference, using integer maths. Round down.',
        hint: '(raw * 3300) >> 12. Multiply first, then shift — the other order throws the value away.',
        concept: 'Multiply-then-shift keeps precision without floating point. The intermediate here reaches 13.5 million, so it must be computed in at least 32 bits.',
        setup() {const raw = rnd(200, 4000); return {raw, answer: String((raw * 3300) >> 12)};},
        render(s, shown) {
          const prod = s.raw * 3300, mv = prod >> 12;
          return code(`uint32_t mv = ((uint32_t)raw * 3300) >> 12;   // /4096`)
            + chips([['raw', `${s.raw} (${hx(s.raw, 12)})`], ['Vref', '3300 mV']])
            + valBoard(16, s.raw, {label: 'raw', fields: [{hi: 11, lo: 0, name: '12-bit result', tone: 0}]})
            + (shown
              ? valBoard(32, prod, {label: 'raw*3300', marks: rangeMarks(0, 11, 'drop')})
              + note(`The product is ${prod}, needing ${msbIndex(prod) + 1} bits — a 16-bit intermediate would have overflowed. Shifting right by 12 discards the highlighted low bits and yields <b>${mv} mV</b>. Doing <code>(raw >> 12) * 3300</code> instead would give 0.`)
              : note('Watch the width of the intermediate product.'));
        }
      },
      {
        id: 'a7', mod: 'applied', diff: 'expert', title: 'Fixed-point Q8.8', fmt: 'dec',
        ask: 'This Q8.8 fixed-point temperature has 8 fractional bits. Give the value in milli-degrees, rounded down.',
        hint: 'The integer part is the top 8 bits. To get milli-units: (raw * 1000) >> 8.',
        concept: 'Q8.8 keeps 1/256 resolution with no FPU. The binary point is purely a convention you hold in your head — the hardware just sees a 16-bit integer.',
        setup() {const raw = rnd(0x0100, 0x3FFF); return {raw, answer: String((raw * 1000) >> 8)};},
        render(s, shown) {
          const F = [{hi: 15, lo: 8, name: 'integer part', tone: 0}, {hi: 7, lo: 0, name: 'fraction /256', tone: 1}];
          const milli = (s.raw * 1000) >> 8;
          return code(`// Q8.8: value = raw / 256.0\nint32_t milli = ((int32_t)raw * 1000) >> 8;`)
            + valBoard(16, s.raw, {label: 'raw', fields: F})
            + (shown
              ? chips([['integer part', String(s.raw >> 8)], ['fraction', `${s.raw & 0xFF}/256`], ['milli-units', String(milli), 'hot']])
              + note(`${s.raw >> 8} + ${s.raw & 0xFF}/256 = ${(s.raw / 256).toFixed(4)} &rarr; <b>${milli}</b> milli-units. Scaling before the shift is what preserves the fractional bits.`)
              : note('The top 8 bits are whole units; the bottom 8 are 256ths.'));
        }
      },
      {
        id: 'a8', mod: 'applied', diff: 'expert', title: 'One CRC-8 step', fmt: 'hex',
        ask: 'Perform one bit-step of a CRC-8 with polynomial 0x07. Give the new CRC value in hex.',
        hint: 'Shift left by one; if the bit that fell off the top was 1, XOR with 0x07.',
        concept: 'A CRC is division in GF(2): shift, and conditionally subtract the polynomial — where subtraction is XOR. Table-driven CRCs just precompute eight of these steps at a time.',
        setup() {const crc = rndByte(); return {crc, answer: hx(((crc << 1) ^ ((crc & 0x80) ? 0x07 : 0)) & 0xFF, 8)};},
        render(s, shown) {
          const msb = (s.crc & 0x80) ? 1 : 0;
          const sh = (s.crc << 1) & 0xFF;
          const res = (sh ^ (msb ? 0x07 : 0)) & 0xFF;
          return code(`crc <<= 1;\nif (crc_msb_was_set) crc ^= 0x07;`)
            + valBoard(8, s.crc, {label: 'crc', marks: {7: 'hl'}})
            + (shown
              ? title(`step 1 — shift left (bit 7 was ${msb})`)
              + shiftBoard(8, s.crc, 1, 'shl', sh, true)
              + title(msb ? 'step 2 — top bit was 1, so XOR the polynomial in' : 'step 2 — top bit was 0, so no XOR')
              + (msb ? opBoard(8, sh, 0x07, '^', res, true, {la: 'shifted', lr: 'crc', plain: true})
                : valBoard(8, res, {label: 'crc'}))
              + note(`New CRC = <b>${hx(res, 8)}</b>. Eight of these steps consume one input byte.`)
              : note('Bit 7 is highlighted — it decides whether the polynomial gets XORed in.'));
        }
      }
    ];

    const PROBLEMS = [...P_A, ...P_B, ...P_C]
      .sort((a, b) => MOD_INDEX[a.mod] - MOD_INDEX[b.mod]);
    const BY_ID = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
    PROBLEMS.forEach(p => {p.s = p.setup();});
    /* ============================================================
       PART 5 — answer checking
       Accept any reasonable spelling of the same number.
       ============================================================ */
    function norm(v) {return String(v).trim().toLowerCase().replace(/[\s_,]/g, '');}

    function boolOf(s) {
      if (['yes', 'y', 'true', 't'].includes(s)) return true;
      if (['no', 'n', 'false', 'f'].includes(s)) return false;
      return null;
    }

    function numOf(s) {
      if (/^-?0x[0-9a-f]+$/.test(s)) return parseInt(s.replace('0x', ''), 16) * (s[0] === '-' ? -1 : 1);
      if (/^-?0b[01]+$/.test(s)) return parseInt(s.replace('0b', ''), 2) * (s[0] === '-' ? -1 : 1);
      if (/^-?\d+$/.test(s)) return parseInt(s, 10);
      return null;
    }

    function accepts(expected, given) {
      const e = norm(expected), g = norm(given);
      if (!g) return false;
      if (e === g) return true;

      const eb = boolOf(e);
      if (eb !== null) return boolOf(g) === eb;

      // bare-digit forms of a prefixed expected answer ("2a" for 0x2A, "1011" for 0b1011)
      if (/^0[xb]/.test(e) && e.slice(2) === g) return true;

      const en = numOf(e), gn = numOf(g);
      return en !== null && gn !== null && en === gn;
    }

    const FMT_HELP = {
      hex: 'answer in hex, e.g. 0x2A',
      dec: 'answer in decimal',
      bin: 'answer in binary, e.g. 0b10110011',
      yesno: 'answer yes or no'
    };

    /* ============================================================
       PART 6 — application state
       ============================================================ */
    const STORE_KEY = 'bitlab.progress.v1';

    const app = {
      tab: 'learn',
      cur: 0,
      solved: new Set(),
      tried: {},
      feedback: {},
      inputs: {},
      hint: {},
      reveal: {},
      why: {},
      lab: {
        w: 32, value: 0x00000000, prev: 0x00000000, reg: 'MODER',
        bit: 5, mask: '0x0000000F', shift: 2, hist: []
      }
    };

    function save() {
      try {localStorage.setItem(STORE_KEY, JSON.stringify([...app.solved]));} catch (e) { }
    }
    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) JSON.parse(raw).forEach(id => {if (BY_ID[id]) app.solved.add(id);});
      } catch (e) { }
    }

    const isShown = p => app.feedback[p.id] === 'correct' || app.reveal[p.id];

    /* ============================================================
       PART 7 — views
       ============================================================ */
    function view() {
      const solved = app.solved.size, total = PROBLEMS.length;
      let h = `<div class="masthead">
          <h1>Bit Lab</h1>
          <span class="sub">bit manipulation for embedded engineers &mdash; ${total} problems across ${MODULES.length} modules</span>
        </div>
        <div class="tab-bar">
          ${[['learn', 'Learn'], ['problems', `Problems (${solved}/${total})`], ['lab', 'Register lab'], ['ref', 'Reference']]
          .map(([k, t]) => `<button class="tab ${app.tab === k ? 'active' : ''}" onclick="setTab('${k}')">${t}</button>`).join('')}
        </div>`;

      if (app.tab === 'learn') h += viewLearn();
      else if (app.tab === 'problems') h += viewList();
      else if (app.tab === 'lab') h += viewLab();
      else h += viewRef();

      document.getElementById('app').innerHTML = h;

      if (app.tab === 'learn') {
        const el = document.getElementById('ans');
        if (el) el.focus();
      }
      if (app.focusId) {
        const el = document.getElementById(app.focusId);
        if (el) {el.focus(); if (el.setSelectionRange) {const n = el.value.length; el.setSelectionRange(n, n);} }
        app.focusId = null;
      }
    }

    function viewLearn() {
      const p = PROBLEMS[app.cur];
      const s = p.s;
      const shown = isShown(p);
      const mod = MODULES[MOD_INDEX[p.mod]];
      const firstOfMod = PROBLEMS.findIndex(x => x.mod === p.mod) === app.cur;
      const inMod = PROBLEMS.filter(x => x.mod === p.mod);
      const posInMod = inMod.indexOf(p) + 1;

      let h = '';
      if (firstOfMod) {
        h += `<div class="modcard">
            <div class="t">Module ${MOD_INDEX[p.mod] + 1} of ${MODULES.length}</div>
            <h2>${mod.name}</h2>
            <p>${mod.blurb}</p>
          </div>`;
      }

      h += `<div class="card">
          <div class="problem-header">
            <div>
              <div class="crumb">${mod.name} &middot; ${posInMod} of ${inMod.length}</div>
              <h3>${p.title}</h3>
            </div>
            <span class="badge badge-${p.diff}">${p.diff}</span>
          </div>
          <p class="ask">${p.ask}</p>
          ${p.render(s, shown)}`;

      if (!shown) {
        h += `<div class="answer-row">
            <input type="text" id="ans" placeholder="${FMT_HELP[p.fmt]}" value="${esc(app.inputs[p.id] || '')}"
                   oninput="app.inputs['${p.id}']=this.value"
                   onkeydown="if(event.key==='Enter')submit()">
            <button class="btn btn-primary" onclick="submit()">Check</button>
            <button class="linkbtn" onclick="tog('hint','${p.id}')">${app.hint[p.id] ? 'hide hint' : 'hint'}</button>
            <button class="linkbtn" onclick="tog('reveal','${p.id}')">show me</button>
          </div>`;
        if (app.hint[p.id]) h += `<div class="feedback hint">${p.hint}</div>`;
        if (app.feedback[p.id] === 'wrong') {
          const n = app.tried[p.id] || 0;
          h += `<div class="feedback wrong">Not quite &mdash; ${n >= 3 ? 'try the hint, or use <b>show me</b> to walk through it.' : 'have another go.'} <span style="opacity:.75">(${FMT_HELP[p.fmt]})</span></div>`;
        }
      } else {
        const correct = app.feedback[p.id] === 'correct';
        h += `<div class="feedback ${correct ? 'correct' : 'hint'}">
            ${correct ? '&#10003; Correct' : 'Answer'}: <span class="mono"><b>${s.answer}</b></span>
            &nbsp;<button class="linkbtn" style="color:inherit" onclick="tog('why','${p.id}')">${app.why[p.id] ? 'hide' : 'why this matters'}</button>
            ${app.why[p.id] ? `<div style="margin-top:8px;color:var(--tx-2)">${p.concept}</div>` : ''}
          </div>`;
      }

      h += `<div class="navrow">
          <button class="btn btn-sm" onclick="nav(-1)" ${app.cur === 0 ? 'disabled style="opacity:.4"' : ''}>&larr; Prev</button>
          <button class="btn btn-sm" onclick="nav(1)" ${app.cur === PROBLEMS.length - 1 ? 'disabled style="opacity:.4"' : ''}>Next &rarr;</button>
          <button class="btn btn-sm" onclick="regen()">New numbers</button>
          <span class="spacer"></span>
          <span style="font-size:12px;color:var(--tx-3)">${app.cur + 1} / ${PROBLEMS.length}</span>
        </div>
      </div>`;
      return h;
    }

    function viewList() {
      const solved = app.solved.size, total = PROBLEMS.length;
      const byDiff = d => PROBLEMS.filter(p => p.diff === d && app.solved.has(p.id)).length;
      let h = `<div class="stat-grid">
          <div class="stat"><div class="stat-val">${solved}</div><div class="stat-lbl">solved</div></div>
          <div class="stat"><div class="stat-val">${total - solved}</div><div class="stat-lbl">remaining</div></div>
          <div class="stat"><div class="stat-val">${Math.round(solved / total * 100)}%</div><div class="stat-lbl">complete</div></div>
          <div class="stat"><div class="stat-val">${byDiff('hard') + byDiff('expert')}</div><div class="stat-lbl">hard+ solved</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${solved / total * 100}%"></div></div>
        <div class="card"><div class="plist">`;

      MODULES.forEach((m, mi) => {
        const list = PROBLEMS.filter(p => p.mod === m.id);
        const done = list.filter(p => app.solved.has(p.id)).length;
        h += `<div class="modhead"><span class="t">${mi + 1}. ${m.name}</span><span class="line"></span><span class="c">${done}/${list.length}</span></div>`;
        list.forEach(p => {
          const i = PROBLEMS.indexOf(p), ok = app.solved.has(p.id);
          h += `<div class="pitem ${ok ? 'solved' : ''} ${i === app.cur ? 'current' : ''}" onclick="go(${i})">
              <div class="pi-icon ${ok ? 'yes' : 'no'}">${ok ? '&#10003;' : i + 1}</div>
              <div class="pi-info"><div class="pi-title">${p.title}</div><div class="pi-sub">${p.ask}</div></div>
              <span class="badge badge-${p.diff}">${p.diff}</span>
            </div>`;
        });
      });

      h += `</div><div class="navrow"><button class="btn btn-sm" onclick="resetAll()">Reset progress</button></div></div>`;
      return h;
    }

    /* ---------- actions ---------- */
    function setTab(t) {app.tab = t; view();}
    function go(i) {app.cur = i; app.tab = 'learn'; view();}
    function nav(d) {app.cur = Math.max(0, Math.min(PROBLEMS.length - 1, app.cur + d)); view();}
    function tog(k, id) {app[k][id] = !app[k][id]; view();}

    function submit() {
      const p = PROBLEMS[app.cur];
      const given = app.inputs[p.id] || '';
      if (!given.trim()) return;
      app.tried[p.id] = (app.tried[p.id] || 0) + 1;
      const s = p.s;
      const cands = [s.answer, ...(s.alts || [])];
      if (cands.some(c => accepts(c, given))) {
        app.feedback[p.id] = 'correct';
        app.solved.add(p.id);
        save();
      } else {
        app.feedback[p.id] = 'wrong';
      }
      view();
    }

    function regen() {
      const p = PROBLEMS[app.cur];
      p.s = p.setup();
      app.feedback[p.id] = null;
      app.reveal[p.id] = false;
      app.inputs[p.id] = '';
      app.tried[p.id] = 0;
      view();
    }

    function resetAll() {
      app.solved.clear(); app.feedback = {}; app.reveal = {}; app.inputs = {}; app.tried = {};
      save(); view();
    }
    /* ============================================================
       PART 8 — the register lab
       A scratchpad: poke bits, apply an operation, and watch exactly
       which bits moved and what that means in a real register.
       ============================================================ */
    function labApply(desc, nv) {
      const L = app.lab;
      L.prev = L.value;
      L.value = clampW(nv, L.w);
      L.hist.unshift({desc, from: L.prev, to: L.value, w: L.w});
      if (L.hist.length > 12) L.hist.pop();
      view();
    }

    function labBit(i) {
      const L = app.lab;
      labApply(`^= (1 << ${i})`, L.value ^ (1 << i));
    }
    function labWidth(w) {
      const L = app.lab;
      L.w = +w; L.value = clampW(L.value, L.w); L.prev = clampW(L.prev, L.w);
      if (L.reg !== 'none' && REGMAPS[L.reg] && REGMAPS[L.reg].width !== L.w) L.reg = 'none';
      view();
    }
    function labReg(name) {
      const L = app.lab;
      L.reg = name;
      if (name !== 'none') {L.w = REGMAPS[name].width; L.value = clampW(L.value, L.w);}
      view();
    }
    function labVal(str) {
      const n = numOf(norm(str));
      if (n === null) return;
      const L = app.lab;
      L.prev = L.value; L.value = clampW(n, L.w);
      app.focusId = 'labval';
      view();
    }
    function labField(k, v) {app.lab[k] = v;}

    function labOp(kind) {
      const L = app.lab, v = L.value, w = L.w;
      const b = Math.min(w - 1, Math.max(0, parseInt(L.bit, 10) || 0));
      const m = clampW(numOf(norm(L.mask)) || 0, w);
      const n = Math.min(w - 1, Math.max(1, parseInt(L.shift, 10) || 1));
      const ops = {
        set: [`|= (1 << ${b})`, v | (1 << b)],
        clr: [`&= ~(1 << ${b})`, v & ~(1 << b)],
        tgl: [`^= (1 << ${b})`, v ^ (1 << b)],
        and: [`&= ${hx(m, w)}`, v & m],
        or: [`|= ${hx(m, w)}`, v | m],
        xor: [`^= ${hx(m, w)}`, v ^ m],
        andn: [`&= ~${hx(m, w)}`, v & ~m],
        not: ['= ~value', ~v],
        shl: [`<<= ${n}`, v << n],
        shr: [`>>= ${n}  (logical)`, U(v) >>> n],
        sar: [`>>= ${n}  (arithmetic)`, signed(v, w) >> n],
        rol: [`rotate left ${n}`, rol(v, n, w)],
        ror: [`rotate right ${n}`, ror(v, n, w)],
        rev: ['byte swap', w === 32 ? U(((v & 0xFF) << 24) | ((v & 0xFF00) << 8) | ((v >>> 8) & 0xFF00) | (v >>> 24)) : w === 16 ? ((v << 8) | (v >>> 8)) & 0xFFFF : revByte(v)],
        low: ['= value & -value', v & -v],
        clrlow: ['&= (value - 1)', v & (v - 1)],
        zero: ['= 0', 0],
        all: [`= ${hx(maskW(w), w)}`, maskW(w)],
        rand: ['= random', rnd(0, maskW(w))]
      };
      const [desc, nv] = ops[kind];
      labApply(desc, nv);
    }

    function viewLab() {
      const L = app.lab;
      const map = L.reg !== 'none' ? REGMAPS[L.reg] : null;
      const changed = L.prev !== L.value;

      let h = `<div class="card">
        <h3>Register lab</h3>
        <p style="font-size:13px;color:var(--tx-2);margin-top:4px">Click any bit to toggle it, or apply an operation and watch which bits moved. Nothing here is graded &mdash; it is for building intuition about a specific register.</p>

        <div class="labgrid">
          <div class="labfield"><label>width</label>
            <select onchange="labWidth(this.value)">
              ${[8, 16, 32].map(w => `<option value="${w}" ${L.w === w ? 'selected' : ''}>${w}-bit</option>`).join('')}
            </select>
          </div>
          <div class="labfield"><label>register overlay</label>
            <select onchange="labReg(this.value)">
              <option value="none" ${L.reg === 'none' ? 'selected' : ''}>plain register</option>
              ${Object.entries(REGMAPS).map(([k, r]) => `<option value="${k}" ${L.reg === k ? 'selected' : ''}>${r.name} (${r.width}-bit)</option>`).join('')}
            </select>
          </div>
          <div class="labfield"><label>value</label>
            <input type="text" id="labval" value="${hx(L.value, L.w)}"
                   onchange="labVal(this.value)" onkeydown="if(event.key==='Enter')labVal(this.value)">
          </div>
        </div>`;

      h += title('current state')
        + valBoard(L.w, L.value, {
          label: map ? map.name.replace(/^.*_/, '') : 'reg',
          fields: map ? map.fields : null,
          click: 'labBit',
          marks: changed ? cellMarks(L.prev, L.value, L.w) : {}
        })
        + (map ? note(map.legend) : '');

      if (changed) {
        h += title('what the last operation did')
          + transBoard(L.w, L.prev, L.value, true, {fields: map ? map.fields : null, lb: 'before', la: 'after'});
      }

      h += title('operations')
        + `<div class="oprow">
            <span style="font-size:12px;color:var(--tx-3)">bit</span>
            <input type="text" value="${L.bit}" oninput="labField('bit',this.value)" style="width:60px">
            <button class="btn btn-sm mono" onclick="labOp('set')">|= 1&lt;&lt;n</button>
            <button class="btn btn-sm mono" onclick="labOp('clr')">&amp;= ~(1&lt;&lt;n)</button>
            <button class="btn btn-sm mono" onclick="labOp('tgl')">^= 1&lt;&lt;n</button>
          </div>
          <div class="oprow">
            <span style="font-size:12px;color:var(--tx-3)">mask</span>
            <input type="text" value="${esc(L.mask)}" oninput="labField('mask',this.value)">
            <button class="btn btn-sm mono" onclick="labOp('and')">&amp;=</button>
            <button class="btn btn-sm mono" onclick="labOp('or')">|=</button>
            <button class="btn btn-sm mono" onclick="labOp('xor')">^=</button>
            <button class="btn btn-sm mono" onclick="labOp('andn')">&amp;= ~m</button>
            <button class="btn btn-sm mono" onclick="labOp('not')">~</button>
          </div>
          <div class="oprow">
            <span style="font-size:12px;color:var(--tx-3)">shift</span>
            <input type="text" value="${L.shift}" oninput="labField('shift',this.value)" style="width:60px">
            <button class="btn btn-sm mono" onclick="labOp('shl')">&lt;&lt;</button>
            <button class="btn btn-sm mono" onclick="labOp('shr')">&gt;&gt; logical</button>
            <button class="btn btn-sm mono" onclick="labOp('sar')">&gt;&gt; arith</button>
            <button class="btn btn-sm mono" onclick="labOp('rol')">rol</button>
            <button class="btn btn-sm mono" onclick="labOp('ror')">ror</button>
            <button class="btn btn-sm mono" onclick="labOp('rev')">byte swap</button>
          </div>
          <div class="oprow">
            <span style="font-size:12px;color:var(--tx-3)">tricks</span>
            <button class="btn btn-sm mono" onclick="labOp('low')">n &amp; -n</button>
            <button class="btn btn-sm mono" onclick="labOp('clrlow')">n &amp; (n-1)</button>
            <button class="btn btn-sm" onclick="labOp('zero')">clear all</button>
            <button class="btn btn-sm" onclick="labOp('all')">set all</button>
            <button class="btn btn-sm" onclick="labOp('rand')">randomise</button>
          </div>`;

      h += title('readouts')
        + chips([
          ['hex', hx(L.value, L.w)],
          ['unsigned', String(U(L.value))],
          ['signed', String(signed(L.value, L.w))],
          ['bits set', String(popcount(L.value))],
          ['lowest set', L.value ? 'bit ' + ctz(L.value) : '—'],
          ['highest set', L.value ? 'bit ' + msbIndex(L.value) : '—'],
          ['power of 2', L.value && !(L.value & (L.value - 1)) ? 'yes' : 'no']
        ]);

      if (map) {
        h += title('decoded fields')
          + `<table class="memtbl"><tr><th>field</th><th>bits</th><th>binary</th><th>value</th></tr>`
          + map.fields.filter(f => ((U(L.value) & fieldMask(f.hi, f.lo)) !== 0) || map.fields.length <= 12)
            .map(f => {
              const v = (U(L.value) & fieldMask(f.hi, f.lo)) >>> f.lo;
              return `<tr><td class="val">${esc(f.title || f.name)}</td><td class="addr">[${f.hi}:${f.lo}]</td>
                <td>0b${bin(v, f.hi - f.lo + 1)}</td><td class="val">${v}</td></tr>`;
            }).join('')
          + `</table>`;
      }

      if (L.w > 8) {
        h += title('how this word sits in memory') + endianBoard(0x20000000, L.value, L.w);
      }

      if (L.hist.length) {
        h += title('history') + `<div class="histlog">`
          + L.hist.map(e => `<div><span class="res">${hx(e.from, e.w)}</span> <span class="arrow">${esc(e.desc)} &rarr;</span> <span class="res">${hx(e.to, e.w)}</span></div>`).join('')
          + `</div>`;
      }

      return h + `</div>`;
    }

    /* ============================================================
       PART 9 — reference
       ============================================================ */
    function refTable(rows) {
      return `<div class="reftbl">${rows.map(([a, b]) => `<div>${a}</div><div>${esc(b)}</div>`).join('')}</div>`;
    }

    function viewRef() {
      return `<div class="card">
        <h3 style="margin-bottom:10px">Core idioms</h3>
        ${refTable([
        ['Test bit n', '(reg >> n) & 1'],
        ['Set bit n', 'reg |= (1u << n)'],
        ['Clear bit n', 'reg &= ~(1u << n)'],
        ['Toggle bit n', 'reg ^= (1u << n)'],
        ['Any flag in mask set', 'if (reg & MASK)'],
        ['All flags in mask set', 'if ((reg & MASK) == MASK)'],
        ['Mask of width w at lo', '((1u << w) - 1) << lo'],
        ['Extract field [hi:lo]', '(reg >> lo) & ((1u << (hi-lo+1)) - 1)'],
        ['Insert field', 'reg = (reg & ~MASK) | ((v << lo) & MASK)'],
        ['Lowest set bit', 'n & (-n)'],
        ['Clear lowest set bit', 'n & (n - 1)'],
        ['Index of lowest set bit', '__builtin_ctz(n)'],
        ['Is power of two', 'n && !(n & (n - 1))'],
        ['Align up to power of 2 a', '(x + a - 1) & ~(a - 1)'],
        ['Is aligned to a', '(x & (a - 1)) == 0'],
        ['Rotate left (32-bit)', '(v << r) | (v >> (32 - r))'],
        ['Swap 16-bit bytes', '(v << 8) | (v >> 8)'],
        ['Sign-extend n bits to 32', '(int32_t)(v << (32-n)) >> (32-n)'],
        ['Even parity of a byte', 'x^=x>>4; x^=x>>2; x^=x>>1; x&1'],
        ['Ring buffer advance', 'i = (i + 1) & (SIZE - 1)']
      ])}
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px">STM32 register patterns</h3>
        ${refTable([
        ['Enable a GPIO clock', 'RCC->AHB1ENR |= RCC_AHB1ENR_GPIOAEN'],
        ['Set pin mode (2 bits/pin)', 'MODER = (MODER & ~(3u<<2*p)) | (m<<2*p)'],
        ['Alternate function (4 bits/pin)', 'AFR[p>>3] |= af << (4*(p&7))'],
        ['Drive pin high, atomically', 'GPIOx->BSRR = (1u << p)'],
        ['Drive pin low, atomically', 'GPIOx->BSRR = (1u << (p + 16))'],
        ['Clear a W1C flag', 'EXTI->PR = (1u << p)   // never |='],
        ['Wait for a status flag', 'while (!(USART->SR & USART_SR_TXE))'],
        ['NVIC priority (4 bits used)', 'NVIC->IP[n] = prio << 4'],
        ['Read-modify-write a field', 'reg = (reg & ~MASK) | VALUE']
      ])}
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px">Traps worth remembering</h3>
        ${refTable([
        ['|= on a write-1-to-clear register', 'clears every other pending flag too'],
        ['Missing the clear in a RMW', 'old field ORs with new, giving a third mode'],
        ['1 << 31 on a signed int', 'undefined; use 1u << 31'],
        ['Shift count >= type width', 'undefined behaviour, not zero'],
        ['~x compared to a narrow value', 'promotion makes the top 24 bits 1'],
        ['>> on a signed negative value', 'rounds down, unlike / which rounds to zero'],
        ['Unmasked value written to a field', 'spills into the neighbouring field'],
        ['Peripheral register without volatile', 'the compiler caches or removes the access'],
        ['uint8_t << 24', 'promotes to int; cast to uint32_t first'],
        ['Reading a 32-bit reg as two 16-bit', 'hardware may latch; check the manual']
      ])}
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px">Widths and bases</h3>
        ${refTable([
        ['Nibble', '4 bits, one hex digit, 0x0-0xF'],
        ['Byte / uint8_t', '8 bits, 0x00-0xFF, 0-255 or -128..127'],
        ['Half-word / uint16_t', '16 bits, 0x0000-0xFFFF, 0-65535'],
        ['Word / uint32_t', '32 bits, max 0xFFFFFFFF = 4294967295'],
        ['Bit i weight', '2^i'],
        ['n bits hold', '2^n distinct values'],
        ['Cortex-M byte order', 'little-endian: LSB at the lowest address'],
        ['Network byte order', 'big-endian: MSB first on the wire']
      ])}
      </div>`;
    }

    /* ============================================================
       PART 10 — wiring
       ============================================================ */
    Object.assign(window, {
      app, setTab, go, nav, tog, submit, regen, resetAll,
      labBit, labOp, labWidth, labReg, labVal, labField
    });

    document.addEventListener('keydown', e => {
      if (app.tab !== 'learn') return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowLeft') {nav(-1); e.preventDefault();}
      if (e.key === 'ArrowRight') {nav(1); e.preventDefault();}
    });

    load();
    view();
  </script>
</body>

</html>
