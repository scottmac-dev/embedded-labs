<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit Lab — bit manipulation for embedded engineers</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --bg-1: #111827;
      --bg-2: #1a2434;
      --bg-3: #232f42;

      --tx-1: #f3f4f6;
      --tx-2: #9ca3af;
      --tx-3: #6b7280;

      --bd-1: #2b3648;
      --bd-2: #374151;

      --accent: #60a5fa;
      --accent-dim: rgba(96, 165, 250, 0.15);

      --on: #4ade80;
      --on-bg: rgba(34, 197, 94, 0.16);
      --on-bd: rgba(34, 197, 94, 0.4);

      --set: #22c55e;
      --clr: #f87171;
      --hl: #fbbf24;
      --fill: #38bdf8;
      --unk: #c084fc;

      --r-sm: 5px;
      --r-md: 8px;
      --r-lg: 14px;

      --font-sans: Inter, system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--tx-1);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
    }

    /* ---------- header / tabs ---------- */
    .masthead {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .masthead h1 {
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .masthead .sub {
      font-size: 13px;
      color: var(--tx-3);
    }

    .tab-bar {
      display: flex;
      gap: 2px;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--bd-1);
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 15px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--tx-2);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: inherit;
      transition: color .15s, background .15s;
    }

    .tab.active {
      color: var(--tx-1);
      border-bottom-color: var(--accent);
      font-weight: 550;
    }

    .tab:hover:not(.active) {
      color: var(--tx-1);
      background: rgba(255, 255, 255, .03);
    }

    .card {
      background: var(--bg-1);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-lg);
      padding: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .18);
    }

    .card+.card {
      margin-top: 1rem;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
    }

    h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .mono {
      font-family: var(--font-mono);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--r-md);
      white-space: nowrap;
    }

    .badge-easy {
      background: rgba(34, 197, 94, .15);
      color: #86efac;
    }

    .badge-medium {
      background: rgba(245, 158, 11, .15);
      color: #fcd34d;
    }

    .badge-hard {
      background: rgba(239, 68, 68, .15);
      color: #fca5a5;
    }

    .badge-expert {
      background: rgba(139, 92, 246, .15);
      color: #c4b5fd;
    }

    .section-title {
      font-size: 11px;
      font-weight: 650;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 16px 0 6px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    /* ---------- bit diagram grid ---------- */
    .bdg-wrap {
      overflow-x: auto;
      padding: 2px 0;
    }

    .bdg {
      display: grid;
      align-items: center;
      row-gap: 3px;
      column-gap: 2px;
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      padding: 10px 12px;
      margin: 6px 0;
    }

    .bdg.w32 {
      --bfs: 10px;
      --lblw: 58px;
      --hexw: 96px;
      min-width: 700px;
    }

    .bdg.w16 {
      --bfs: 12px;
      --lblw: 70px;
      --hexw: 110px;
      min-width: 520px;
    }

    .bdg.w8 {
      --bfs: 13px;
      --lblw: 78px;
      --hexw: 120px;
      min-width: 420px;
    }

    .bdg.w12 {
      --bfs: 12px;
      --lblw: 70px;
      --hexw: 110px;
      min-width: 470px;
    }

    .blbl {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--tx-2);
      text-align: right;
      padding-right: 8px;
      white-space: nowrap;
      overflow: hidden;
    }

    .blbl.op {
      font-size: 15px;
      color: var(--hl);
      font-weight: 700;
    }

    .bhex {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--tx-2);
      text-align: left;
      padding-left: 9px;
      white-space: nowrap;
    }

    .bhex b {
      color: var(--tx-1);
      font-weight: 600;
    }

    .bhex i {
      color: var(--tx-3);
      font-style: normal;
    }

    .bcell {
      height: 26px;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: var(--bfs);
      font-weight: 600;
      background: var(--bg-3);
      color: var(--tx-3);
      border: 1px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
    }

    .bcell.on {
      background: var(--on-bg);
      color: var(--on);
      border-color: var(--on-bd);
    }

    .bcell.mk-set {
      background: rgba(34, 197, 94, .3);
      color: #bbf7d0;
      border-color: var(--set);
      box-shadow: 0 0 0 1px var(--set), 0 0 10px rgba(34, 197, 94, .35);
    }

    .bcell.mk-clr {
      background: rgba(248, 113, 113, .2);
      color: #fecaca;
      border-color: var(--clr);
      box-shadow: 0 0 0 1px var(--clr);
    }

    .bcell.mk-hl {
      border-color: var(--hl);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, .55);
    }

    .bcell.mk-fill {
      background: rgba(56, 189, 248, .18);
      color: #bae6fd;
      border-color: var(--fill);
    }

    .bcell.mk-drop {
      background: transparent;
      color: var(--tx-3);
      border: 1px dashed var(--bd-2);
      opacity: .55;
      text-decoration: line-through;
    }

    .bcell.mk-q {
      background: rgba(192, 132, 252, .12);
      color: var(--unk);
      border: 1px dashed rgba(192, 132, 252, .5);
    }

    .bcell.mk-dim {
      opacity: .35;
    }

    .bcell.click {
      cursor: pointer;
    }

    .bcell.click:hover {
      border-color: var(--accent);
    }

    .bidx {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--tx-3);
      text-align: center;
      line-height: 1;
    }

    .bwt {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--tx-3);
      text-align: center;
      line-height: 1;
    }

    .bwt.lit {
      color: var(--on);
    }

    .bmark {
      font-size: 10px;
      text-align: center;
      line-height: 1;
      height: 11px;
    }

    .bmark.set {
      color: var(--set);
    }

    .bmark.clr {
      color: var(--clr);
    }

    .bmark.same {
      color: var(--tx-3);
      opacity: .4;
    }

    .brule {
      height: 1px;
      background: var(--bd-2);
      margin: 3px 0;
    }

    .fspan {
      font-size: 9px;
      font-family: var(--font-mono);
      text-align: center;
      border-radius: 3px 3px 0 0;
      padding: 2px 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-bottom: 2px solid currentColor;
    }

    .fspan.res {
      border-bottom-color: var(--bd-1);
      color: var(--tx-3);
    }

    .fspan.t0 {
      color: #7dd3fc;
      background: rgba(56, 189, 248, .1);
    }

    .fspan.t1 {
      color: #fcd34d;
      background: rgba(251, 191, 36, .1);
    }

    .fspan.t2 {
      color: #c4b5fd;
      background: rgba(167, 139, 250, .1);
    }

    .fspan.t3 {
      color: #86efac;
      background: rgba(74, 222, 128, .1);
    }

    .fspan.t4 {
      color: #f9a8d4;
      background: rgba(244, 114, 182, .1);
    }

    .fspan.t5 {
      color: #fdba74;
      background: rgba(251, 146, 60, .1);
    }

    .nhex {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--tx-2);
      text-align: center;
      background: rgba(255, 255, 255, .04);
      border-radius: 3px;
      padding: 1px 0;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11px;
      color: var(--tx-2);
      margin-top: 8px;
      padding-left: 2px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      border: 1px solid;
      display: inline-block;
    }

    .sw-on {
      background: var(--on-bg);
      border-color: var(--on-bd);
    }

    .sw-set {
      background: rgba(34, 197, 94, .3);
      border-color: var(--set);
    }

    .sw-clr {
      background: rgba(248, 113, 113, .2);
      border-color: var(--clr);
    }

    .sw-hl {
      background: transparent;
      border-color: var(--hl);
    }

    .sw-fill {
      background: rgba(56, 189, 248, .18);
      border-color: var(--fill);
    }

    .sw-drop {
      background: transparent;
      border-color: var(--bd-2);
      border-style: dashed;
    }

    .sw-q {
      background: rgba(192, 132, 252, .12);
      border-color: rgba(192, 132, 252, .5);
      border-style: dashed;
    }

    /* ---------- code / notes ---------- */
    .code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      padding: 10px 13px;
      margin: 6px 0;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .code .k {
      color: #c4b5fd;
    }

    .code .n {
      color: #7dd3fc;
    }

    .code .c {
      color: var(--tx-3);
    }

    .code .h {
      color: var(--hl);
    }

    .note {
      font-size: 13px;
      line-height: 1.6;
      color: var(--tx-2);
      background: rgba(96, 165, 250, .07);
      border-left: 2px solid var(--accent);
      border-radius: 0 var(--r-md) var(--r-md) 0;
      padding: 9px 13px;
      margin: 8px 0;
    }

    .note b {
      color: var(--tx-1);
      font-weight: 600;
    }

    .note code {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--hl);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .chip {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      color: var(--tx-2);
    }

    .chip b {
      color: var(--tx-1);
    }

    .chip.hot {
      border-color: var(--hl);
      color: #fcd34d;
    }

    .chip.cool {
      border-color: var(--fill);
      color: #bae6fd;
    }

    /* ---------- memory table ---------- */
    .memtbl {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      margin: 6px 0;
    }

    .memtbl th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--tx-3);
      text-align: left;
      padding: 4px 8px;
      font-weight: 600;
      border-bottom: 1px solid var(--bd-1);
    }

    .memtbl td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--bd-1);
      color: var(--tx-2);
    }

    .memtbl td.addr {
      color: var(--tx-3);
    }

    .memtbl td.val {
      color: var(--tx-1);
      font-weight: 600;
    }

    .memtbl tr:last-child td {
      border-bottom: none;
    }

    .bsrc0 {
      background: rgba(56, 189, 248, .13);
    }

    .bsrc1 {
      background: rgba(251, 191, 36, .13);
    }

    .bsrc2 {
      background: rgba(167, 139, 250, .13);
    }

    .bsrc3 {
      background: rgba(74, 222, 128, .13);
    }

    /* ---------- controls ---------- */
    .answer-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    input[type=text],
    select {
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid var(--bd-2);
      border-radius: var(--r-md);
      background: var(--bg-2);
      color: var(--tx-1);
      outline: none;
    }

    input[type=text] {
      width: 300px;
    }

    select {
      font-family: var(--font-sans);
      cursor: pointer;
    }

    input[type=text]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .btn {
      padding: 8px 15px;
      border: 1px solid var(--bd-2);
      border-radius: var(--r-md);
      background: transparent;
      color: var(--tx-1);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: background .1s, border-color .1s;
    }

    .btn:hover {
      background: var(--bg-2);
      border-color: #4b5563;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn.mono {
      font-family: var(--font-mono);
    }

    .linkbtn {
      font-size: 12px;
      color: var(--tx-2);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      font-family: inherit;
    }

    .linkbtn:hover {
      color: var(--tx-1);
    }

    .feedback {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: var(--r-md);
      font-size: 13px;
      border: 1px solid transparent;
      line-height: 1.6;
    }

    .feedback.correct {
      background: rgba(34, 197, 94, .12);
      color: #86efac;
      border-color: rgba(34, 197, 94, .25);
    }

    .feedback.wrong {
      background: rgba(239, 68, 68, .12);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, .25);
    }

    .feedback.hint {
      background: rgba(245, 158, 11, .12);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, .25);
    }

    .feedback b {
      color: inherit;
    }

    .feedback .mono {
      color: inherit;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg-2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 999px;
      transition: width .3s ease;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .stat {
      background: var(--bg-1);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      padding: 12px;
      text-align: center;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 650;
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--tx-2);
      margin-top: 2px;
    }

    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .crumb {
      font-size: 12px;
      color: var(--tx-3);
      margin-bottom: 3px;
    }

    .ask {
      font-size: 15px;
      line-height: 1.6;
      margin: 10px 0 4px;
    }

    .plist {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pitem {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 13px;
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: background .1s, border-color .1s;
      background: var(--bg-1);
    }

    .pitem:hover {
      background: var(--bg-2);
      border-color: var(--bd-2);
    }

    .pitem.solved {
      border-color: rgba(34, 197, 94, .35);
    }

    .pitem.current {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }

    .pi-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      font-family: var(--font-mono);
    }

    .pi-icon.yes {
      background: rgba(34, 197, 94, .15);
      color: #86efac;
    }

    .pi-icon.no {
      background: var(--bg-3);
      color: var(--tx-3);
    }

    .pi-info {
      flex: 1;
      min-width: 0;
    }

    .pi-title {
      font-size: 14px;
      font-weight: 500;
    }

    .pi-sub {
      font-size: 12px;
      color: var(--tx-3);
      margin-top: 1px;
    }

    .modhead {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 0 6px;
    }

    .modhead:first-child {
      padding-top: 0;
    }

    .modhead .t {
      font-size: 12px;
      font-weight: 650;
      color: var(--tx-2);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .modhead .c {
      font-size: 11px;
      color: var(--tx-3);
      font-family: var(--font-mono);
    }

    .modhead .line {
      flex: 1;
      height: 1px;
      background: var(--bd-1);
    }

    .modcard {
      background: linear-gradient(180deg, rgba(96, 165, 250, .08), transparent);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      margin-bottom: 1rem;
    }

    .modcard .t {
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 650;
    }

    .modcard h2 {
      margin: 3px 0 5px;
    }

    .modcard p {
      font-size: 13px;
      color: var(--tx-2);
      line-height: 1.6;
    }

    .navrow {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .spacer {
      margin-left: auto;
    }

    .reftbl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0;
      font-size: 13px;
    }

    .reftbl>div {
      padding: 6px 0;
      border-bottom: 1px solid var(--bd-1);
    }

    .reftbl>div:nth-child(2n) {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--hl);
      padding-left: 16px;
    }

    .reftbl>div:nth-last-child(-n+2) {
      border-bottom: none;
    }

    .labgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin: 8px 0;
    }

    .labfield {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .labfield label {
      font-size: 11px;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .oprow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin: 6px 0;
    }

    .oprow input[type=text] {
      width: 96px;
    }

    .histlog {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--tx-2);
      max-height: 150px;
      overflow-y: auto;
    }

    .histlog div {
      padding: 3px 0;
      border-bottom: 1px solid var(--bd-1);
    }

    .histlog div:last-child {
      border-bottom: none;
    }

    .histlog .arrow {
      color: var(--tx-3);
    }

    .histlog .res {
      color: var(--tx-1);
    }

    @media (max-width: 760px) {
      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .app {
        padding: 1rem .6rem 3rem;
      }
    }
  </style>
</head>

<body>
  <h1 class="sr-only">Bit manipulation trainer for embedded systems</h1>
  <div class="app" id="app"></div>
  <script>
    /* ============================================================
       PART 1 — numeric helpers
       ============================================================ */
    const U = v => v >>> 0;
    const maskW = w => w >= 32 ? 0xFFFFFFFF : U((1 << w) - 1);
    const clampW = (v, w) => U(U(v) & maskW(w));   // the extra U matters: x & 0xFFFFFFFF is signed in JS

    function bin(v, w) {return U(v).toString(2).padStart(w, '0').slice(-w);}
    function hx(v, w) {return '0x' + U(v).toString(16).toUpperCase().padStart(Math.ceil(w / 4), '0');}
    function fieldMask(hi, lo) {
      const n = hi - lo + 1;
      return U(n >= 32 ? 0xFFFFFFFF : ((1 << n) - 1) << lo);
    }
    function getBit(v, i) {return (U(v) >>> i) & 1;}
    function popcount(v) {let c = 0, x = U(v); while (x) {x &= x - 1; c++;} return c;}
    function ctz(v) {if (!U(v)) return -1; let i = 0; while (!getBit(v, i)) i++; return i;}
    function msbIndex(v) {if (!U(v)) return -1; let i = 31; while (!getBit(v, i)) i--; return i;}
    function revByte(v) {let r = 0; for (let i = 0; i < 8; i++) if (getBit(v, i)) r |= 1 << (7 - i); return r & 0xFF;}
    function parityBit(v) {let x = U(v), p = 0; while (x) {p ^= x & 1; x >>>= 1;} return p;}
    function signed(v, w) {const m = 1 << (w - 1); const x = clampW(v, w); return (x & m) ? x - (1 << w) : x;}
    function rol(v, r, w) {r %= w; return clampW((U(v) << r) | (U(v) >>> (w - r)), w);}
    function ror(v, r, w) {r %= w; return clampW((U(v) >>> r) | (U(v) << (w - r)), w);}

    const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
    const pick = arr => arr[rnd(0, arr.length - 1)];
    const rndByte = () => rnd(0, 255);
    function rndNZ(w = 8) {let v = 0; while (!v) v = rnd(0, maskW(w)); return v;}
    function rndBits(count, w = 8, from = 0) {
      const s = new Set();
      while (s.size < count) s.add(rnd(from, w - 1));
      return [...s].sort((a, b) => a - b);
    }
    function shuffle(a) {const r = a.slice(); for (let i = r.length - 1; i > 0; i--) {const j = rnd(0, i);[r[i], r[j]] = [r[j], r[i]];} return r;}

    /* ============================================================
       PART 2 — the bit diagram engine

       Every visual is one CSS grid so that field bands, bit indices,
       value rows, markers and hex columns all line up exactly:

         col 1          -> row label
         cols 2..w+1    -> bit w-1 .. bit 0  (MSB on the left)
         col w+2        -> hex / decimal readout
       ============================================================ */
    const colOf = (i, w) => 2 + (w - 1 - i);       // grid column for bit index i

    function esc(s) {return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');}

    // rows: array of row descriptors. Returns full diagram markup.
    function diagram(w, rows) {
      const cols = `var(--lblw) repeat(${w}, minmax(0,1fr)) var(--hexw)`;
      let h = `<div class="bdg-wrap"><div class="bdg w${w}" style="grid-template-columns:${cols}">`;
      for (const r of rows) h += rowHTML(w, r);
      return h + '</div></div>';
    }

    function lbl(text, cls = '') {return `<div class="blbl ${cls}" style="grid-column:1">${esc(text)}</div>`;}
    function tail(html) {return `<div class="bhex">${html}</div>`;}

    function rowHTML(w, r) {
      switch (r.type) {
        case 'fields': return lbl(r.label || '') + fieldSpans(w, r.fields) + tail('');

        case 'index': {
          let h = lbl(r.label || '');
          for (let i = w - 1; i >= 0; i--) h += `<div class="bidx" style="grid-column:${colOf(i, w)}">${i}</div>`;
          return h + tail(r.tail || '');
        }

        case 'weights': {
          let h = lbl(r.label || 'weight');
          for (let i = w - 1; i >= 0; i--) {
            const on = getBit(r.value, i);
            h += `<div class="bwt ${on ? 'lit' : ''}" style="grid-column:${colOf(i, w)}">${Math.pow(2, i)}</div>`;
          }
          return h + tail(r.tail || '');
        }

        case 'bits': {
          const marks = r.marks || {};
          let h = lbl(r.label || '', r.op ? 'op' : '');
          for (let i = w - 1; i >= 0; i--) {
            const mk = marks[i] ? ' mk-' + marks[i] : '';
            const ch = r.unknown ? '?' : bin(r.value, w)[w - 1 - i];
            const on = !r.unknown && ch === '1' ? ' on' : '';
            const click = r.click ? ` class="bcell${on}${mk} click" onclick="${r.click}(${i})"` : ` class="bcell${on}${mk}"`;
            h += `<div${click} style="grid-column:${colOf(i, w)}" title="bit ${i}">${ch}</div>`;
          }
          return h + tail(r.unknown ? '<i>?</i>' : (r.tail !== undefined ? r.tail : readout(r.value, w)));
        }

        case 'marks': {
          let h = lbl(r.label || '');
          for (let i = w - 1; i >= 0; i--) {
            const m = (r.marks || {})[i];
            const g = m === 'set' ? '&#9650;' : m === 'clr' ? '&#9660;' : m === 'same' ? '&middot;' : '';
            h += `<div class="bmark ${m || ''}" style="grid-column:${colOf(i, w)}">${g}</div>`;
          }
          return h + tail(r.tail || '');
        }

        case 'nibhex': {
          let h = lbl(r.label || 'hex');
          for (let n = w / 4 - 1; n >= 0; n--) {
            const d = (U(r.value) >>> (n * 4)) & 0xF;
            h += `<div class="nhex" style="grid-column:${colOf(n * 4 + 3, w)}/span 4">${d.toString(16).toUpperCase()}</div>`;
          }
          return h + tail(r.tail || '');
        }

        case 'rule': return lbl(r.op || '', 'op') + `<div class="brule" style="grid-column:2/span ${w}"></div>` + tail('');

        case 'gap': return `<div style="grid-column:1/span ${w + 2};height:${r.h || 4}px"></div>`;

        default: return '';
      }
    }

    function readout(v, w) {
      return `<b>${hx(v, w)}</b> <i>${U(v) >>> 0}</i>`;
    }

    function fieldSpans(w, fields) {
      let out = '', i = w - 1;
      const at = b => fields.find(f => b <= f.hi && b >= f.lo);
      while (i >= 0) {
        const f = at(i);
        if (f) {
          const hi = Math.min(f.hi, w - 1), lo = Math.max(f.lo, 0);
          out += `<div class="fspan t${f.tone === undefined ? 0 : f.tone % 6}" title="${esc(f.title || f.name)} [${hi}:${lo}]" style="grid-column:${colOf(hi, w)}/span ${hi - lo + 1}">${esc(f.name)}</div>`;
          i = lo - 1;
        } else {
          let j = i; while (j >= 0 && !at(j)) j--;
          out += `<div class="fspan res" style="grid-column:${colOf(i, w)}/span ${i - j}"></div>`;
          i = j;
        }
      }
      return out;
    }

    /* mark helpers */
    function diffMarks(before, after, w) {
      const m = {};
      for (let i = 0; i < w; i++) {
        const b = getBit(before, i), a = getBit(after, i);
        m[i] = b === a ? 'same' : (a ? 'set' : 'clr');
      }
      return m;
    }
    function cellMarks(before, after, w) {
      const m = {};
      for (let i = 0; i < w; i++) {
        const b = getBit(before, i), a = getBit(after, i);
        if (b !== a) m[i] = a ? 'set' : 'clr';
      }
      return m;
    }
    function maskMarks(mask, w, cls = 'hl') {
      const m = {};
      for (let i = 0; i < w; i++) if (getBit(mask, i)) m[i] = cls;
      return m;
    }
    function rangeMarks(lo, hi, cls = 'hl') {
      const m = {};
      for (let i = lo; i <= hi; i++) m[i] = cls;
      return m;
    }
    function mergeMarks(...ms) {return Object.assign({}, ...ms);}

    function legend(items) {
      const map = {
        on: ['sw-on', '1 bit'], off: ['', '0 bit'],
        set: ['sw-set', 'turned 0&rarr;1'], clr: ['sw-clr', 'turned 1&rarr;0'],
        hl: ['sw-hl', 'bits the mask selects'], fill: ['sw-fill', 'shifted in'],
        drop: ['sw-drop', 'shifted out (lost)'], q: ['sw-q', 'you work this out']
      };
      return `<div class="legend">${items.map(k => {
        const [c, t] = map[k];
        return `<span><i class="swatch ${c}"></i>${t}</span>`;
      }).join('')}</div>`;
    }
    /* ============================================================
       PART 3 — composite boards
       Each board answers one question: "what did this operation do
       to the register?"  All of them hide the result until solved.
       ============================================================ */

    /* a OP b -> result, with the mask bits highlighted and the
       changed bits marked once revealed. */
    function opBoard(w, a, b, sym, res, shown, o = {}) {
      const hi = maskMarks(b, w, 'hl');
      const rows = [
        {type: 'index'},
        {type: 'bits', label: o.la || 'value', value: a},
        {type: 'bits', label: sym, value: b, op: true, marks: o.plain ? {} : hi},
        {type: 'rule', op: '='},
        {type: 'bits', label: o.lr || 'result', value: res, unknown: !shown, marks: shown ? cellMarks(a, res, w) : {}}
      ];
      if (shown) rows.push({type: 'marks', marks: diffMarks(a, res, w), tail: changeSummary(a, res, w)});
      return diagram(w, rows) + legend(shown ? ['on', 'hl', 'set', 'clr'] : ['on', 'hl', 'q']);
    }

    function changeSummary(a, b, w) {
      let s = 0, c = 0;
      for (let i = 0; i < w; i++) {const x = getBit(a, i), y = getBit(b, i); if (x !== y) (y ? s++ : c++);}
      if (!s && !c) return '<i>no change</i>';
      return `<i>${s ? '+' + s : ''}${s && c ? ' / ' : ''}${c ? '-' + c : ''}</i>`;
    }

    /* single value, optionally with a field map above it */
    function valBoard(w, v, o = {}) {
      const rows = [];
      if (o.fields) rows.push({type: 'fields', fields: o.fields, label: o.fieldLabel || ''});
      rows.push({type: 'index'});
      rows.push({type: 'bits', label: o.label || 'value', value: v, marks: o.marks || {}, click: o.click, unknown: o.unknown, tail: o.tail});
      if (o.weights) rows.push({type: 'weights', value: v});
      if (o.nibhex) rows.push({type: 'nibhex', value: v});
      return diagram(w, rows) + (o.legend ? legend(o.legend) : '');
    }

    /* before -> after, e.g. a whole read-modify-write sequence */
    function transBoard(w, before, after, shown, o = {}) {
      const rows = [];
      if (o.fields) rows.push({type: 'fields', fields: o.fields});
      rows.push({type: 'index'});
      rows.push({type: 'bits', label: o.lb || 'before', value: before, marks: o.beforeMarks || {}});
      if (shown) {
        rows.push({type: 'marks', marks: diffMarks(before, after, w)});
        rows.push({type: 'bits', label: o.la || 'after', value: after, marks: cellMarks(before, after, w), tail: readout(after, w)});
      } else {
        rows.push({type: 'marks', marks: {}});
        rows.push({type: 'bits', label: o.la || 'after', value: after, unknown: true});
      }
      return diagram(w, rows) + legend(shown ? ['on', 'set', 'clr'] : ['on', 'q']);
    }

    /* shifts and rotates: shows what falls off the end and what feeds in */
    function shiftBoard(w, v, n, kind, res, shown) {
      const left = kind === 'shl' || kind === 'rol';
      const dropped = left ? (U(v) >>> (w - n)) & maskW(n) : U(v) & maskW(n);
      const fill = {};
      for (let i = 0; i < n; i++) fill[left ? i : w - 1 - i] = 'fill';

      const outLbl = left ? `bits ${w - 1}..${w - n} fall off the top` : `bits ${n - 1}..0 fall off the bottom`;
      const inLbl = {
        shl: `${n} zero${n > 1 ? 's' : ''} feed in at the bottom`,
        shr: `${n} zero${n > 1 ? 's' : ''} feed in at the top (logical)`,
        sar: `${n} copies of the sign bit feed in at the top`,
        rol: `the ${n} bit${n > 1 ? 's' : ''} that fell off the top re-enter at the bottom`,
        ror: `the ${n} bit${n > 1 ? 's' : ''} that fell off the bottom re-enter at the top`
      }[kind];

      const rows = [
        {type: 'index'},
        {type: 'bits', label: 'in', value: v, marks: left ? maskMarks(fieldMask(w - 1, w - n), w, 'drop') : maskMarks(maskW(n), w, 'drop')},
        {type: 'rule', op: left ? '≪' : '≫'},
        {type: 'bits', label: 'out', value: res, unknown: !shown, marks: shown ? fill : {}}
      ];
      const arrow = left ? '&larr;' : '&rarr;';
      return diagram(w, rows)
        + `<div class="chips"><span class="chip">${arrow} shift by <b>${n}</b></span>`
        + `<span class="chip hot">${outLbl}: <b>0b${bin(dropped, n)}</b></span>`
        + `<span class="chip cool">${inLbl}</span></div>`
        + legend(shown ? ['on', 'drop', 'fill'] : ['on', 'drop', 'q']);
    }

    /* how a multi-byte value actually sits in memory */
    function memBoard(base, value, w, o = {}) {
      const nb = w / 8;
      const bytes = [];
      for (let i = 0; i < nb; i++) bytes.push((U(value) >>> (i * 8)) & 0xFF);   // bytes[0] = LSB
      const order = o.endian === 'big' ? bytes.slice().reverse() : bytes;
      const idxOrder = o.endian === 'big' ? bytes.map((_, i) => nb - 1 - i) : bytes.map((_, i) => i);

      let rowsHTML = '';
      for (let a = 0; a < nb; a++) {
        const bi = idxOrder[a];
        rowsHTML += `<tr>
          <td class="addr">${hx(base + a, 32)}</td>
          <td class="val bsrc${bi % 4}">${hx(order[a], 8)}</td>
          <td class="bsrc${bi % 4}">0b${bin(order[a], 8)}</td>
          <td>${o.hideSrc ? '' : 'byte ' + bi + (bi === 0 ? ' (LSB)' : bi === nb - 1 ? ' (MSB)' : '')}</td>
        </tr>`;
      }
      return `<table class="memtbl">
        <tr><th>address</th><th>byte</th><th>binary</th><th>${o.hideSrc ? '' : 'source'}</th></tr>
        ${rowsHTML}</table>`;
    }

    /* both byte orders next to each other */
    function endianBoard(base, value, w) {
      return `<div class="labgrid">
        <div><div class="section-title">little-endian (ARM Cortex-M default)</div>${memBoard(base, value, w, {endian: 'little'})}</div>
        <div><div class="section-title">big-endian (network order)</div>${memBoard(base, value, w, {endian: 'big'})}</div>
      </div>`;
    }

    /* syntax-lit code block */
    function code(src) {
      let s = esc(src)
        .replace(/(0x[0-9A-Fa-f]+|0b[01]+)/g, '<span class="h">$1</span>')
        .replace(/\/\/[^\n]*/g, '<span class="c">$&</span>')
        .replace(/\b(uint8_t|uint16_t|uint32_t|int8_t|int16_t|int32_t|volatile|if|else|while|for|return|unsigned|signed|char|int|void|static|const)\b/g, '<span class="k">$1</span>');
      return `<div class="code">${s}</div>`;
    }
    function note(html) {return `<div class="note">${html}</div>`;}
    function title(t) {return `<div class="section-title">${t}</div>`;}
    function chips(list) {return `<div class="chips">${list.map(c => `<span class="chip ${c[2] || ''}">${c[0]} <b>${c[1]}</b></span>`).join('')}</div>`;}
    /* ============================================================
       PART 4 — curriculum
       Modules run in dependency order: you never need an idea that a
       later module introduces.
       ============================================================ */
    const MODULES = [
      {id: 'repr', name: 'Representation', blurb: 'Hex, binary and bit weights. Everything later assumes you can move between these without thinking about it.'},
      {id: 'bits', name: 'Single-bit operations', blurb: 'Test, set, clear and toggle. Four idioms that make up most of the register code you will ever write.'},
      {id: 'fields', name: 'Masks & bit fields', blurb: 'Real registers pack several settings into one word. Build a mask, extract a field, and write one back without disturbing its neighbours.'},
      {id: 'shifts', name: 'Shifts & rotates', blurb: 'What actually leaves the register and what feeds in. Logical vs arithmetic, and why the difference bites on signed data.'},
      {id: 'signed', name: 'Signed values & overflow', blurb: "Two's complement, sign extension of sensor samples, and wraparound at the edges of a fixed-width type."},
      {id: 'bytes', name: 'Bytes, words & memory', blurb: 'How a 32-bit value is laid out in memory, why byte order matters on the wire, and how to take a word apart and put it back together.'},
      {id: 'regs', name: 'Peripheral registers', blurb: 'The access rules that hardware imposes: read-modify-write, write-1-to-clear, set/reset registers, and the hazards each one creates.'},
      {id: 'tricks', name: 'Bit tricks', blurb: 'Branch-free idioms worth memorising: population count, lowest set bit, power-of-two tests, alignment, reversal and parity.'},
      {id: 'applied', name: 'Applied patterns', blurb: 'The above, combined: packed protocol frames, ring buffers, checksums, debouncing and fixed-point scaling.'}
    ];
    const MOD_INDEX = Object.fromEntries(MODULES.map((m, i) => [m.id, i]));

    /* register field maps reused by problems and by the Lab */
    const REGMAPS = {
      MODER: {
        name: 'GPIOx_MODER', width: 32,
        fields: Array.from({length: 16}, (_, p) => ({hi: 2 * p + 1, lo: 2 * p, name: 'M' + p, tone: p % 6, title: 'MODER' + p})),
        legend: '00 input · 01 output · 10 alternate function · 11 analog'
      },
      AHB1ENR: {
        name: 'RCC_AHB1ENR', width: 32,
        fields: [
          {hi: 0, lo: 0, name: 'A', tone: 0, title: 'GPIOAEN'}, {hi: 1, lo: 1, name: 'B', tone: 0, title: 'GPIOBEN'},
          {hi: 2, lo: 2, name: 'C', tone: 0, title: 'GPIOCEN'}, {hi: 3, lo: 3, name: 'D', tone: 0, title: 'GPIODEN'},
          {hi: 4, lo: 4, name: 'E', tone: 0, title: 'GPIOEEN'}, {hi: 5, lo: 5, name: 'F', tone: 0, title: 'GPIOFEN'},
          {hi: 6, lo: 6, name: 'G', tone: 0, title: 'GPIOGEN'}, {hi: 7, lo: 7, name: 'H', tone: 0, title: 'GPIOHEN'},
          {hi: 12, lo: 12, name: 'CRC', tone: 1}, {hi: 21, lo: 21, name: 'DMA1', tone: 2}, {hi: 22, lo: 22, name: 'DMA2', tone: 2}
        ],
        legend: 'one enable bit per peripheral clock'
      },
      CR1: {
        name: 'USART_CR1', width: 32,
        fields: [
          {hi: 2, lo: 2, name: 'RE', tone: 3}, {hi: 3, lo: 3, name: 'TE', tone: 3},
          {hi: 5, lo: 5, name: 'RXNEIE', tone: 4}, {hi: 6, lo: 6, name: 'TCIE', tone: 4}, {hi: 7, lo: 7, name: 'TXEIE', tone: 4},
          {hi: 9, lo: 9, name: 'PS', tone: 1}, {hi: 10, lo: 10, name: 'PCE', tone: 1},
          {hi: 12, lo: 12, name: 'M', tone: 2}, {hi: 13, lo: 13, name: 'UE', tone: 0}
        ],
        legend: 'UE enables the peripheral · TE/RE enable transmit/receive · *IE are interrupt enables'
      },
      TIM_CR1: {
        name: 'TIMx_CR1', width: 16,
        fields: [
          {hi: 0, lo: 0, name: 'CEN', tone: 0}, {hi: 1, lo: 1, name: 'UDIS', tone: 1}, {hi: 2, lo: 2, name: 'URS', tone: 1},
          {hi: 3, lo: 3, name: 'OPM', tone: 2}, {hi: 4, lo: 4, name: 'DIR', tone: 2},
          {hi: 6, lo: 5, name: 'CMS', tone: 3}, {hi: 7, lo: 7, name: 'ARPE', tone: 4}, {hi: 9, lo: 8, name: 'CKD', tone: 5}
        ],
        legend: 'CEN starts the counter · CMS is a 2-bit centre-aligned mode field'
      },
      EXTI_PR: {
        name: 'EXTI_PR', width: 32,
        fields: Array.from({length: 16}, (_, p) => ({hi: p, lo: p, name: '' + p, tone: p % 6, title: 'PR' + p})),
        legend: 'pending flags — write 1 to clear (W1C)'
      }
    };

    const GPIO_CLK = ['GPIOAEN', 'GPIOBEN', 'GPIOCEN', 'GPIODEN', 'GPIOEEN', 'GPIOFEN', 'GPIOGEN', 'GPIOHEN'];

    /* ---------- Module 1: representation ---------- */
    const P_A = [
      {
        id: 'r1', mod: 'repr', diff: 'easy', title: 'Hex to binary', fmt: 'bin',
        ask: 'Write this byte out in binary.',
        hint: 'Each hex digit is exactly four bits. Convert the two digits separately and stick them together.',
        concept: 'A hex digit maps 1:1 onto a nibble, so hex is just binary with the bits pre-grouped in fours. That is the whole reason datasheets use it.',
        setup() {const v = rnd(0x11, 0xEF); return {v, answer: '0b' + bin(v, 8)};},
        render(s, shown) {
          return title(`byte = ${hx(s.v, 8)}`)
            + valBoard(8, s.v, {label: 'value', unknown: !shown, nibhex: shown})
            + note(`Split it: <code>${hx(s.v >> 4, 4)}</code> is the high nibble (bits 7:4), <code>${hx(s.v & 0xF, 4)}</code> is the low nibble (bits 3:0).`);
        }
      },
      {
        id: 'r2', mod: 'repr', diff: 'easy', title: 'Binary to hex', fmt: 'hex',
        ask: 'Write this bit pattern as a hex byte.',
        hint: 'Group the bits into two nibbles of four, then convert each group to one hex digit.',
        concept: 'Going the other way: group from the LSB in fours. Grouping from the wrong end is the classic slip when the width is not a multiple of four.',
        setup() {const v = rnd(0x11, 0xEF); return {v, answer: hx(v, 8)};},
        render(s, shown) {
          return valBoard(8, s.v, {label: 'value', nibhex: shown, tail: shown ? undefined : ''})
            + (shown ? '' : note('Each group of four bits below becomes one hex digit. High nibble first.'));
        }
      },
      {
        id: 'r3', mod: 'repr', diff: 'easy', title: 'Bit weights', fmt: 'dec',
        ask: 'What is the decimal value of this byte?',
        hint: 'Add up the weight of every bit that is set. Bit i is worth 2^i.',
        concept: 'A register value is just a sum of powers of two. Being able to eyeball "bit 6 is set, so at least 64" makes debugging register dumps much faster.',
        setup() {const v = rnd(3, 250); return {v, answer: String(v)};},

              ? opBoard(32, s.a, 3, '&', s.a & 3, true, {la: 'addr', lr: 'addr&3'})
              + note(`Low two bits are 0b${bin(s.a & 3, 2)} &rarr; <b>${(s.a & 3) === 0 ? 'aligned' : 'not aligned'}</b>. To round up to the next 4-byte boundary: <code>(addr + 3) &amp; ~3</code> = ${hx((s.a + 3) & ~3, 32)}.`)
              : note('Only the two highlighted bits matter.'));
        }
      }
    ];
    /* ---------- Module 7: peripheral registers ---------- */
    const P_C = [
      {
        id: 'p1', mod: 'regs', diff: 'medium', title: 'Enable peripheral clocks', fmt: 'hex',
        ask: 'Enable the listed GPIO port clocks. Give the value of RCC_AHB1ENR after the write, in hex.',
        hint: 'One enable bit per port, ORed into whatever is already enabled.',
        concept: 'Nothing about a peripheral responds until its clock is running — a register write to a gated peripheral reads back as zero. It is the first thing to check when a driver does nothing at all.',
        setup() {
          const ports = rndBits(2, 8);
          const cur = pick([0, 1, 1 | (1 << 2)]);
          const m = ports.reduce((a, b) => a | (1 << b), 0);
          return {ports, cur, m, answer: hx(U(cur | m), 32)};
        },
        render(s, shown) {
          return code(`RCC->AHB1ENR |= ${s.ports.map(p => 'RCC_AHB1ENR_' + GPIO_CLK[p]).join('\n              | ')};`)
            + chips(s.ports.map(p => [GPIO_CLK[p], 'bit ' + p, 'hot']))
            + valBoard(32, s.cur, {label: 'before', fields: REGMAPS.AHB1ENR.fields})
            + (shown
              ? transBoard(32, s.cur, U(s.cur | s.m), true, {fields: REGMAPS.AHB1ENR.fields})
              + note(`Ports already enabled stay enabled — that is why the driver uses <code>|=</code> and not <code>=</code>. A plain assignment here would switch off every other peripheral clock in the register.`)
              : valBoard(32, 0, {label: 'after', unknown: true}));
        }
      },
      {
        id: 'p2', mod: 'regs', diff: 'hard', title: 'GPIO mode, done properly', fmt: 'hex',
        ask: 'Configure the given pin to the requested mode in MODER. Give the whole register value afterwards, in hex.',
        hint: 'Each pin owns 2 bits at position 2*pin. Clear both, then OR the mode in.',
        concept: 'The two-bit-per-pin layout is why <code>MODER |= (1 &lt;&lt; (2*pin))</code> alone is wrong: without clearing first you can only ever add bits, so switching from analog (11) to output (01) silently leaves you in analog.',
        setup() {
          const pin = rnd(0, 15);
          const cur = U(rnd(0, 0xFFFF) | (rnd(0, 0xFFFF) << 16));
          const m = fieldMask(2 * pin + 1, 2 * pin);
          const old = (cur & m) >>> (2 * pin);
          let mode = rnd(0, 3);
          while (mode === old) mode = rnd(0, 3);   // always an actual change
          return {pin, mode, cur, m, answer: hx(U((cur & ~m) | (mode << (2 * pin))), 32)};
        },
        render(s, shown) {
          const names = ['input', 'output', 'alternate function', 'analog'];
          const fin = U((s.cur & ~s.m) | (s.mode << (2 * s.pin)));
          return code(`GPIOA->MODER &= ~(0x3 << (2 * ${s.pin}));\nGPIOA->MODER |=  (${s.mode} << (2 * ${s.pin}));   // ${names[s.mode]}`)
            + chips([['pin', String(s.pin)], ['bits', `[${2 * s.pin + 1}:${2 * s.pin}]`, 'hot'], ['mode', `0b${bin(s.mode, 2)} — ${names[s.mode]}`, 'cool']])
            + (shown
              ? title('step 1 — clear both mode bits for this pin')
              + opBoard(32, s.cur, U(~s.m), '&', U(s.cur & ~s.m), true, {la: 'MODER', lr: 'cleared', plain: true})

              + transBoard(32, s.cur, fin, true, {fields: REGMAPS.MODER.fields})
              + note(`Only bits [${2 * s.pin + 1}:${2 * s.pin}] moved. The other 15 pins keep their configuration — several of them are probably driving something right now.`)
              : valBoard(32, s.cur, {label: 'MODER', fields: REGMAPS.MODER.fields, marks: rangeMarks(2 * s.pin, 2 * s.pin + 1)})
              + note(REGMAPS.MODER.legend));
        }
      },
      {
        id: 'p3', mod: 'regs', diff: 'hard', title: 'Atomic set and reset', fmt: 'hex',
        ask: 'Using BSRR, drive one pin high and another low in a single write. What value do you write, in hex?',
        hint: 'Low half sets, high half resets. Bit n sets pin n; bit n+16 resets pin n.',
        concept: 'BSRR exists so you never need a read-modify-write on ODR. A single store cannot be interrupted halfway, so no ISR can observe or corrupt an intermediate state.',
        setup() {
          const a = rnd(0, 15); let b = rnd(0, 15); while (b === a) b = rnd(0, 15);
          return {a, b, answer: hx(U((1 << a) | (1 << (b + 16))), 32)};
        },
        render(s, shown) {
          const v = U((1 << s.a) | (1 << (s.b + 16)));
          const F = [{hi: 31, lo: 16, name: 'BR — reset pins', tone: 4}, {hi: 15, lo: 0, name: 'BS — set pins', tone: 3}];
          return code(`GPIOA->BSRR = (1 << ${s.a}) | (1 << (${s.b} + 16));\n// pin ${s.a} high, pin ${s.b} low, one store, no read`)
            + valBoard(32, 0, {label: 'BSRR', fields: F})
            + (shown
              ? valBoard(32, v, {label: 'write', fields: F, marks: maskMarks(v, 32, 'set')})
              + note(`Writing 0 to a BSRR bit does nothing at all, so this touches exactly two pins. If both halves name the same pin, reset wins.`)

        }
      },
      {
        id: 'p4', mod: 'regs', diff: 'hard', title: 'Write-1-to-clear', fmt: 'hex',
        ask: 'Several interrupt flags are pending. Clear only the listed ones. What value do you write to the pending register, in hex?',
        hint: 'W1C means the write value is simply the mask of flags you want to clear. Do not read the register first.',
        concept: 'On a W1C register <code>reg |= mask</code> is a bug: the read pulls in every <em>other</em> pending flag, and the write then clears those too. You silently lose interrupts that arrived between the read and the write.',
        setup() {
          const pend = rndBits(4, 16);
          const clr = shuffle(pend).slice(0, 2).sort((a, b) => a - b);
          const cur = pend.reduce((a, b) => a | (1 << b), 0);
          return {pend, clr, cur, answer: hx(U(clr.reduce((a, b) => a | (1 << b), 0)), 32)};
        },
        render(s, shown) {
          const m = U(s.clr.reduce((a, b) => a | (1 << b), 0));
          return code(`EXTI->PR = ${s.clr.map(b => '(1 << ' + b + ')').join(' | ')};   // NOT |=`)
            + title('currently pending')
            + valBoard(32, s.cur, {label: 'PR', fields: REGMAPS.EXTI_PR.fields, marks: maskMarks(m, 32, 'hl')})
            + (shown
              ? title('the value you write') + valBoard(32, m, {label: 'write', marks: maskMarks(m, 32, 'set')})
              + title('resulting hardware state')
              + transBoard(32, s.cur, U(s.cur & ~m), true, {fields: REGMAPS.EXTI_PR.fields})
              + note(`Flags ${s.pend.filter(b => !s.clr.includes(b)).join(', ')} are still pending and will still interrupt. Using <code>|=</code> would have cleared them too.`)
              : note('Pending flags are shown above; the highlighted ones are the ones to clear.'));
        }
      },
      {
        id: 'p5', mod: 'regs', diff: 'expert', title: 'The read-modify-write hazard', fmt: 'hex',
        ask: 'A driver uses |= on this write-1-to-clear register while two flags are pending. Which flags end up cleared? Give the mask of cleared flags, in hex.',
        hint: 'The read picks up every pending flag; the OR adds yours; the write then clears everything that was 1 in the written value.',
        concept: 'This is the single most common peripheral bug in embedded code. The fix is a plain store of just your mask — never a read-modify-write on W1C.',
        setup() {
          const pend = rndBits(3, 8);
          const mine = pend[0];
          const cur = pend.reduce((a, b) => a | (1 << b), 0);
          return {pend, mine, cur, answer: hx(cur, 8)};
        },
        render(s, shown) {
          return code(`SR |= (1 << ${s.mine});   // intended: clear only flag ${s.mine}`)
            + title('pending when the driver runs')

            + (shown
              ? title('step 1 — the read returns every pending flag')
              + valBoard(8, s.cur, {label: 'read', marks: maskMarks(s.cur, 8, 'hl')})
              + title(`step 2 — OR in (1 << ${s.mine}) changes nothing, it was already set`)
              + valBoard(8, s.cur | (1 << s.mine), {label: 'value'})
              + title('step 3 — the store clears every 1 in the written value')
              + transBoard(8, s.cur, 0, true, {})
              + note(`Flags ${s.pend.filter(b => b !== s.mine).join(' and ')} were cleared without ever being handled. The write value should have been just <code>${hx(1 << s.mine, 8)}</code>.`)
              : note('Answer with the mask of every flag that actually gets cleared, not just the intended one.'));
        }
      },
      {
        id: 'p6', mod: 'regs', diff: 'expert', title: 'Alternate function register', fmt: 'hex',
        ask: 'Select the alternate function for this pin. Give the value to OR into the correct AFR register, in hex.',
        hint: 'Four bits per pin. Pins 0-7 live in AFR[0], pins 8-15 in AFR[1] at position 4*(pin-8).',
        concept: 'The 4-bits-per-pin layout does not fit in 32 bits for 16 pins, so ST splits it into two registers. Getting the wrong half is a classic reason a UART pin stays a plain GPIO.',
        setup() {const pin = rnd(0, 15), af = rnd(1, 15); return {pin, af, answer: hx(U(af << (4 * (pin % 8))), 32)};},
        render(s, shown) {

          return code(`GPIOA->AFR[${idx}] |= (${s.af} << (4 * (${s.pin} % 8)));   // AF${s.af} on pin ${s.pin}`)
            + chips([['pin', String(s.pin)], ['register', `AFR[${idx}]`, 'hot'], ['shift', String(sh), 'cool'], ['bits', `[${sh + 3}:${sh}]`]])

      {
        id: 'p7', mod: 'regs', diff: 'hard', title: 'Interrupt priority field', fmt: 'hex',

        hint: 'The implemented bits are the high ones, so the level must be shifted up into bits 7:4.',
        concept: 'Cortex-M implements priority bits from the top down and ties the rest to zero. Writing the raw level without shifting gives every interrupt priority 0 and your carefully designed preemption scheme silently collapses.',
        setup() {const prio = rnd(1, 15); return {prio, answer: hx((prio << 4) & 0xFF, 8)};},
        render(s, shown) {
          const F = [{hi: 7, lo: 4, name: 'implemented', tone: 3}, {hi: 3, lo: 0, name: 'always 0', tone: 4}];

            + valBoard(8, 0, {label: 'IP[n]', fields: F})
            + (shown
              ? valBoard(8, (s.prio << 4) & 0xFF, {label: 'write', fields: F, marks: maskMarks((s.prio << 4) & 0xFF, 8, 'set')})

      /* ---------- Module 8: bit tricks ---------- */
      {
        id: 't1', mod: 'tricks', diff: 'medium', title: 'Population count', fmt: 'dec',
        ask: 'How many bits are set in this value?',
        hint: "Count them, or clear the lowest set bit repeatedly with n &= (n-1) and count the iterations.",
        concept: "Kernighan's loop runs once per set bit rather than once per bit position. Cortex-M has no POPCNT, so this is what the library does.",
        setup() {const v = rndByte(); return {v, answer: String(popcount(v))};},
        render(s, shown) {
          let steps = '', x = s.v, n = 0;
          while (x && n < 9) {const nx = x & (x - 1); steps += valBoard(8, x, {label: 'n=' + n, marks: {[ctz(x)]: 'clr'}}); x = nx; n++;}
          return code(`int popcount(uint8_t n) {\n  int c = 0;\n  while (n) { n &= (n - 1); c++; }\n  return c;\n}`)
            + valBoard(8, s.v, {label: 'value'})
            + (shown ? title('each iteration removes exactly one set bit') + steps + note(`Loop ran <b>${popcount(s.v)}</b> times.`) : '');
        }
      },
      {
        id: 't2', mod: 'tricks', diff: 'hard', title: 'Isolate the lowest set bit', fmt: 'hex',
        ask: 'Apply n & (-n). Give the result in hex.',
        hint: 'Negation flips every bit above the lowest 1 and leaves that bit and the zeros below it alone, so only that bit survives the AND.',
        concept: 'Used to pull the next pending item out of a bitmask scheduler: <code>lowest = mask &amp; -mask;</code> then <code>mask &amp;= mask - 1;</code>.',

          const neg = (-s.v) & 0xFF;

            + valBoard(8, s.v, {label: 'n'})
            + valBoard(8, neg, {label: '-n', tail: shown ? undefined : ''})
            + (shown
              ? opBoard(8, s.v, neg, '&', s.v & neg & 0xFF, true, {la: 'n', lr: 'n & -n', plain: true})
              + note(`The lowest set bit is bit ${ctz(s.v)}, so the result is <b>${hx(s.v & neg & 0xFF, 8)}</b>. Everything above it differs between n and -n and therefore ANDs to zero.`)
              : valBoard(8, 0, {label: 'n & -n', unknown: true}));
        }

      {
        id: 't3', mod: 'tricks', diff: 'medium', title: 'Clear the lowest set bit', fmt: 'hex',

              ? opBoard(8, s.v, (s.v - 1) & 0xFF, '&', s.v & (s.v - 1) & 0xFF, true, {la: 'n', lr: 'n & (n-1)', plain: true})
              + note(`Bit ${ctz(s.v)} is gone and nothing else moved. Population count dropped from ${popcount(s.v)} to ${popcount(s.v & (s.v - 1))}.`)
              : valBoard(8, 0, {label: 'n & (n-1)', unknown: true}));
        }
      },
      {
        id: 't4', mod: 'tricks', diff: 'medium', title: 'Power of two?', fmt: 'yesno',
        ask: 'Is this value a power of two? Answer yes or no.',
        hint: 'A power of two has exactly one bit set, so n & (n-1) is zero — but guard against n == 0.',
        concept: 'Buffer sizes are kept powers of two so that wraparound can be a mask instead of a modulo. This test is how you assert it at compile time.',
        setup() {

          return {v, answer: (v > 0 && (v & (v - 1)) === 0) ? 'yes' : 'no'};

        render(s, shown) {

        }
      },

        id: 't5', mod: 'tricks', diff: 'medium', title: 'Which interrupt fired?', fmt: 'dec',

        setup() {const v = rndNZ(8); return {v, answer: String(ctz(v))};},
        render(s, shown) {
          return code(`uint32_t pending = ${hx(s.v, 8)};\nint src = __builtin_ctz(pending);   // index of lowest set bit`)
            + valBoard(8, s.v, {label: 'pending', marks: shown ? {[ctz(s.v)]: 'set'} : {}})
            + (shown ? note(`Bits 0..${ctz(s.v) - 1 < 0 ? '' : ctz(s.v) - 1} are clear, so the lowest set bit is <b>bit ${ctz(s.v)}</b>. Equivalently <code>n &amp; -n</code> = ${hx(s.v & -s.v & 0xFF, 8)} = 2<sup>${ctz(s.v)}</sup>.`) : '');
        }
      },
      {
        id: 't6', mod: 'tricks', diff: 'hard', title: 'Round up to a boundary', fmt: 'hex',

        setup() {

              : valBoard(8, 0, {label: 'reversed', unknown: true}));
        }
      },
      {
        id: 't8', mod: 'tricks', diff: 'hard', title: 'Parity bit', fmt: 'dec',

        concept: 'UART parity and many sensor protocols use this. XOR-folding (<code>x ^= x &gt;&gt; 4; x ^= x &gt;&gt; 2; x ^= x &gt;&gt; 1;</code>) computes it in three steps instead of eight.',

              + note(`${popcount(s.v)} bits are set — an ${popcount(s.v) % 2 ? 'odd' : 'even'} count — so the even-parity bit is <b>${parityBit(s.v)}</b>. Each fold XORs one half into the other, halving the width that still matters.`)
              : note('Count the 1s, or follow the fold.'));
        }

      {
        id: 't9', mod: 'tricks', diff: 'expert', title: 'Gray code', fmt: 'hex',

        concept: 'Consecutive Gray codes differ in exactly one bit, so a rotary encoder or an asynchronous counter can never be sampled mid-transition showing a wild intermediate value.',

            + (shown

              + note(`Neighbouring values ${s.v} and ${(s.v + 1) & 0xFF} encode to ${hx(g, 8)} and ${hx(((s.v + 1) & 0xFF) ^ (((s.v + 1) & 0xFF) >> 1), 8)}, which differ in exactly one bit.`)
              : valBoard(8, s.v, {label: 'v'}) + valBoard(8, s.v >> 1, {label: 'v >> 1'}) + valBoard(8, 0, {label: 'gray', unknown: true}));
