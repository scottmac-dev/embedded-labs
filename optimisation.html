        ask: 'For a bounded linear programme, why does an optimal solution always sit at a vertex of the feasible region?',
        hint: 'Think about what the objective does as you slide along a straight edge of the region.',
        concept: 'A linear objective has a constant gradient, so along any edge it increases steadily in one direction — you can always keep sliding until you hit a corner. That turns a continuum of candidates into a finite list, and it is the entire reason LP is tractable. It also fails the moment the objective curves, which is why quadratic programmes need different machinery.',
        setup() {
          return mc('the objective has a constant gradient, so along any edge you can always improve until you reach an endpoint',
            ['the feasible region only contains its vertices',
              'the gradient vanishes at the vertices',
              'the constraints are only active at the vertices']);
        },
        render(s, shown) {
          return feasible([{a: 1, b: 1, c: 9, label: 'x+y ≤ 9'}, {a: 3, b: 1, c: 15, label: '3x+y ≤ 15'},
          {a: -1, b: 0, c: 0}, {a: 0, b: -1, c: 0}],
            {x: [0, 10], y: [0, 10], label: 'slide the objective line until it just leaves the region',
              vlines: [], texts: [{x: 3, y: 6, s: 'optimum lands on a corner'}]})
            + (shown ? note('If a whole edge is optimal — the objective happens to be parallel to it — then its endpoints are optimal too, so a vertex always works. That is why solvers only ever need to look at corners.') : '');
        }
      },
      {
        id: 'p4', mod: 'lp', diff: 'hard', fmt: 'num', title: 'Solve a two-variable LP',
        ask: s => `Maximise <code>${s.cx}x + ${s.cy}y</code> subject to <code>x + y &le; ${s.c1}</code>, <code>${s.a2}x + y &le; ${s.c2}</code>, x, y &ge; 0. What is the maximum?`,
        hint: 'List the vertices — the origin, the two axis intercepts, and the intersection of the two lines — then score each with the objective and take the best.',
        concept: 'This is the whole method in miniature: enumerate the corners, evaluate, pick the winner. Simplex is just a way of doing it without visiting every corner, by always moving to a neighbour that improves the objective. For two variables, brute force over the vertices is faster than setting up anything cleverer.',
        setup() {
          const c1 = rnd(8, 14), a2 = rnd(2, 3), c2 = rnd(14, 26);
          const cx = rnd(2, 9), cy = rnd(2, 9);
          const xi = (c2 - c1) / (a2 - 1), yi = c1 - xi;
          const verts = [[0, 0], [0, Math.min(c1, c2)], [Math.min(c1, c2 / a2), 0]];
          if (xi >= 0 && yi >= 0) verts.push([xi, yi]);
          const best = Math.max(...verts.map(v => cx * v[0] + cy * v[1]));
          return num(best, Math.max(0.02, best * 0.005), {c1, a2, c2, cx, cy, verts});
        },
        render(s, shown) {
          const scored = s.verts.map(v => [`(${fmtN(v[0], 2)}, ${fmtN(v[1], 2)})`, fmtN(s.cx * v[0] + s.cy * v[1], 3)]);
          const best = Math.max(...s.verts.map(v => s.cx * v[0] + s.cy * v[1]));
          const bi = s.verts.findIndex(v => s.cx * v[0] + s.cy * v[1] === best);
          return feasible([{a: 1, b: 1, c: s.c1, label: `x+y ≤ ${s.c1}`}, {a: s.a2, b: 1, c: s.c2, label: `${s.a2}x+y ≤ ${s.c2}`},
          {a: -1, b: 0, c: 0}, {a: 0, b: -1, c: 0}],
            {x: [0, s.c1 * 1.2], y: [0, s.c1 * 1.2],
              marks: shown ? [{x: s.verts[bi][0], y: s.verts[bi][1], label: fmtN(best, 2), color: 'var(--on)'}] : []})
            + tbl(['vertex', 'objective'], scored.map((r, i) =>
              [r[0], shown ? [i === bi ? `<b>${r[1]}</b>` : r[1], i === bi ? 'mk' : ''] : ['?', 'q']]), 'score every corner')
            + (shown ? note(`The best corner is ${scored[bi][0]} with <b>${fmtN(best, 4)}</b>. Nothing in the interior can beat it — a linear objective has no interior optimum.`) : '');
        }
      },
      {
        id: 'p5', mod: 'lp', diff: 'hard', fmt: 'num', title: 'Shadow price of a resource',
        ask: s => `An LP optimum uses all ${s.b} units of a resource, and its multiplier is &lambda; = ${s.lam}. Roughly how much would the objective improve if you obtained ${s.extra} more units?`,
        hint: 'λ is the improvement per unit. Multiply by the number of extra units.',
        concept: 'Shadow prices turn an optimisation into a purchasing decision: if λ on memory bandwidth is 40 frames-per-second per GB/s, and a faster part costs a known amount, you can compare directly. The linear estimate holds only while the same set of constraints stays binding — buy enough extra and a different bottleneck takes over and λ drops.',
        setup() {
          const b = rnd(10, 100), lam = pick([0.5, 1.5, 2, 3.5, 8]), extra = rnd(2, 10);
          return num(lam * extra, Math.max(0.02, lam * extra * 0.005), {b, lam, extra});
        },
        render(s, shown) {
          return eq(`Δf* ≈ λ · Δb = ${s.lam} × ${s.extra}`,
            shown ? `= ${fmtN(s.lam * s.extra, 4)}` : '= ?',
            '# valid while the same constraints stay active')
            + (shown ? note(`About <b>${fmtN(s.lam * s.extra, 4)}</b>. This is a local estimate: past some point another constraint becomes the bottleneck, &lambda; for this resource collapses, and further purchases buy nothing.`) : '');
        }
      },
      {
        id: 'p6', mod: 'lp', diff: 'hard', fmt: 'mc', title: 'Rounding an LP answer',
        ask: 'Your LP says allocate 3.7 servers. You round to 4. What is the risk?',
        hint: 'Rounding moves the point. Ask what could be true of the new point that was not true of the old one.',
        concept: 'The LP relaxation gives a bound, not a plan: its value is always at least as good as the true integer optimum, so it tells you what you cannot beat. Rounding may violate a constraint, and even when it does not, it can be arbitrarily far from the best integer answer. Branch and bound uses the relaxation as a bound while searching properly.',
        setup() {
          return mc('the rounded point may violate a constraint, and even if feasible may be far from the best integer solution',
            ['rounding always stays feasible but loses a little objective value',
              'rounding up is always safe; only rounding down risks infeasibility',
              'the LP optimum is already integer whenever the constraints are']);
        },
        render(s, shown) {
          return eq('LP optimum      ≥      best integer solution',
            '# the relaxation is a bound you can trust; the rounded point is not a solution you can trust')
            + (shown ? note('If the binding constraint were "servers ≤ 3.7", rounding up breaks it outright. The relaxation is still useful — it caps how good any integer answer could be, which is what lets branch and bound prune.') : '');
        }
      },

      /* ---------- applied ---------- */
      {
        id: 'a1', mod: 'applied', diff: 'medium', fmt: 'num', title: 'Least squares is a solved optimisation',
        ask: s => `Fit <code>y = wx</code> through the origin to the points <code>${s.pts.map(p => `(${p[0]}, ${p[1]})`).join(', ')}</code>. What is the least-squares w?`,
        hint: 'Minimise Σ(wxᵢ − yᵢ)². Differentiate with respect to w, set to zero, and you get w = Σxy / Σx².',
        concept: 'Least squares is quadratic in the parameters, so setting the gradient to zero gives a closed form — no iteration, no learning rate, no convergence to worry about. This is why calibration routines, sensor linearisation and simple regressions are one-liners on a microcontroller: accumulate two sums and divide.',
        setup() {
          const w = pick([1.5, 2, 2.5, 3]);
          const pts = [1, 2, 3, 4].map(x => [x, Math.round((w * x + rnd(-1, 1) * 0.5) * 2) / 2]);
          const sxy = pts.reduce((a, p) => a + p[0] * p[1], 0);
          const sxx = pts.reduce((a, p) => a + p[0] * p[0], 0);
          return num(sxy / sxx, Math.max(0.005, sxy / sxx * 0.01), {pts, sxy, sxx});
        },
        render(s, shown) {
          const w = s.sxy / s.sxx;
          return eq('minimise Σ(wxᵢ − yᵢ)²   ⇒   2Σxᵢ(wxᵢ − yᵢ) = 0',
            `w = Σxy / Σx² = ${s.sxy} / ${s.sxx}`,
            shown ? `= ${fmtN(w, 5)}` : '= ?')
            + plotCT([{f: x => w * x, label: shown ? `y = ${fmtN(w, 3)}x` : 'best fit', color: 'var(--hl)'}],
              {x: [0, 5], y: [0, Math.max(...s.pts.map(p => p[1])) * 1.3], xlabel: 'x', ylabel: 'y',
                marks: s.pts.map(p => ({x: p[0], y: p[1], color: 'var(--accent)'}))})
            + (shown ? note(`w = <b>${fmtN(w, 5)}</b>. Two running sums are enough — &Sigma;xy and &Sigma;x&sup2; — so this fits in a few bytes of state and updates online as samples arrive.`) : '');
        }
      },
      {
        id: 'a2', mod: 'applied', diff: 'medium', fmt: 'num', title: 'Quantising a coefficient',
        ask: s => `A filter coefficient is ${s.c}. Stored in Q${s.q} fixed point (multiply by 2<sup>${s.q}</sup>, round to an integer), what is the resulting coefficient error?`,
        hint: 'Scale, round, scale back, and subtract the original. Report the size of the difference.',
        concept: 'Quantising coefficients is a constrained optimisation nobody writes down: you want the response closest to the ideal, but you may only pick from a lattice of representable values. Rounding each coefficient independently is the greedy answer and is usually fine; near a stability boundary it is not, and you have to search the neighbouring lattice points for the best overall response.',
        setup() {
          const q = pick([8, 12, 15]), c = Math.round(Math.random() * 1900) / 1000 - 0.95;
          const qc = Math.round(c * Math.pow(2, q)) / Math.pow(2, q);
          return num(Math.abs(qc - c), Math.max(1e-7, Math.abs(qc - c) * 0.05 + 1e-6), {q, c, qc});
        },
        render(s, shown) {
          const scale = Math.pow(2, s.q), raw = s.c * scale;
          return eq(`${s.c} × 2^${s.q} = ${fmtN(raw, 4)}   →   round to ${Math.round(raw)}`,
            `back: ${Math.round(raw)} / 2^${s.q} = ${fmtN(s.qc, 8)}`,
            shown ? `error = ${fmtN(Math.abs(s.qc - s.c), 8)}` : 'error = ?')
            + chips([['ideal', s.c], ['stored', Math.round(raw)], ['actual', fmtN(s.qc, 7)],
            ['step size', fmtN(1 / scale, 8)], ['error', shown ? fmtN(Math.abs(s.qc - s.c), 7) : '?']])
            + (shown ? note(`<b>${fmtN(Math.abs(s.qc - s.c), 8)}</b>. The worst possible error is half a step, ${fmtN(0.5 / scale, 8)} — so Q${s.q} pins every coefficient to within that, whatever the value.`) : '');
        }
      },
      {
        id: 'a3', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Greedy is not always optimal',
        ask: s => `A ${s.cap}-unit buffer must hold items of size <code>${s.sz.join(', ')}</code> with values <code>${s.vals.join(', ')}</code>, each taken whole or not at all. What is the best total value?`,
        hint: 'Only a few subsets fit. Enumerate them and take the best — do not just grab the highest value-per-unit first.',
        concept: 'The 0/1 knapsack is the archetypal problem where greedy fails: taking the best value-density first can block a pair that together beat it. It is NP-hard in general, though a dynamic program solves it in O(n·capacity), which is fine when the capacity is small — a very common situation in embedded allocation.',
        setup() {
          const sz = shuffle([3, 4, 5, 6]).slice(0, 3);
          const vals = sz.map(x => x * rnd(2, 5));
          const cap = rnd(7, 10);
          let best = 0;
          for (let m = 0; m < 8; m++) {
            let w = 0, v = 0;
            for (let i = 0; i < 3; i++) if (m & (1 << i)) {w += sz[i]; v += vals[i];}
            if (w <= cap) best = Math.max(best, v);
          }
          return num(best, 0.02, {sz, vals, cap});
        },
        render(s, shown) {
          const rows = [];
          for (let m = 1; m < 8; m++) {
            let w = 0, v = 0;
            const items = [];
            for (let i = 0; i < 3; i++) if (m & (1 << i)) {w += s.sz[i]; v += s.vals[i]; items.push(i + 1);}
            rows.push([`{${items.join(', ')}}`, w, v, w <= s.cap ? '✓' : '✗']);
          }
          const best = Math.max(...rows.filter(r => r[3] === '✓').map(r => r[2]));
          return tbl(['items', 'size', 'value', 'fits?'],
            [[`sizes`, s.sz.join(' / '), s.vals.join(' / '), `cap ${s.cap}`],
            ...rows.map(r => shown ? [r[0], r[1], [r[2] === best && r[3] === '✓' ? `<b>${r[2]}</b>` : r[2], r[2] === best && r[3] === '✓' ? 'mk' : ''], r[3]] : [r[0], r[1], ['?', 'q'], '?'])],
            'every subset')
            + (shown ? note(`Best feasible value is <b>${best}</b>. Greedy by value-per-unit picks ${(() => {
              const order = s.sz.map((z, i) => [s.vals[i] / z, i]).sort((a, b) => b[0] - a[0]);
              let w = 0, v = 0;
              const got = [];
              order.forEach(([, i]) => {if (w + s.sz[i] <= s.cap) {w += s.sz[i]; v += s.vals[i]; got.push(i + 1);}});
              return `{${got.join(', ')}} for ${v}`;
            })()} — ${(() => {
              const order = s.sz.map((z, i) => [s.vals[i] / z, i]).sort((a, b) => b[0] - a[0]);
              let w = 0, v = 0;
              order.forEach(([, i]) => {if (w + s.sz[i] <= s.cap) {w += s.sz[i]; v += s.vals[i];}});
              return v === best ? 'which happens to be optimal here, but only by luck' : 'which is worse than the optimum';
            })()}.`) : '');
        }
      },
      {
        id: 'a4', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Race to idle, or slow down?',
        ask: s => `A core\'s power is <code>P = ${s.k}f&sup2;</code> watts at frequency f (in GHz), and a job needs ${s.W} cycles. Run at the lowest f that still meets a ${s.T}&thinsp;s deadline. What is the energy used, in joules?`,
        hint: 'The lowest feasible frequency is f = W/T. Energy is power × time = kf²·(W/f) = k·f·W.',
        concept: 'Because dynamic power grows faster than linearly with frequency, energy per job falls as you slow down — so the energy-optimal schedule runs as slowly as the deadline allows, not as fast as possible. Real parts complicate this with static leakage, which pushes back towards racing to idle, and the crossover between the two is a genuine design calculation.',
        setup() {
          const k = pick([1, 2, 4]), W = pick([1, 2, 4, 8]), T = pick([1, 2, 4]);
          const f = W / T;
          return num(k * f * W, Math.max(0.02, k * f * W * 0.005), {k, W, T, f});
        },
        render(s, shown) {
          const f = s.W / s.T, E = s.k * f * s.W;
          return eq(`f = W/T = ${s.W}/${s.T} = ${fmtN(f, 3)} GHz`,
            `E = P × t = (${s.k}f²) × (W/f) = ${s.k}·f·W`,
            shown ? `E = ${s.k} × ${fmtN(f, 3)} × ${s.W} = ${fmtN(E, 4)} J` : 'E = ?')
            + plotCT([{f: x => s.k * x * s.W, label: 'energy vs frequency'}],
              {x: [f * 0.4, f * 2.5], y: [0, s.k * f * 2.5 * s.W * 1.1], xlabel: 'f (GHz)', ylabel: 'E (J)',
                vlines: [{x: f, label: 'slowest that meets the deadline'}],
                marks: [{x: f, y: E, label: shown ? fmtN(E, 2) : '?', color: shown ? 'var(--on)' : 'var(--unk)'}]})
            + (shown ? note(`<b>${fmtN(E, 4)} J</b>. Running twice as fast would finish early but burn ${fmtN(2 * E, 3)}&thinsp;J — double, for no benefit once the deadline is met. Leakage, which burns power whenever the core is on, is the effect that argues the other way.`) : '');
        }
      },
      {
        id: 'a5', mod: 'applied', diff: 'medium', fmt: 'num', title: 'Two descent steps on a real loss',
        ask: s => `Minimise <code>L(w) = (w&middot;${s.x} &minus; ${s.y})&sup2;</code> from w = ${s.w0} with &eta; = ${s.eta}. What is w after <em>two</em> steps?`,
        hint: 'dL/dw = 2x(wx − y). Take one step, recompute the gradient at the new w, then take a second.',
        concept: 'Recomputing the gradient at the new point is the part people skip — reusing the old gradient is a different (and worse) algorithm. Two steps by hand also make the contraction visible: the error is multiplied by (1 − 2ηx²) each time, so the input magnitude x directly controls stability. Large unnormalised features are how a perfectly good learning rate becomes divergent.',
        setup() {
          const x = pick([1, 2]), y = rnd(2, 12), w0 = rnd(0, 4), eta = pick([0.05, 0.1, 0.2]);
          const g1 = 2 * x * (w0 * x - y), w1 = w0 - eta * g1;
          const g2 = 2 * x * (w1 * x - y), w2 = w1 - eta * g2;
          return num(w2, Math.max(0.005, Math.abs(w2) * 0.01), {x, y, w0, eta});
        },
        render(s, shown) {
          const g1 = 2 * s.x * (s.w0 * s.x - s.y), w1 = s.w0 - s.eta * g1;
          const g2 = 2 * s.x * (w1 * s.x - s.y), w2 = w1 - s.eta * g2;
          const target = s.y / s.x;
          return eq(`dL/dw = 2x(wx − y) = ${2 * s.x}(${s.x}w − ${s.y})`,
            `step 1: g = ${fmtN(g1, 4)},  w = ${fmtN(w1, 5)}`,
            shown ? `step 2: g = ${fmtN(g2, 4)},  w = ${fmtN(w2, 5)}` : 'step 2: g = ?,  w = ?')
            + tbl(['step', 'w', 'gradient', 'loss'],
              [['0', fmtN(s.w0, 4), fmtN(g1, 4), fmtN(Math.pow(s.w0 * s.x - s.y, 2), 4)],
              ['1', fmtN(w1, 4), fmtN(g2, 4), fmtN(Math.pow(w1 * s.x - s.y, 2), 4)],
              ['2', shown ? [`<b>${fmtN(w2, 4)}</b>`, 'mk'] : ['?', 'q'], '—', shown ? fmtN(Math.pow(w2 * s.x - s.y, 2), 4) : '?']])
            + (shown ? note(`w = <b>${fmtN(w2, 5)}</b>, heading for the exact answer y/x = ${fmtN(target, 4)}. Each step multiplies the remaining error by ${fmtN(1 - 2 * s.eta * s.x * s.x, 4)}.`) : '');
        }
      },
      {
        id: 'a6', mod: 'applied', diff: 'medium', fmt: 'mc', title: 'Pick the right tool',
        ask: 'You must choose 12 boolean feature flags to minimise binary size, and each build takes 4 minutes. Which approach fits?',
        hint: 'Count the search space, and count how many evaluations you can afford. There is no gradient here.',
        concept: 'Matching the method to the structure is most of applied optimisation. A discrete space with no gradient and an expensive objective rules out descent entirely; 2¹² = 4096 builds at four minutes each is eleven days, so exhaustive search is out too. That leaves a guided search — greedy with a few passes, or Bayesian optimisation — plus the honest observation that flags are usually near-independent, which is what makes greedy work at all.',
        setup() {
          return mc('a guided discrete search — greedy one flag at a time, then a few refinement passes',
            ['gradient descent on the flag values',
              'exhaustive search over all 2¹² combinations',
              'a linear programme with the flags relaxed to [0, 1]']);
        },
        render(s, shown) {
          return chips([['search space', '2¹² = 4096'], ['cost each', '4 min'], ['exhaustive', '≈ 11 days', 'bad'],
          ['greedy, 2 passes', '≈ 3 hours', 'good']])
            + (shown ? note('Booleans have no gradient to descend, and the LP relaxation gives fractional flags that mean nothing. Greedy works here because flag effects are mostly independent — worth checking with a couple of refinement passes rather than assuming.') : '');
        }
      },
      {
        id: 'a7', mod: 'applied', diff: 'expert', fmt: 'num', title: 'Balance the load',
        ask: s => `${s.n} parallel drivers share a total current of ${s.I}&thinsp;A. Each dissipates <code>${s.R}I&sup2;</code> watts. Minimise total dissipation — what is it, in watts?`,
        hint: 'By symmetry each driver carries I/n. Total power is n·R·(I/n)² — simplify before you compute.',
        concept: 'Total dissipation falls as 1/n when you share a load between n identical elements, because the loss is quadratic in current. This is why paralleling MOSFETs, splitting a bus across more lanes, or spreading a workload across more cores at lower clock all win — and why an imbalance is punished quadratically, so the hot element in a badly matched pair dominates the total.',
        setup() {
          const n = rnd(2, 6), I = rnd(2, 12), R = pick([0.01, 0.05, 0.1, 0.2]);
          return num(R * I * I / n, Math.max(0.0005, R * I * I / n * 0.01), {n, I, R});
        },
        render(s, shown) {
          const P = s.R * s.I * s.I / s.n;
          return eq(`each carries I/n = ${s.I}/${s.n} = ${fmtN(s.I / s.n, 4)} A`,
            `P_total = n·R·(I/n)² = R·I²/n`,
            shown ? `= ${s.R}×${s.I}²/${s.n} = ${fmtN(P, 5)} W` : '= ?')
            + tbl(['split', 'currents', 'total power'],
              [['even', `${s.n} × ${fmtN(s.I / s.n, 2)} A`, shown ? [`<b>${fmtN(P, 4)} W</b>`, 'mk'] : ['?', 'q']],
              ['all on one', `${s.I} A, rest 0`, fmtN(s.R * s.I * s.I, 4) + ' W']])
            + (shown ? note(`<b>${fmtN(P, 5)} W</b> — a factor of ${s.n} below the single-device case. Because loss is quadratic, an uneven split always costs more: the imbalance penalty grows with the square of the deviation.`) : '');
        }
      }
    ];

    const PROBLEMS = [...P_A, ...P_B, ...P_C].sort((a, b) => MOD_INDEX[a.mod] - MOD_INDEX[b.mod]);
    const BY_ID = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
    PROBLEMS.forEach(p => {p.s = p.setup();});

    /* ============================================================
       PART 4 — answer checking
       Accept any reasonable spelling of the same value.
       ============================================================ */
    function norm(v) {return String(v).trim().toLowerCase().replace(/[\s_,]/g, '').replace(/[−–—]/g, '-');}

    function boolOf(s) {
      if (['yes', 'y', 'true', 't'].includes(s)) return true;
      if (['no', 'n', 'false', 'f'].includes(s)) return false;
      return null;
    }

    function numOf(s) {
      if (/^-?\d*\.?\d+(e[-+]?\d+)?$/.test(s)) return parseFloat(s);
      if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) {const [a, b] = s.split('/').map(Number); return a / b;}
      if (/^-?0x[0-9a-f]+$/.test(s)) return parseInt(s.replace('-0x', '0x'), 16) * (s[0] === '-' ? -1 : 1);
      if (/^-?0b[01]+$/.test(s)) return parseInt(s.replace('-0b', '0b').slice(2), 2) * (s[0] === '-' ? -1 : 1);
      return null;
    }

    function accepts(expected, given) {
      const e = norm(expected), g = norm(given);
      if (!g) return false;
      if (e === g) return true;
      const eb = boolOf(e);
      if (eb !== null) return boolOf(g) === eb;
      const en = numOf(e), gn = numOf(g);
      return en !== null && gn !== null && Math.abs(en - gn) < 1e-9;
    }

    /* numeric problems carry s.val and s.tol */
    function checkAnswer(p, given) {
      const s = p.s;
      if (s.tol !== undefined && s.val !== undefined) {
        const g = numOf(norm(given));
        if (g !== null && Math.abs(g - s.val) <= s.tol) return true;
        return (s.alts || []).some(c => accepts(c, given));
      }
      return [s.answer, ...(s.alts || [])].some(c => accepts(c, given));
    }

    const FMT_HELP = {
      num: 'a number — a couple of decimals is plenty',
      dec: 'a whole number',
      hex: 'answer in hex, e.g. 0x2A',
      bin: 'answer in binary, e.g. 0b1011',
      yesno: 'yes or no',
      expr: 'an expression, e.g. 3x^2 - 2x',
      mc: 'pick one'
    };

    /* ============================================================
       PART 5 — application state
       ============================================================ */
    const STORE_KEY = 'optlab.progress.v1';

    const app = {
      tab: 'learn', cur: 0,
      solved: new Set(),
      tried: {}, feedback: {}, inputs: {}, pick: {}, hint: {}, reveal: {}, why: {}
    };

    function save() {try {localStorage.setItem(STORE_KEY, JSON.stringify([...app.solved]));} catch (e) { }}
    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) JSON.parse(raw).forEach(id => {if (BY_ID[id]) app.solved.add(id);});
      } catch (e) { }
    }

    const isShown = p => app.feedback[p.id] === 'correct' || app.reveal[p.id];
    const askOf = p => typeof p.ask === 'function' ? p.ask(p.s) : p.ask;

    /* ============================================================
       PART 6 — views
       ============================================================ */
    function view() {
      const solved = app.solved.size, total = PROBLEMS.length;
      let h = `<div class="masthead">
          <h1>Optim Lab</h1>
          <span class="sub">objectives, constraints &amp; gradients &mdash; ${total} problems across ${MODULES.length} modules</span>
        </div>
        <div class="tab-bar">
          ${[['learn', 'Learn'], ['problems', `Problems (${solved}/${total})`], ['ref', 'Reference']]
          .map(([k, t]) => `<button class="tab ${app.tab === k ? 'active' : ''}" onclick="setTab('${k}')">${t}</button>`).join('')}
        </div>`;

      if (app.tab === 'learn') h += viewLearn();
      else if (app.tab === 'problems') h += viewList();
      else h += viewRef();

      document.getElementById('app').innerHTML = h;
      if (app.tab === 'learn') {
        const el = document.getElementById('ans');
        if (el) el.focus();
      }
    }

    function viewLearn() {
      const p = PROBLEMS[app.cur], s = p.s, shown = isShown(p);
      const mod = MODULES[MOD_INDEX[p.mod]];
      const firstOfMod = PROBLEMS.findIndex(x => x.mod === p.mod) === app.cur;
      const inMod = PROBLEMS.filter(x => x.mod === p.mod);

      let h = '';
      if (firstOfMod) {
        h += `<div class="modcard">
            <div class="t">Module ${MOD_INDEX[p.mod] + 1} of ${MODULES.length}</div>
            <h2>${mod.name}</h2>
            <p>${mod.blurb}</p>
          </div>`;
      }

      h += `<div class="card">
          <div class="problem-header">
            <div>
              <div class="crumb">${mod.name} &middot; ${inMod.indexOf(p) + 1} of ${inMod.length}</div>
              <h3>${p.title}</h3>
            </div>
            <span class="badge badge-${p.diff}">${p.diff}</span>
          </div>
          <p class="ask">${askOf(p)}</p>
          ${p.render(s, shown)}`;

      if (p.fmt === 'mc') {
        const picked = app.pick[p.id];
        h += `<div class="choices">` + s.choices.map((c, i) => {
          let cls = '';
          if (shown && i === s.ai) cls = 'right';
          else if (picked === i && app.feedback[p.id] === 'wrong') cls = 'picked';
          return `<button class="choice ${cls}" ${shown ? 'disabled' : ''} onclick="chooseMC(${i})">
              <span class="key">${'ABCD'[i]}</span><span>${c}</span></button>`;
        }).join('') + `</div>`;
      }

      if (!shown) {
        h += `<div class="answer-row">`;
        if (p.fmt !== 'mc') {
          h += `<input type="text" id="ans" placeholder="${FMT_HELP[p.fmt]}" value="${esc(app.inputs[p.id] || '')}"
                   oninput="app.inputs['${p.id}']=this.value"
                   onkeydown="if(event.key==='Enter')submit()">
            <button class="btn btn-primary" onclick="submit()">Check</button>`;
        }
        h += `<button class="linkbtn" onclick="tog('hint','${p.id}')">${app.hint[p.id] ? 'hide hint' : 'hint'}</button>
            <button class="linkbtn" onclick="tog('reveal','${p.id}')">show me</button>
          </div>`;
        if (app.hint[p.id]) h += `<div class="feedback hint">${p.hint}</div>`;
        if (app.feedback[p.id] === 'wrong') {
          const n = app.tried[p.id] || 0;
          h += `<div class="feedback wrong">Not quite &mdash; ${n >= 3 ? 'try the hint, or use <b>show me</b> to walk through it.' : 'have another go.'}</div>`;
        }
      } else {
        const correct = app.feedback[p.id] === 'correct';
        h += `<div class="feedback ${correct ? 'correct' : 'hint'}">
            ${correct ? '&#10003; Correct' : 'Answer'}: <span class="mono"><b>${esc(s.answer)}</b></span>
            &nbsp;<button class="linkbtn" style="color:inherit" onclick="tog('why','${p.id}')">${app.why[p.id] ? 'hide' : 'why this matters'}</button>
            ${app.why[p.id] ? `<div style="margin-top:8px;color:var(--tx-2)">${p.concept}</div>` : ''}
          </div>`;
      }

      h += `<div class="navrow">
          <button class="btn btn-sm" onclick="nav(-1)" ${app.cur === 0 ? 'disabled style="opacity:.4"' : ''}>&larr; Prev</button>
          <button class="btn btn-sm" onclick="nav(1)" ${app.cur === PROBLEMS.length - 1 ? 'disabled style="opacity:.4"' : ''}>Next &rarr;</button>
          <button class="btn btn-sm" onclick="regen()">${p.fmt === 'mc' ? 'Reshuffle' : 'New numbers'}</button>
          <span class="spacer"></span>
          <span style="font-size:12px;color:var(--tx-3)">${app.cur + 1} / ${PROBLEMS.length}</span>
        </div></div>`;
      return h;
    }

    function viewList() {
      const solved = app.solved.size, total = PROBLEMS.length;
      const byDiff = d => PROBLEMS.filter(p => p.diff === d && app.solved.has(p.id)).length;
      let h = `<div class="stat-grid">
          <div class="stat"><div class="stat-val">${solved}</div><div class="stat-lbl">solved</div></div>
          <div class="stat"><div class="stat-val">${total - solved}</div><div class="stat-lbl">remaining</div></div>
          <div class="stat"><div class="stat-val">${Math.round(solved / total * 100)}%</div><div class="stat-lbl">complete</div></div>
          <div class="stat"><div class="stat-val">${byDiff('hard') + byDiff('expert')}</div><div class="stat-lbl">hard+ solved</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${solved / total * 100}%"></div></div>
        <div class="card">`;

      MODULES.forEach((m, mi) => {
        const list = PROBLEMS.filter(p => p.mod === m.id);
        const done = list.filter(p => app.solved.has(p.id)).length;
        h += `<div class="modhead"><span class="t">${mi + 1}. ${m.name}</span><span class="line"></span><span class="c">${done}/${list.length}</span></div>`;
        list.forEach(p => {
          const i = PROBLEMS.indexOf(p), ok = app.solved.has(p.id);
          h += `<div class="pitem ${ok ? 'solved' : ''} ${i === app.cur ? 'current' : ''}" onclick="go(${i})">
              <div class="pi-icon ${ok ? 'yes' : 'no'}">${ok ? '&#10003;' : i + 1}</div>
              <div class="pi-info"><div class="pi-title">${p.title}</div><div class="pi-sub">${askOf(p).replace(/<[^>]+>/g, '')}</div></div>
              <span class="badge badge-${p.diff}">${p.diff}</span>
            </div>`;
        });
      });

      h += `<div class="navrow"><button class="btn btn-sm" onclick="resetAll()">Reset progress</button></div></div>`;
      return h;
    }


    function viewRef() {
      return `<div class="card">
        <h2>Framing</h2>
        ${refTable([
        ['decision variables', 'the knobs you control — what the solver is allowed to change'],
        ['objective f(x)', 'the single number being minimised or maximised'],
        ['constraints', 'hard pass/fail limits; equality g(x) = c or inequality g(x) ≤ c'],
        ['feasible region', 'the set of points satisfying every constraint at once'],
        ['infeasible', 'the constraints contradict — no point satisfies them all'],
        ['unbounded', 'the objective improves forever — you are missing a limit'],
        ['active constraint', 'one that holds with equality at the optimum; it is what binds you'],
        ['relaxation', 'drop or soften a constraint to get an easy bound on the true optimum']
      ])}
        <h2 style="margin-top:18px">Shape</h2>
        ${refTable([
        ['convex function', 'f″ ≥ 0 everywhere (1-D), or the chord never dips below the curve'],
        ['convex set', 'the straight line between any two feasible points stays feasible'],
        ['why it matters', 'convex f over a convex set ⇒ every local minimum is global'],
        ['integrality', 'breaks convexity of the set — forces search, not descent'],
        ['local minimum', 'lowest in some neighbourhood; nothing measured at the point reveals more'],
        ['condition number κ', 'largest curvature ÷ smallest; sets how badly descent zig-zags'],
        ['stationary point', 'f′ = 0; sorted into min/max/saddle by the second derivative']
      ])}
        <h2 style="margin-top:18px">Gradient methods</h2>
        ${refTable([
        ['∇f', 'vector of partials; points uphill, perpendicular to the contours'],
        ['descent step', 'x ← x − η∇f'],
        ['convergence', 'needs η < 2/L, where L is the largest curvature; η = 1/L is the safe choice'],
        ['on f = ax²', 'factor 1 − 2aη per step; η = 1/(2a) lands exactly on the minimum in one step'],
        ['rate', 'error × (κ−1)/(κ+1) per step — linear convergence, logarithmic cost per digit'],
        ['momentum', 'v ← βv − η∇f, x ← x + v; damps zig-zag, up to 1/(1−β)× the effective step'],
        ["Newton's method", 'x ← x − f′/f″; quadratic convergence, but needs the second derivative'],
        ['gradient check', 'compare the analytic gradient against a finite difference before trusting it']
      ])}
        <h2 style="margin-top:18px">Constrained and linear</h2>
        ${refTable([
        ['Lagrangian', 'L = f(x) − λ(g(x) − c);  solve ∂L/∂x = 0 together with g(x) = c'],
        ['multiplier λ', 'the shadow price: df*/dc, the improvement per unit of relaxed constraint'],
        ['complementary slackness', 'λᵢ·(slack) = 0 — an inactive constraint has zero price'],
        ['linear programme', 'linear objective, linear constraints, continuous variables'],
        ['vertex optimality', 'a bounded LP always has an optimum at a corner of the feasible polygon'],
        ['solving a 2-var LP', 'list the vertices, score each with the objective, take the best'],
        ['integer programme', 'LP plus integrality — NP-hard; the LP relaxation gives a bound, not a plan'],
        ['rounding', 'may be infeasible, and even when feasible may be far from the integer optimum']
      ])}
        <h2 style="margin-top:18px">Engineering results worth remembering</h2>
        ${refTable([
        ['least squares through origin', 'w = Σxy / Σx² — closed form, two running sums, no iteration'],
        ['fixed sum, minimise Σ squares', 'split evenly — balanced loads beat lopsided ones'],
        ['fixed sum, maximise product', 'split evenly again — the square is the best rectangle'],
        ['n parallel elements', 'I²R loss falls as 1/n; imbalance is punished quadratically'],
        ['energy vs frequency', 'P ∝ f² ⇒ energy per job ∝ f — run as slowly as the deadline allows'],
        ['Q-format quantisation', 'worst-case coefficient error is half a step, 2^−(q+1)'],
        ['greedy', 'optimal for fractional knapsack, not for 0/1 — check before trusting it'],
        ['no gradient available', 'discrete or expensive objectives need guided search, not descent']
      ])}
      </div>`;
    }

    function refTable(rows) {
      return `<table class="reft">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    }

    /* ---------- actions ---------- */
    function setTab(t) {app.tab = t; view();}
    function go(i) {app.cur = i; app.tab = 'learn'; view();}
    function nav(d) {app.cur = Math.max(0, Math.min(PROBLEMS.length - 1, app.cur + d)); view();}
    function tog(k, id) {app[k][id] = !app[k][id]; view();}

    function mark(p, ok) {
      app.tried[p.id] = (app.tried[p.id] || 0) + 1;
      if (ok) {app.feedback[p.id] = 'correct'; app.solved.add(p.id); save();}
      else app.feedback[p.id] = 'wrong';
      view();
    }

    function submit() {
      const p = PROBLEMS[app.cur];
      const given = app.inputs[p.id] || '';
      if (!given.trim()) return;
      mark(p, checkAnswer(p, given));
    }

    function chooseMC(i) {
      const p = PROBLEMS[app.cur];
      if (isShown(p)) return;
      app.pick[p.id] = i;
      mark(p, i === p.s.ai);
    }

    function regen() {
      const p = PROBLEMS[app.cur];
      p.s = p.setup();
      app.feedback[p.id] = null;
      app.reveal[p.id] = false;
      app.inputs[p.id] = '';
      app.pick[p.id] = null;
      view();
    }

    function resetAll() {
      if (!confirm('Clear all solved problems?')) return;
      app.solved.clear();
      app.feedback = {}; app.inputs = {}; app.pick = {}; app.reveal = {}; app.hint = {}; app.tried = {};
      save();
      view();
    }

    load();
    view();
  </script>
</body>

</html>
