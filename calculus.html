        },
        render(s, shown) {
          const v = s.h / 3 * (s.y[0] + 4 * s.y[1] + s.y[2]);
          return eq(`∫ ≈ (h/3)(y₀ + 4y₁ + y₂)`,
            shown ? `= (${s.h}/3)(${s.y[0]} + ${4 * s.y[1]} + ${s.y[2]}) = ${fmtN(v, 4)}` : '= ?',
            '# weights 1, 4, 1 — they sum to 6, and h/3 × 6 = 2h, the width covered')
            + tbl(['sample', 'y₀', 'y₁', 'y₂'], [['value', s.y[0], [s.y[1], 'mk'], s.y[2]], ['weight', '1', ['4', 'mk'], '1']], 'Simpson weights')
            + (shown ? note(`<b>${fmtN(v, 4)}</b>. Check the weights always sum to 6 before dividing by 3 — that is the quickest way to catch a mis-typed quadrature rule.`) : '');
        }
      },
      {
        id: 'a3', mod: 'applied', diff: 'medium', fmt: 'num', title: 'The I term of a PID loop',
        ask: s => `A loop runs every ${s.dt}&thinsp;ms and accumulates <code>I += Ki * error * dt</code> with Ki = ${s.ki}. Errors of <code>${s.e.join(', ')}</code> arrive on four consecutive ticks. What is I afterwards, starting from 0?`,
        hint: 'This is rectangular integration. Convert dt to seconds first, then add up Ki·e·dt for each tick.',
        concept: 'The integral term is a running sum of error &times; time, and it is what removes steady-state offset: as long as any error persists, I keeps growing until the output is enough to cancel it. It is also where integral windup lives — if the actuator saturates, I keeps accumulating with no effect and then vastly overshoots on the way back, which is why real controllers clamp it.',
        setup() {
          const dt = pick([1, 2, 5, 10]), ki = pick([0.1, 0.2, 0.5, 1]);
          const e = Array.from({length: 4}, () => rnd(-5, 10));
          const v = ki * (dt / 1000) * e.reduce((a, b) => a + b, 0);
          return num(v, Math.max(0.0005, Math.abs(v) * 0.01), {dt, ki, e});
        },
        render(s, shown) {
          const dts = s.dt / 1000, sum = s.e.reduce((a, b) => a + b, 0);
          return code(`// fixed-rate integrator, dt = ${s.dt} ms = ${dts} s\nfor (int k = 0; k < 4; k++) {\n  I += ${s.ki}f * error[k] * ${dts}f;\n}`)
            + tbl(['tick', '0', '1', '2', '3', 'Σe'],
              [['error', ...s.e, [`${sum}`, 'mk']],
              ['I after', ...s.e.map((_, i) => shown ? fmtN(s.ki * dts * s.e.slice(0, i + 1).reduce((a, b) => a + b, 0), 5) : '?'), shown ? [`<b>${fmtN(s.ki * dts * sum, 5)}</b>`, 'mk'] : ['?', 'q']]])
            + (shown ? note(`I = ${s.ki} &times; ${dts} &times; ${sum} = <b>${fmtN(s.ki * dts * sum, 5)}</b>. Because dt is constant it factors out — which is exactly why fixed-rate loops fold dt into Ki and skip the multiply entirely.`) : '');
        }
      },
      {
        id: 'a4', mod: 'applied', diff: 'medium', fmt: 'num', title: 'Time to reach a threshold',
        ask: s => `An RC network charges as <code>v(t) = ${s.V}(1 &minus; e<sup>&minus;t/&tau;</sup>)</code> with &tau; = ${s.tau}&thinsp;&micro;s. How long, in &micro;s, until it reaches ${s.pct}% of ${s.V}&thinsp;V?`,
        hint: 'Set the expression equal to the fraction, rearrange to isolate the exponential, then take a natural log.',
        concept: 'Rearranging a decay for time is the everyday inverse of an exponential, and the answer t = &minus;&tau;&thinsp;ln(1 &minus; f) is worth internalising: 63% at one &tau;, 95% at three, 99.3% at five. It sets how long you must wait after enabling a rail before sampling, how long a sensor needs to settle, and how far apart two edges must be for a debounce filter to see them as separate.',
        setup() {
          const V = pick([3.3, 5, 1.8]), tau = pick([10, 22, 47, 100]), pct = pick([50, 63, 90, 95, 99]);
          const t = -tau * Math.log(1 - pct / 100);
          return num(t, Math.max(0.05, t * 0.01), {V, tau, pct});
        },
        render(s, shown) {
          const f = s.pct / 100, t = -s.tau * Math.log(1 - f);
          return eq(`${f} = 1 − e^(−t/${s.tau})      ⇒      e^(−t/${s.tau}) = ${fmtN(1 - f, 4)}`,
            shown ? `t = −${s.tau} · ln(${fmtN(1 - f, 4)}) = ${fmtN(t, 4)} µs` : 't = ?')
            + plotCT([{f: x => s.V * (1 - Math.exp(-x / s.tau)), label: 'v(t)'}], {
              x: [0, s.tau * 5], y: [0, s.V * 1.15], xlabel: 't (µs)', ylabel: 'V',
              hlines: [{y: s.V * f, label: `${s.pct}%`}],
              marks: [{x: t, y: s.V * f, label: shown ? `${fmtN(t, 2)} µs` : '?', color: shown ? 'var(--on)' : 'var(--unk)'}]
            })
            + (shown ? note(`t = <b>${fmtN(t, 4)} &micro;s</b>, or ${fmtN(t / s.tau, 3)} time constants. Note the answer scales with &tau; alone — the supply voltage cancels out entirely.`) : '');
        }
      },
      {
        id: 'a5', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Central difference on real samples',
        ask: s => `Samples arrive every ${s.h}&thinsp;ms: <code>${s.y.join(', ')}</code>. Estimate the derivative at the middle sample, in units per ms, using a central difference.`,
        hint: '(y[k+1] − y[k−1]) / (2h) — the sample at k itself is not used at all.',
        concept: 'The central difference cancels the first-order error term of the naive forward difference, giving h&sup2; accuracy for the same one subtraction. It costs one sample of latency, since it needs the future sample, which is why a real-time D-term usually uses the backward difference instead and accepts the extra error. Either way, subtracting two nearly equal noisy samples amplifies noise by 1/h — filter first.',
        setup() {
          const h = pick([1, 2, 5]);
          const y = Array.from({length: 5}, (_, i) => rnd(10, 60) + i * rnd(2, 12));
          const d = (y[3] - y[1]) / (2 * h);
          return num(d, Math.max(0.005, Math.abs(d) * 0.01), {h, y});
        },
        render(s, shown) {
          const d = (s.y[3] - s.y[1]) / (2 * s.h);
          return eq(`f′(t₂) ≈ ( y₃ − y₁ ) / (2h)`,
            shown ? `= (${s.y[3]} − ${s.y[1]}) / (2 × ${s.h}) = ${fmtN(d, 4)} per ms` : '= ?')
            + plotDT(s.y, {n0: 0, xlabel: 'sample k', values: true, hi: [1, 3], label: 'only the two shaded samples are used'})
            + (shown ? note(`<b>${fmtN(d, 4)}</b> units/ms. A forward difference from y&#8322; to y&#8323; would give ${fmtN((s.y[3] - s.y[2]) / s.h, 4)} — a different number, and a worse estimate of the slope <em>at</em> sample 2.`) : '');
        }
      },
      {
        id: 'a6', mod: 'applied', diff: 'expert', fmt: 'num', title: 'Best step size for a float derivative',
        ask: 'For a forward difference in IEEE single precision (&epsilon; &asymp; 1.19e&minus;7), roughly what h minimises the total error near x = 1? Give the exponent n in h &asymp; 10<sup>n</sup>.',
        hint: 'The total error is about h/2 + 2ε/h. Minimise it: differentiate with respect to h, set to zero, and you get h ≈ 2√ε.',
        concept: 'This is the calculus of the numerical method itself — using a derivative to tune a derivative. The result h &asymp; &radic;&epsilon; costs you half your significant digits: a single-precision forward difference cannot do better than about 3 or 4 correct digits, no matter how the code is written. If you need more, you change method (central difference, complex-step, or automatic differentiation), not the step size.',
        setup() {
          return num(-4, 0.6, {alts: ['-4', '−4']});
        },
        render(s, shown) {
          const eps = 1.19e-7;
          const rows = [-8, -6, -4, -2].map(n => {
            const h = Math.pow(10, n);
            return [`10^${n}`, fmtN(h / 2, 9), fmtN(2 * eps / h, 9), fmtN(h / 2 + 2 * eps / h, 9)];
          });
          return eq('E(h) ≈ h/2 + 2ε/h',
            "E′(h) = 1/2 − 2ε/h² = 0   ⇒   h = 2√ε ≈ 7e−4",
            '# truncation grows with h, rounding grows as h shrinks — the sum has a minimum')
            + tbl(['h', 'truncation', 'rounding', 'total'], rows, 'the error is a U-shaped curve')
            + (shown ? note(`h &asymp; 2&radic;&epsilon; &asymp; 7&times;10<sup>&minus;4</sup>, so <b>n &asymp; &minus;4</b> (anything from &minus;4 to &minus;3 is the flat bottom of the U). Going to h = 10<sup>&minus;8</sup> makes the estimate <em>worse</em> by four orders of magnitude — the classic trap.`) : '');
        }
      }
    ];

    const PROBLEMS = [...P_A, ...P_B, ...P_C].sort((a, b) => MOD_INDEX[a.mod] - MOD_INDEX[b.mod]);
    const BY_ID = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
    PROBLEMS.forEach(p => {p.s = p.setup();});

    /* ============================================================
       PART 4 — answer checking
       Accept any reasonable spelling of the same value.
       ============================================================ */
    function norm(v) {return String(v).trim().toLowerCase().replace(/[\s_,]/g, '').replace(/[−–—]/g, '-');}

    function boolOf(s) {
      if (['yes', 'y', 'true', 't'].includes(s)) return true;
      if (['no', 'n', 'false', 'f'].includes(s)) return false;
      return null;
    }

    function numOf(s) {
      if (/^-?\d*\.?\d+(e[-+]?\d+)?$/.test(s)) return parseFloat(s);
      if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) {const [a, b] = s.split('/').map(Number); return a / b;}
      if (/^-?0x[0-9a-f]+$/.test(s)) return parseInt(s.replace('-0x', '0x'), 16) * (s[0] === '-' ? -1 : 1);
      if (/^-?0b[01]+$/.test(s)) return parseInt(s.replace('-0b', '0b').slice(2), 2) * (s[0] === '-' ? -1 : 1);
      return null;
    }

    function accepts(expected, given) {
      const e = norm(expected), g = norm(given);
      if (!g) return false;
      if (e === g) return true;
      const eb = boolOf(e);
      if (eb !== null) return boolOf(g) === eb;
      const en = numOf(e), gn = numOf(g);
      return en !== null && gn !== null && Math.abs(en - gn) < 1e-9;
    }

    /* numeric problems carry s.val and s.tol */
    function checkAnswer(p, given) {
      const s = p.s;
      if (s.tol !== undefined && s.val !== undefined) {
        const g = numOf(norm(given));
        if (g !== null && Math.abs(g - s.val) <= s.tol) return true;
        return (s.alts || []).some(c => accepts(c, given));
      }
      return [s.answer, ...(s.alts || [])].some(c => accepts(c, given));
    }

    const FMT_HELP = {
      num: 'a number — a couple of decimals is plenty',
      dec: 'a whole number',
      hex: 'answer in hex, e.g. 0x2A',
      bin: 'answer in binary, e.g. 0b1011',
      yesno: 'yes or no',
      expr: 'an expression, e.g. 3x^2 - 2x',
      mc: 'pick one'
    };

    /* ============================================================
       PART 5 — application state
       ============================================================ */
    const STORE_KEY = 'calclab.progress.v1';

    const app = {
      tab: 'learn', cur: 0,
      solved: new Set(),
      tried: {}, feedback: {}, inputs: {}, pick: {}, hint: {}, reveal: {}, why: {}
    };

    function save() {try {localStorage.setItem(STORE_KEY, JSON.stringify([...app.solved]));} catch (e) { }}
    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) JSON.parse(raw).forEach(id => {if (BY_ID[id]) app.solved.add(id);});
      } catch (e) { }
    }

    const isShown = p => app.feedback[p.id] === 'correct' || app.reveal[p.id];
    const askOf = p => typeof p.ask === 'function' ? p.ask(p.s) : p.ask;

    /* ============================================================
       PART 6 — views
       ============================================================ */
    function view() {
      const solved = app.solved.size, total = PROBLEMS.length;
      let h = `<div class="masthead">
          <h1>Calc Lab</h1>
          <span class="sub">differential &amp; integral calculus &mdash; ${total} problems across ${MODULES.length} modules</span>
        </div>
        <div class="tab-bar">
          ${[['learn', 'Learn'], ['problems', `Problems (${solved}/${total})`], ['ref', 'Reference']]
          .map(([k, t]) => `<button class="tab ${app.tab === k ? 'active' : ''}" onclick="setTab('${k}')">${t}</button>`).join('')}
        </div>`;

      if (app.tab === 'learn') h += viewLearn();
      else if (app.tab === 'problems') h += viewList();
      else h += viewRef();

      document.getElementById('app').innerHTML = h;
      if (app.tab === 'learn') {
        const el = document.getElementById('ans');
        if (el) el.focus();
      }
    }

    function viewLearn() {
      const p = PROBLEMS[app.cur], s = p.s, shown = isShown(p);
      const mod = MODULES[MOD_INDEX[p.mod]];
      const firstOfMod = PROBLEMS.findIndex(x => x.mod === p.mod) === app.cur;
      const inMod = PROBLEMS.filter(x => x.mod === p.mod);

      let h = '';
      if (firstOfMod) {
        h += `<div class="modcard">
            <div class="t">Module ${MOD_INDEX[p.mod] + 1} of ${MODULES.length}</div>
            <h2>${mod.name}</h2>
            <p>${mod.blurb}</p>
          </div>`;
      }

      h += `<div class="card">
          <div class="problem-header">
            <div>
              <div class="crumb">${mod.name} &middot; ${inMod.indexOf(p) + 1} of ${inMod.length}</div>
              <h3>${p.title}</h3>
            </div>
            <span class="badge badge-${p.diff}">${p.diff}</span>
          </div>
          <p class="ask">${askOf(p)}</p>
          ${p.render(s, shown)}`;

      if (p.fmt === 'mc') {
        const picked = app.pick[p.id];
        h += `<div class="choices">` + s.choices.map((c, i) => {
          let cls = '';
          if (shown && i === s.ai) cls = 'right';
          else if (picked === i && app.feedback[p.id] === 'wrong') cls = 'picked';
          return `<button class="choice ${cls}" ${shown ? 'disabled' : ''} onclick="chooseMC(${i})">
              <span class="key">${'ABCD'[i]}</span><span>${c}</span></button>`;
        }).join('') + `</div>`;
      }

      if (!shown) {
        h += `<div class="answer-row">`;
        if (p.fmt !== 'mc') {
          h += `<input type="text" id="ans" placeholder="${FMT_HELP[p.fmt]}" value="${esc(app.inputs[p.id] || '')}"
                   oninput="app.inputs['${p.id}']=this.value"
                   onkeydown="if(event.key==='Enter')submit()">
            <button class="btn btn-primary" onclick="submit()">Check</button>`;
        }
        h += `<button class="linkbtn" onclick="tog('hint','${p.id}')">${app.hint[p.id] ? 'hide hint' : 'hint'}</button>
            <button class="linkbtn" onclick="tog('reveal','${p.id}')">show me</button>
          </div>`;
        if (app.hint[p.id]) h += `<div class="feedback hint">${p.hint}</div>`;
        if (app.feedback[p.id] === 'wrong') {
          const n = app.tried[p.id] || 0;
          h += `<div class="feedback wrong">Not quite &mdash; ${n >= 3 ? 'try the hint, or use <b>show me</b> to walk through it.' : 'have another go.'}</div>`;
        }
      } else {
        const correct = app.feedback[p.id] === 'correct';
        h += `<div class="feedback ${correct ? 'correct' : 'hint'}">
            ${correct ? '&#10003; Correct' : 'Answer'}: <span class="mono"><b>${esc(s.answer)}</b></span>
            &nbsp;<button class="linkbtn" style="color:inherit" onclick="tog('why','${p.id}')">${app.why[p.id] ? 'hide' : 'why this matters'}</button>
            ${app.why[p.id] ? `<div style="margin-top:8px;color:var(--tx-2)">${p.concept}</div>` : ''}
          </div>`;
      }

      h += `<div class="navrow">
          <button class="btn btn-sm" onclick="nav(-1)" ${app.cur === 0 ? 'disabled style="opacity:.4"' : ''}>&larr; Prev</button>
          <button class="btn btn-sm" onclick="nav(1)" ${app.cur === PROBLEMS.length - 1 ? 'disabled style="opacity:.4"' : ''}>Next &rarr;</button>
          <button class="btn btn-sm" onclick="regen()">${p.fmt === 'mc' ? 'Reshuffle' : 'New numbers'}</button>
          <span class="spacer"></span>
          <span style="font-size:12px;color:var(--tx-3)">${app.cur + 1} / ${PROBLEMS.length}</span>
        </div></div>`;
      return h;
    }

    function viewList() {
      const solved = app.solved.size, total = PROBLEMS.length;
      const byDiff = d => PROBLEMS.filter(p => p.diff === d && app.solved.has(p.id)).length;
      let h = `<div class="stat-grid">
          <div class="stat"><div class="stat-val">${solved}</div><div class="stat-lbl">solved</div></div>
          <div class="stat"><div class="stat-val">${total - solved}</div><div class="stat-lbl">remaining</div></div>
          <div class="stat"><div class="stat-val">${Math.round(solved / total * 100)}%</div><div class="stat-lbl">complete</div></div>
          <div class="stat"><div class="stat-val">${byDiff('hard') + byDiff('expert')}</div><div class="stat-lbl">hard+ solved</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${solved / total * 100}%"></div></div>
        <div class="card">`;

      MODULES.forEach((m, mi) => {
        const list = PROBLEMS.filter(p => p.mod === m.id);
        const done = list.filter(p => app.solved.has(p.id)).length;
        h += `<div class="modhead"><span class="t">${mi + 1}. ${m.name}</span><span class="line"></span><span class="c">${done}/${list.length}</span></div>`;
        list.forEach(p => {
          const i = PROBLEMS.indexOf(p), ok = app.solved.has(p.id);
          h += `<div class="pitem ${ok ? 'solved' : ''} ${i === app.cur ? 'current' : ''}" onclick="go(${i})">
              <div class="pi-icon ${ok ? 'yes' : 'no'}">${ok ? '&#10003;' : i + 1}</div>
              <div class="pi-info"><div class="pi-title">${p.title}</div><div class="pi-sub">${askOf(p).replace(/<[^>]+>/g, '')}</div></div>
              <span class="badge badge-${p.diff}">${p.diff}</span>
            </div>`;
        });
      });

      h += `<div class="navrow"><button class="btn btn-sm" onclick="resetAll()">Reset progress</button></div></div>`;
      return h;
    }


    function viewRef() {
      return `<div class="card">
        <h2>Derivatives worth knowing cold</h2>
        ${refTable([
        ['d/dx xⁿ', 'n·xⁿ⁻¹ — the power rule; a constant gives 0'],
        ['d/dx eᵏˣ', 'k·eᵏˣ — proportional to itself, which is why RC, RL and thermal systems share a shape'],
        ['d/dx ln x', '1/x — steep near zero, almost flat for large x'],
        ['d/dx sin(ωt)', 'ω·cos(ωt) — the ω is why differentiators amplify high frequencies'],
        ['d/dx cos(ωt)', '−ω·sin(ωt)'],
        ['(uv)′', 'u′v + uv′ — the product rule'],
        ['(u/v)′', '(u′v − uv′)/v² — order matters in the numerator'],
        ['f(g(x))′', 'f′(g(x))·g′(x) — the chain rule; backpropagation is this, cached'],
        ['∂f/∂x', 'differentiate in x, freeze every other variable'],
        ['∇f', '(∂f/∂x, ∂f/∂y, …) — points uphill, perpendicular to the contour']
      ])}
        <h2 style="margin-top:18px">Integrals worth knowing cold</h2>
        ${refTable([
        ['∫ xⁿ dx', 'xⁿ⁺¹/(n+1) + C, for n ≠ −1'],
        ['∫ x⁻¹ dx', 'ln|x| + C — the one exception to the power rule'],
        ['∫ eᵏˣ dx', 'eᵏˣ/k + C'],
        ['∫₀^∞ e^(−t/τ) dt', 'τ — the whole tail is worth one time constant at the initial rate'],
        ['∫ sin(ωt) dt', '−cos(ωt)/ω + C'],
        ['mean of sin² over a period', '½ — the origin of RMS = amplitude/√2'],
        ['∫ₐᵇ f dx', 'F(b) − F(a) for any antiderivative F — the fundamental theorem'],
        ['double integral, rectangle', 'if f(x,y) = g(x)h(y) it factors into two 1-D integrals']
      ])}
        <h2 style="margin-top:18px">Numerical recipes</h2>
        ${refTable([
        ['forward difference', '(f(x+h) − f(x))/h — error O(h), one extra evaluation'],
        ['central difference', '(f(x+h) − f(x−h))/2h — error O(h²), costs one sample of latency'],
        ['best h, forward', '≈ 2√ε — about 7e−4 in float, 3e−8 in double. Smaller is worse'],
        ['trapezoid rule', 'h(y₀/2 + y₁ + … + yₙ/2) — error O(h²), exact for straight lines'],
        ["Simpson's rule", '(h/3)(y₀ + 4y₁ + 2y₂ + 4y₃ + … + yₙ) — error O(h⁴), needs an even count'],
        ["Newton's method", 'x ← x − f(x)/f′(x) — doubles correct digits per step near the root'],
        ['gradient descent', 'x ← x − η∇f — converges for a quadratic when |1 − 2aη| < 1'],
        ['forward Euler', 'y ← y + h·f(t, y) — the integral a control loop actually computes']
      ])}
        <h2 style="margin-top:18px">Reading the result</h2>
        ${refTable([
        ['f′ > 0', 'increasing;  f′ < 0 decreasing;  f′ = 0 stationary'],
        ['f″ > 0', 'concave up — a stationary point here is a minimum'],
        ['f″ < 0', 'concave down — a stationary point here is a maximum'],
        ['f″ = 0', 'test inconclusive; could be a minimum, maximum or inflection'],
        ['relative error of a product', 'add the relative errors, weighted by each exponent'],
        ['limit at infinity of a ratio', 'ratio of leading coefficients — the constant factor behind Big-O'],
        ['continuity at a join', 'both pieces must agree in value; matching slope too gives a smooth C¹ join']
      ])}
      </div>`;
    }

    function refTable(rows) {
      return `<table class="reft">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    }

    /* ---------- actions ---------- */
    function setTab(t) {app.tab = t; view();}
    function go(i) {app.cur = i; app.tab = 'learn'; view();}
    function nav(d) {app.cur = Math.max(0, Math.min(PROBLEMS.length - 1, app.cur + d)); view();}
    function tog(k, id) {app[k][id] = !app[k][id]; view();}

    function mark(p, ok) {
      app.tried[p.id] = (app.tried[p.id] || 0) + 1;
      if (ok) {app.feedback[p.id] = 'correct'; app.solved.add(p.id); save();}
      else app.feedback[p.id] = 'wrong';
      view();
    }

    function submit() {
      const p = PROBLEMS[app.cur];
      const given = app.inputs[p.id] || '';
      if (!given.trim()) return;
      mark(p, checkAnswer(p, given));
    }

    function chooseMC(i) {
      const p = PROBLEMS[app.cur];
      if (isShown(p)) return;
      app.pick[p.id] = i;
      mark(p, i === p.s.ai);
    }

    function regen() {
      const p = PROBLEMS[app.cur];
      p.s = p.setup();
      app.feedback[p.id] = null;
      app.reveal[p.id] = false;
      app.inputs[p.id] = '';
      app.pick[p.id] = null;
      view();
    }

    function resetAll() {
      if (!confirm('Clear all solved problems?')) return;
      app.solved.clear();
      app.feedback = {}; app.inputs = {}; app.pick = {}; app.reveal = {}; app.hint = {}; app.tried = {};
      save();
      view();
    }

    load();
    view();
  </script>
