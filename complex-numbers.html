        },
        render(s, shown) {
          const m = 1 / Math.hypot(1, s.wrc);
          return eq(`|H| = 1 / √(1 + (ωRC)²) = 1 / √(1 + ${fmtN(s.wrc * s.wrc, 4)})`,
            shown ? `= ${fmtN(m, 5)}   (${fmtN(20 * Math.log10(m), 2)} dB)` : '= ?')
            + plotCT([{f: x => 1 / Math.hypot(1, Math.pow(10, x))}], {
              x: [-2, 2.2], y: [0, 1.1], xlabel: 'log₁₀(ωRC)', ylabel: '|H|',
              vlines: [{x: Math.log10(s.wrc), label: `ωRC = ${s.wrc}`}]
            })
            + (shown ? note(`<b>${fmtN(m, 5)}</b>, or ${fmtN(20 * Math.log10(m), 3)}&thinsp;dB. Far above the corner |H| &asymp; 1/(&omega;RC) — a straight &minus;20&thinsp;dB/decade line on a log plot.`) : '');
        }
      },
      {
        id: 'x5', mod: 'applied', diff: 'hard', fmt: 'yesno', title: 'Is this discrete filter stable?',
        ask: s => `A digital filter has a pole at <code>z = ${rect(s.p)}</code>. Is it stable?`,
        hint: 'For a discrete-time system, stability means every pole lies strictly inside the unit circle. Compute |z| and compare with 1.',
        concept: 'A pole is a mode that behaves like z^n, so its magnitude is the per-sample growth factor: inside the circle it decays, outside it explodes. This one test is the whole of discrete-time stability, and it is why a fixed-point IIR filter is dangerous — quantising the coefficients moves the poles, and near the circle a tiny move flips the verdict.',
        setup() {
          const r = pick([0.3, 0.6, 0.9, 0.95, 1.0, 1.05, 1.3]);
          const th = pick([0, 30, 45, 90, 135, 180]);
          const p = C(r * Math.cos(radOf(th)), r * Math.sin(radOf(th)));
          return yn(r < 1, {p, r});
        },
        render(s, shown) {
          return eq(`|z| = ${fmtN(cAbs(s.p), 4)}`,
            '# stable ⇔ |z| < 1 strictly;  |z| = 1 rings forever;  |z| > 1 diverges')
            + argand([{z: s.p, label: shown ? `|z| = ${fmtN(cAbs(s.p), 3)}` : 'pole', color: s.r < 1 ? 'var(--on)' : 'var(--off)'}],
              {lim: 1.5, label: 'the unit circle is the whole test'})
            + plotDT(Array.from({length: 16}, (_, n) => Math.pow(s.r, n) * Math.cos(cArg(s.p) * n)),
              {n0: 0, xlabel: 'n', label: 'the mode, sample by sample'})
            + (shown ? note(`|z| = ${fmtN(cAbs(s.p), 4)}, so <b>${s.r < 1 ? 'yes' : 'no'}</b>. ${s.r < 1 ? `Each sample shrinks the mode by ${fmtN(s.r, 3)}&times;.` : s.r === 1 ? 'On the circle exactly — it oscillates forever without decaying, which is marginal, not stable.' : `Each sample grows it by ${fmtN(s.r, 3)}&times;; after 100 samples that is a factor of ${fmtN(Math.pow(s.r, 100), 1)}.`}`) : '');
        }
      },
      {
        id: 'x6', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Amplitude from an IQ sample',
        ask: s => `A receiver reports I = ${s.I} and Q = ${s.Q}. What is the signal amplitude?`,
        hint: 'I and Q are the real and imaginary parts of one complex sample. Amplitude is its magnitude.',
        concept: 'An IQ pair is a complex number arriving once per sample, and every measurement you want from it is a complex operation: amplitude is the magnitude, phase is atan2, frequency is the rate of change of phase, and power is I² + Q². A software radio is, at bottom, complex arithmetic applied at a few million samples a second.',
        setup() {
          const [a, b, c] = pick(TRIPLES);
          const k = pick([1, 10, 100]);
          return num(c * k, Math.max(0.02, c * k * 0.01), {I: pick([1, -1]) * a * k, Q: pick([1, -1]) * b * k});
        },
        render(s, shown) {
          const z = C(s.I, s.Q);
          return eq(`amplitude = √(I² + Q²) = √(${s.I}² + ${s.Q}²)`,
            `phase = atan2(Q, I) = ${fmtN(degOf(cArg(z)), 2)}°`,
            shown ? `amplitude = ${fmtN(cAbs(z), 4)}` : 'amplitude = ?')
            + argand([{z, label: shown ? `${fmtN(cAbs(z), 1)} ∠ ${fmtN(degOf(cArg(z)), 1)}°` : 'I + jQ'}],
              {xlabel: 'I', ylabel: 'Q'})
            + (shown ? note(`<b>${fmtN(cAbs(z), 4)}</b>. Power is I&sup2; + Q&sup2; = ${s.I * s.I + s.Q * s.Q}, available without the square root — which is why RSSI is usually reported in dB of power, not amplitude.`) : '');
        }
      },
      {
        id: 'x7', mod: 'applied', diff: 'expert', fmt: 'num', title: 'Phase step of an oscillator',
        ask: s => `An NCO generates <code>e<sup>j2&pi;ft/f<sub>s</sub></sup></code> at f = ${s.f}&thinsp;Hz with a sample rate of ${s.fs}&thinsp;Hz. How many degrees does the phase advance per sample?`,
        hint: 'One sample is 1/fs seconds. Per sample the phase advances 2πf/fs radians — convert to degrees.',
        concept: 'A numerically controlled oscillator is a phase accumulator plus a lookup table: add a fixed increment each sample, wrap, read cos and sin. The increment is this angle, and if it exceeds 180° per sample you have violated Nyquist — the output aliases to a different, lower frequency, which is why an NCO tuning word is only ever meaningful below fs/2.',
        setup() {
          const fs = pick([8000, 44100, 48000, 1000000]);
          const f = pick([100, 440, 1000, 4000, Math.round(fs / 4), Math.round(fs / 3)]);
          return num(360 * f / fs, Math.max(0.01, 360 * f / fs * 0.01), {f, fs});
        },
        render(s, shown) {
          const d = 360 * s.f / s.fs;
          return eq(`Δφ = 360° × f / f_s = 360° × ${s.f} / ${s.fs}`,
            shown ? `= ${fmtN(d, 5)}° per sample` : '= ?')
            + chips([['f', `${s.f} Hz`], ['fs', `${s.fs} Hz`], ['Δφ', shown ? `${fmtN(d, 3)}°` : '?'],
            ['Nyquist', d < 180 ? 'satisfied' : 'violated', d < 180 ? 'good' : 'bad']])
            + (shown ? note(`<b>${fmtN(d, 5)}&deg;</b> per sample, so a full cycle takes ${fmtN(s.fs / s.f, 3)} samples. Nyquist caps this at 180&deg; per sample — beyond that the sequence is indistinguishable from a lower frequency.`) : '');
        }
      }
    ];

    const PROBLEMS = [...P_A, ...P_B, ...P_C].sort((a, b) => MOD_INDEX[a.mod] - MOD_INDEX[b.mod]);
    const BY_ID = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
    PROBLEMS.forEach(p => {p.s = p.setup();});

    /* ============================================================
       PART 4 — answer checking
       Accept any reasonable spelling of the same value.
       ============================================================ */
    function norm(v) {return String(v).trim().toLowerCase().replace(/[\s_,]/g, '').replace(/[−–—]/g, '-');}

    function boolOf(s) {
      if (['yes', 'y', 'true', 't'].includes(s)) return true;
      if (['no', 'n', 'false', 'f'].includes(s)) return false;
      return null;
    }

    function numOf(s) {
      if (/^-?\d*\.?\d+(e[-+]?\d+)?$/.test(s)) return parseFloat(s);
      if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) {const [a, b] = s.split('/').map(Number); return a / b;}
      if (/^-?0x[0-9a-f]+$/.test(s)) return parseInt(s.replace('-0x', '0x'), 16) * (s[0] === '-' ? -1 : 1);
      if (/^-?0b[01]+$/.test(s)) return parseInt(s.replace('-0b', '0b').slice(2), 2) * (s[0] === '-' ? -1 : 1);
      return null;
    }

    function accepts(expected, given) {
      const e = norm(expected), g = norm(given);
      if (!g) return false;
      if (e === g) return true;
      const eb = boolOf(e);
      if (eb !== null) return boolOf(g) === eb;
      const en = numOf(e), gn = numOf(g);
      return en !== null && gn !== null && Math.abs(en - gn) < 1e-9;
    }

    /* numeric problems carry s.val and s.tol */
    function checkAnswer(p, given) {
      const s = p.s;
      if (s.tol !== undefined && s.val !== undefined) {
        const g = numOf(norm(given));
        if (g !== null && Math.abs(g - s.val) <= s.tol) return true;
        return (s.alts || []).some(c => accepts(c, given));
      }
      return [s.answer, ...(s.alts || [])].some(c => accepts(c, given));
    }

    const FMT_HELP = {
      num: 'a number — a couple of decimals is plenty',
      dec: 'a whole number',
      hex: 'answer in hex, e.g. 0x2A',
      bin: 'answer in binary, e.g. 0b1011',
      yesno: 'yes or no',
      expr: 'an expression, e.g. 3x^2 - 2x',
      mc: 'pick one'
    };

    /* ============================================================
       PART 5 — application state
       ============================================================ */
    const STORE_KEY = 'cplxlab.progress.v1';

    const app = {
      tab: 'learn', cur: 0,
      solved: new Set(),
      tried: {}, feedback: {}, inputs: {}, pick: {}, hint: {}, reveal: {}, why: {}
    };

    function save() {try {localStorage.setItem(STORE_KEY, JSON.stringify([...app.solved]));} catch (e) { }}
    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) JSON.parse(raw).forEach(id => {if (BY_ID[id]) app.solved.add(id);});
      } catch (e) { }
    }

    const isShown = p => app.feedback[p.id] === 'correct' || app.reveal[p.id];
    const askOf = p => typeof p.ask === 'function' ? p.ask(p.s) : p.ask;

    /* ============================================================
       PART 6 — views
       ============================================================ */
    function view() {
      const solved = app.solved.size, total = PROBLEMS.length;
      let h = `<div class="masthead">
          <h1>Complex Lab</h1>
          <span class="sub">complex numbers &amp; phasors &mdash; ${total} problems across ${MODULES.length} modules</span>
        </div>
        <div class="tab-bar">
          ${[['learn', 'Learn'], ['problems', `Problems (${solved}/${total})`], ['ref', 'Reference']]
          .map(([k, t]) => `<button class="tab ${app.tab === k ? 'active' : ''}" onclick="setTab('${k}')">${t}</button>`).join('')}
        </div>`;

      if (app.tab === 'learn') h += viewLearn();
      else if (app.tab === 'problems') h += viewList();
      else h += viewRef();

      document.getElementById('app').innerHTML = h;
      if (app.tab === 'learn') {
        const el = document.getElementById('ans');
        if (el) el.focus();
      }
    }

    function viewLearn() {
      const p = PROBLEMS[app.cur], s = p.s, shown = isShown(p);
      const mod = MODULES[MOD_INDEX[p.mod]];
      const firstOfMod = PROBLEMS.findIndex(x => x.mod === p.mod) === app.cur;
      const inMod = PROBLEMS.filter(x => x.mod === p.mod);

      let h = '';
      if (firstOfMod) {
        h += `<div class="modcard">
            <div class="t">Module ${MOD_INDEX[p.mod] + 1} of ${MODULES.length}</div>
            <h2>${mod.name}</h2>
            <p>${mod.blurb}</p>
          </div>`;
      }

      h += `<div class="card">
          <div class="problem-header">
            <div>
              <div class="crumb">${mod.name} &middot; ${inMod.indexOf(p) + 1} of ${inMod.length}</div>
              <h3>${p.title}</h3>
            </div>
            <span class="badge badge-${p.diff}">${p.diff}</span>
          </div>
          <p class="ask">${askOf(p)}</p>
          ${p.render(s, shown)}`;

      if (p.fmt === 'mc') {
        const picked = app.pick[p.id];
        h += `<div class="choices">` + s.choices.map((c, i) => {
          let cls = '';
          if (shown && i === s.ai) cls = 'right';
          else if (picked === i && app.feedback[p.id] === 'wrong') cls = 'picked';
          return `<button class="choice ${cls}" ${shown ? 'disabled' : ''} onclick="chooseMC(${i})">
              <span class="key">${'ABCD'[i]}</span><span>${c}</span></button>`;
        }).join('') + `</div>`;
      }

      if (!shown) {
        h += `<div class="answer-row">`;
        if (p.fmt !== 'mc') {
          h += `<input type="text" id="ans" placeholder="${FMT_HELP[p.fmt]}" value="${esc(app.inputs[p.id] || '')}"
                   oninput="app.inputs['${p.id}']=this.value"
                   onkeydown="if(event.key==='Enter')submit()">
            <button class="btn btn-primary" onclick="submit()">Check</button>`;
        }
        h += `<button class="linkbtn" onclick="tog('hint','${p.id}')">${app.hint[p.id] ? 'hide hint' : 'hint'}</button>
            <button class="linkbtn" onclick="tog('reveal','${p.id}')">show me</button>
          </div>`;
        if (app.hint[p.id]) h += `<div class="feedback hint">${p.hint}</div>`;
        if (app.feedback[p.id] === 'wrong') {
          const n = app.tried[p.id] || 0;
          h += `<div class="feedback wrong">Not quite &mdash; ${n >= 3 ? 'try the hint, or use <b>show me</b> to walk through it.' : 'have another go.'}</div>`;
        }
      } else {
        const correct = app.feedback[p.id] === 'correct';
        h += `<div class="feedback ${correct ? 'correct' : 'hint'}">
            ${correct ? '&#10003; Correct' : 'Answer'}: <span class="mono"><b>${esc(s.answer)}</b></span>
            &nbsp;<button class="linkbtn" style="color:inherit" onclick="tog('why','${p.id}')">${app.why[p.id] ? 'hide' : 'why this matters'}</button>
            ${app.why[p.id] ? `<div style="margin-top:8px;color:var(--tx-2)">${p.concept}</div>` : ''}
          </div>`;
      }

      h += `<div class="navrow">
          <button class="btn btn-sm" onclick="nav(-1)" ${app.cur === 0 ? 'disabled style="opacity:.4"' : ''}>&larr; Prev</button>
          <button class="btn btn-sm" onclick="nav(1)" ${app.cur === PROBLEMS.length - 1 ? 'disabled style="opacity:.4"' : ''}>Next &rarr;</button>
          <button class="btn btn-sm" onclick="regen()">${p.fmt === 'mc' ? 'Reshuffle' : 'New numbers'}</button>
          <span class="spacer"></span>
          <span style="font-size:12px;color:var(--tx-3)">${app.cur + 1} / ${PROBLEMS.length}</span>
        </div></div>`;
      return h;
    }

    function viewList() {
      const solved = app.solved.size, total = PROBLEMS.length;
      const byDiff = d => PROBLEMS.filter(p => p.diff === d && app.solved.has(p.id)).length;
      let h = `<div class="stat-grid">
          <div class="stat"><div class="stat-val">${solved}</div><div class="stat-lbl">solved</div></div>
          <div class="stat"><div class="stat-val">${total - solved}</div><div class="stat-lbl">remaining</div></div>
          <div class="stat"><div class="stat-val">${Math.round(solved / total * 100)}%</div><div class="stat-lbl">complete</div></div>
          <div class="stat"><div class="stat-val">${byDiff('hard') + byDiff('expert')}</div><div class="stat-lbl">hard+ solved</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${solved / total * 100}%"></div></div>
        <div class="card">`;

      MODULES.forEach((m, mi) => {
        const list = PROBLEMS.filter(p => p.mod === m.id);
        const done = list.filter(p => app.solved.has(p.id)).length;
        h += `<div class="modhead"><span class="t">${mi + 1}. ${m.name}</span><span class="line"></span><span class="c">${done}/${list.length}</span></div>`;
        list.forEach(p => {
          const i = PROBLEMS.indexOf(p), ok = app.solved.has(p.id);
          h += `<div class="pitem ${ok ? 'solved' : ''} ${i === app.cur ? 'current' : ''}" onclick="go(${i})">
              <div class="pi-icon ${ok ? 'yes' : 'no'}">${ok ? '&#10003;' : i + 1}</div>
              <div class="pi-info"><div class="pi-title">${p.title}</div><div class="pi-sub">${askOf(p).replace(/<[^>]+>/g, '')}</div></div>
              <span class="badge badge-${p.diff}">${p.diff}</span>
            </div>`;
        });
      });

      h += `<div class="navrow"><button class="btn btn-sm" onclick="resetAll()">Reset progress</button></div></div>`;
      return h;
    }


    function viewRef() {
      return `<div class="card">
        <h2>The rules</h2>
        ${refTable([
        ['j', 'defined by j² = −1; engineering writes j because i is current'],
        ['powers of j', '1, j, −1, −j, repeating every 4 — each step is a 90° turn'],
        ['(a+jb) + (c+jd)', '(a+c) + j(b+d) — componentwise, exactly like vectors'],
        ['(a+jb)(c+jd)', '(ac − bd) + j(ad + bc) — 4 real multiplies, 2 adds'],
        ['conjugate z*', 'a − jb — a mirror in the real axis'],
        ['z z*', 'a² + b² = |z|² — always real, never negative'],
        ['z₁ / z₂', 'z₁z₂* / |z₂|² — make the denominator real first'],
        ['|z|', '√(a² + b²) — amplitude; prefer |z|² when you only need to compare'],
        ['arg z', 'atan2(b, a) — always atan2, never atan(b/a)']
      ])}
        <h2 style="margin-top:18px">Polar and exponential form</h2>
        ${refTable([
        ['r ∠ θ', 'magnitude r, angle θ — built for multiplication'],
        ['rect → polar', 'r = √(a²+b²),  θ = atan2(b, a)'],
        ['polar → rect', 'a = r cos θ,  b = r sin θ  (the I and Q of a carrier)'],
        ['multiply', 'magnitudes multiply, angles add — scale and rotate'],
        ['divide', 'magnitudes divide, angles subtract'],
        ['1/z', 'magnitude 1/r, angle −θ'],
        ['× j', 'a pure 90° anticlockwise rotation, magnitude unchanged'],
        ["Euler's formula", 'e^(jθ) = cos θ + j sin θ,  and |e^(jθ)| = 1 always'],
        ['cos θ', '(e^(jθ) + e^(−jθ))/2 — two counter-rotating unit arrows'],
        ['sin θ', '(e^(jθ) − e^(−jθ))/2j'],
        ['e^((σ+jω)t)', 'envelope e^(σt) × rotation e^(jωt) — growth and oscillation, independent'],
        ["De Moivre", '(r∠θ)ⁿ = rⁿ ∠ nθ'],
        ['N-th roots of 1', 'e^(j2πk/N), k = 0…N−1 — evenly spaced 360°/N apart, and they sum to 0']
      ])}
        <h2 style="margin-top:18px">Where it shows up</h2>
        ${refTable([
        ['capacitor', 'Z = 1/(jωC) — magnitude 1/(ωC), phase −90°'],
        ['inductor', 'Z = jωL — magnitude ωL, phase +90°'],
        ['series R and X', '|Z| = √(R² + X²) — perpendicular, so Pythagoras not addition'],
        ['RC low-pass', 'H = 1/(1 + jωRC);  −3 dB and −45° at ωRC = 1;  −20 dB/decade above'],
        ['phasor V', 'amplitude and phase with e^(jωt) divided out — turns calculus into algebra'],
        ['discrete pole', 'stable ⇔ |z| < 1 strictly;  |z| is the per-sample growth factor'],
        ['s-plane pole', 'stable ⇔ Re{s} < 0;  the imaginary part sets the ringing frequency'],
        ['IQ sample', 'I + jQ;  amplitude = |z|, phase = atan2(Q, I), power = I² + Q²'],
        ['FFT twiddle', 'W = e^(−j2πk/N) — an N-th root of unity; only N/2 need storing'],
        ['NCO phase step', '360°·f/fs per sample — must stay under 180° or it aliases']
      ])}
        <h2 style="margin-top:18px">Traps</h2>
        ${refTable([
        ['atan instead of atan2', 'loses both signs — cannot tell a point from its opposite'],
        ['adding magnitudes', '|z₁ + z₂| ≠ |z₁| + |z₂| unless they point the same way — that is interference'],
        ['forgetting to wrap phase', 'accumulated phase must be reduced mod 360° every step'],
        ['degrees vs radians', 'library trig is in radians; ω is rad/s but Bode plots are in degrees'],
        ['sign of the exponent', 'e^(−jωt) forward, e^(+jωt) inverse — a flipped sign mirrors your spectrum'],
        ['|z| = 1 exactly', 'marginally stable, not stable — quantised coefficients can push it either way']
      ])}
      </div>`;
    }

    function refTable(rows) {
      return `<table class="reft">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    }

    /* ---------- actions ---------- */
    function setTab(t) {app.tab = t; view();}
    function go(i) {app.cur = i; app.tab = 'learn'; view();}
    function nav(d) {app.cur = Math.max(0, Math.min(PROBLEMS.length - 1, app.cur + d)); view();}
    function tog(k, id) {app[k][id] = !app[k][id]; view();}

    function mark(p, ok) {
      app.tried[p.id] = (app.tried[p.id] || 0) + 1;
      if (ok) {app.feedback[p.id] = 'correct'; app.solved.add(p.id); save();}
      else app.feedback[p.id] = 'wrong';
      view();
    }

    function submit() {
      const p = PROBLEMS[app.cur];
      const given = app.inputs[p.id] || '';
      if (!given.trim()) return;
      mark(p, checkAnswer(p, given));
    }

    function chooseMC(i) {
      const p = PROBLEMS[app.cur];
      if (isShown(p)) return;
      app.pick[p.id] = i;
      mark(p, i === p.s.ai);
    }

    function regen() {
      const p = PROBLEMS[app.cur];
      p.s = p.setup();
      app.feedback[p.id] = null;
      app.reveal[p.id] = false;
      app.inputs[p.id] = '';
      app.pick[p.id] = null;
      view();
    }

    function resetAll() {
      if (!confirm('Clear all solved problems?')) return;
      app.solved.clear();
      app.feedback = {}; app.inputs = {}; app.pick = {}; app.reveal = {}; app.hint = {}; app.tried = {};
      save();
      view();
    }

    load();
    view();
  </script>
</body>

</html>
