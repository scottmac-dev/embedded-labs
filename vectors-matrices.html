        },
        render(s, shown) {
          let a = s.t1 + s.t2;
          while (a > 180) a -= 360;
          while (a <= -180) a += 360;
          const R = mMul(mRot(radOf(s.t2)), mRot(radOf(s.t1)));
          return eq(`R(${s.t2}°) · R(${s.t1}°) = R(${s.t1} + ${s.t2}) = R(${s.t1 + s.t2}°)`,
            shown ? `wrapped: ${fmtN(a, 2)}°` : 'wrapped: ?')
            + (shown ? eq(`product matrix = ${mShow(R, 3)}   =   R(${fmtN(a, 1)}°) = ${mShow(mRot(radOf(a)), 3)}`) : '')
            + (shown ? note(`<b>${fmtN(a, 3)}&deg;</b>. In 2-D the order made no difference. In 3-D it would — which is exactly why Euler angles cause so much grief.`) : '');
        }
      },
      {
        id: 't5', mod: 'xform', diff: 'hard', fmt: 'num', title: 'Homogeneous coordinates',
        ask: s => `A 3&times;3 homogeneous matrix has translation (${s.tx}, ${s.ty}) and no rotation or scaling. Apply it to the point (${s.px}, ${s.py}). What is the new x?`,
        hint: 'Write the point as (x, y, 1). The translation column is added straight in.',
        concept: 'Translation is not linear — it moves the origin — so it cannot be a 2×2 matrix. Adding a third coordinate fixed at 1 makes it fit, which is why every graphics pipeline uses 4×4 matrices for 3-D. The payoff is that rotation, scaling, translation and perspective all compose with a single multiply.',
        setup() {
          const tx = rnd(-8, 8), ty = rnd(-8, 8), px = rnd(-6, 6), py = rnd(-6, 6);
          return num(px + tx, 0.01, {tx, ty, px, py});

        render(s, shown) {
          return eq(`M = [[1, 0, ${s.tx}], [0, 1, ${s.ty}], [0, 0, 1]]`,
            `M · (${s.px}, ${s.py}, 1) = (${s.px} + ${s.tx}, ${s.py} + ${s.ty}, 1)`,
            shown ? `= (${s.px + s.tx}, ${s.py + s.ty})` : '= ( ?, ? )')

            + (shown ? note(`New x = <b>${s.px + s.tx}</b>. The fixed 1 in the third slot is what lets the translation column contribute; a direction vector uses 0 there instead, so directions are correctly left untranslated.`) : '');
        }

      {
        id: 't6', mod: 'xform', diff: 'expert', fmt: 'mc', title: 'Why the transform came out wrong',
        ask: 'A model appears at the right place but stretched along the wrong axis after you added a rotation. What is the likely cause?',
        hint: 'Think about whether the scale is being applied in the object frame or the world frame.',
        concept: 'Scale-then-rotate stretches the object along its own axes and then turns it; rotate-then-scale turns it and then stretches along the world axes, shearing it. Both compile, both run, and only one looks right — which is why transform order is written down explicitly in every graphics codebase rather than left to memory.',
        setup() {
          return mc('the scale is being applied after the rotation instead of before it',

              'the matrix was transposed somewhere',
              'the translation column is in the wrong row']);

        render(s, shown) {
          const S = [[3, 0], [0, 1]], R = mRot(radOf(45));

        }

      /* ---------- applied ---------- */
      {

        ask: s => `A stationary accelerometer reads <code>(${s.ax}, ${s.az})</code> g on its x and z axes. What is the tilt from vertical, in degrees?`,
        hint: 'At rest the reading is the gravity vector in board coordinates. The tilt is atan2(x, z).',
        concept: 'A stationary accelerometer measures nothing but gravity, so its direction in board coordinates gives you orientation for free — no gyro needed. The catch is the word stationary: any real acceleration adds to the reading and corrupts the angle, which is why tilt from accelerometers is fused with gyro data rather than trusted alone.',
        setup() {
          const th = pick([0, 10, 20, 30, 45, 60, 90, -30, -45]);
          const ax = Math.round(Math.sin(radOf(th)) * 1000) / 1000;

          const t = degOf(Math.atan2(s.ax, s.az));

            `# magnitude check: √(${s.ax}² + ${s.az}²) = ${fmtN(Math.hypot(s.ax, s.az), 4)} g`)
            + vecPlot([{v: [s.ax, s.az], label: shown ? `${fmtN(t, 1)}° from vertical` : 'gravity'}],
              {lim: 1.4, xlabel: 'x (g)', ylabel: 'z (g)'})
            + (shown ? note(`<b>${fmtN(t, 3)}&deg;</b>. The magnitude coming out at 1&thinsp;g is your validity check — if it is not close to 1, the board is accelerating and the angle is meaningless.`) : '');
        }
      },
      {
        id: 'a2', mod: 'applied', diff: 'medium', fmt: 'num', title: 'Dead reckoning',
        ask: s => `A robot drives ${s.d1}&thinsp;m on a heading of ${s.h1}&deg;, then ${s.d2}&thinsp;m on ${s.h2}&deg; (0&deg; = +x, measured anticlockwise). How far is it from the start?`,
        hint: 'Convert each leg to a vector, add them, then take the magnitude of the sum.',
        concept: 'Dead reckoning is vector addition, and its weakness is also vectorial: heading errors rotate every subsequent leg, so position error grows with distance travelled rather than staying bounded. That is why wheel odometry is always paired with an absolute reference — a beacon, a wall, a magnetometer — to reset the accumulated drift.',
        setup() {
          const d1 = rnd(2, 12), d2 = rnd(2, 12);
          const h1 = pick([0, 30, 45, 60, 90, 135, 180]), h2 = pick([0, 30, 45, 60, 90, 135, 180, -90]);
          const p = [d1 * Math.cos(radOf(h1)) + d2 * Math.cos(radOf(h2)), d1 * Math.sin(radOf(h1)) + d2 * Math.sin(radOf(h2))];
          return num(vLen(p), Math.max(0.02, vLen(p) * 0.01 + 0.01), {d1, d2, h1, h2});
        },
        render(s, shown) {
          const l1 = [s.d1 * Math.cos(radOf(s.h1)), s.d1 * Math.sin(radOf(s.h1))];
          const l2 = [s.d2 * Math.cos(radOf(s.h2)), s.d2 * Math.sin(radOf(s.h2))];
          const p = vAdd(l1, l2);
          return eq(`leg 1 = ${s.d1}·(cos ${s.h1}°, sin ${s.h1}°) = ${vShow(l1, 3)}`,
            `leg 2 = ${s.d2}·(cos ${s.h2}°, sin ${s.h2}°) = ${vShow(l2, 3)}`,
            shown ? `sum = ${vShow(p, 3)},  |sum| = ${fmtN(vLen(p), 4)} m` : 'sum = ?')
            + vecPlot([{v: l1, label: 'leg 1'}, {v: p, from: l1, label: 'leg 2'},
            {v: p, label: shown ? `${fmtN(vLen(p), 2)} m` : '?', color: 'var(--hl)', dash: '5 3'}])
            + (shown ? note(`<b>${fmtN(vLen(p), 4)} m</b>, against ${s.d1 + s.d2}&thinsp;m actually driven. A 1&deg; heading error on leg 1 would displace the endpoint by about ${fmtN(s.d1 * radOf(1), 3)}&thinsp;m — and that error never goes away.`) : '');
        }
      },
      {
        id: 'a3', mod: 'applied', diff: 'medium', fmt: 'mc', title: 'Row-major and the cache',
        ask: 'A C array <code>float m[1024][1024]</code> is summed. Which loop order runs faster, and why?',
        hint: 'C stores rows contiguously. A cache line holds several adjacent floats.',
        concept: 'C is row-major, so consecutive column indices are adjacent in memory. Walking a column instead of a row touches a new cache line every element and wastes most of each one, which can cost an order of magnitude on a large array. The same array, the same arithmetic, the same instruction count — only the access pattern differs.',
        setup() {
          return mc('rows outer, columns inner — consecutive accesses share a cache line',
            ['columns outer, rows inner — it keeps the inner index small',
              'both are identical; the compiler reorders the loops',
              'columns outer, rows inner — it avoids repeated multiplication in the index']);
        },
        render(s, shown) {
          return code(`for (int i = 0; i < 1024; i++)        // fast: row by row\n  for (int j = 0; j < 1024; j++)\n    sum += m[i][j];                  // m[i][j] and m[i][j+1] are adjacent\n\nfor (int j = 0; j < 1024; j++)        // slow: column by column\n  for (int i = 0; i < 1024; i++)\n    sum += m[i][j];                  // each step jumps 4096 bytes`)
            + (shown ? note('A 64-byte cache line holds 16 floats. The row loop uses all 16; the column loop uses 1 and discards the rest, so it moves sixteen times the memory traffic for the same result. Fortran and MATLAB are column-major, so the advice inverts there.') : '');
        }
      },
      {
        id: 'a4', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Cost of a matrix multiply',
        ask: s => `Multiplying two ${s.n}&times;${s.n} matrices the straightforward way, how many multiply-accumulate operations does it take?`,
        hint: 'One MAC per term. There are n² output entries, and each is a dot product of length n.',
        concept: 'The n³ scaling is why matrix multiplication dominates the cost of numerical work, and why so much engineering goes into it: cache blocking, SIMD, and Strassen-style algorithms that trade multiplies for adds. For an embedded target the practical lesson is that doubling the matrix size costs eight times as much, so dimension reduction pays off enormously.',
        setup() {
          const n = pick([2, 3, 4, 8, 16, 32]);
          return {answer: String(n * n * n), n, alts: [String(n * n * n)]};
        },
        render(s, shown) {
          return eq(`n² output entries × n MACs each = n³`,
            shown ? `${s.n}³ = ${s.n * s.n * s.n}` : `${s.n}³ = ?`)
            + tbl(['n', '2', '4', '8', '16', '32'], [['MACs', '8', '64', '512', '4096', '32768']], 'cubic growth')
            + (shown ? note(`<b>${s.n * s.n * s.n}</b> multiply-accumulates. Doubling n multiplies the work by 8 — which is why a 32&times;32 multiply on a microcontroller is a real budget item, not a rounding error.`) : '');
        }
      },
      {
        id: 'a5', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Correct a misaligned sensor',
        ask: s => `A two-axis sensor is misaligned by ${s.th}&deg;. To recover true readings you apply the inverse rotation to the raw pair <code>${vShow(s.raw, 0)}</code>. What is the corrected x?`,
        hint: 'The inverse of R(θ) is R(−θ), which is also its transpose. Apply it to the raw vector.',
        concept: 'Alignment calibration is a rotation matrix stored in flash and applied to every sample. Because rotations are orthonormal, the inverse is the transpose and costs nothing extra to compute — you store one matrix and use it in either direction. Getting the sign of the angle wrong doubles the misalignment instead of removing it, which is a satisfyingly obvious failure once you know to look for it.',
        setup() {
          const th = pick([5, 10, 15, 30, 45, -10, -30]);
          const raw = [rnd(-9, 9) || 4, rnd(-9, 9) || 3];
          const c = mApply(mRot(radOf(-th)), raw);
          return num(c[0], Math.max(0.01, Math.abs(c[0]) * 0.01 + 0.01), {th, raw});
        },
        render(s, shown) {
          const Ri = mRot(radOf(-s.th)), c = mApply(Ri, s.raw);
          return eq(`R(${s.th}°)⁻¹ = R(${-s.th}°) = R(${s.th}°)ᵀ = ${mShow(Ri, 4)}`,
            shown ? `corrected = ${vShow(c, 4)}` : 'corrected = ( ?, ? )')
            + vecPlot([{v: s.raw, label: 'raw'}, {v: c, label: shown ? vShow(c, 2) : '?', color: 'var(--hl)'}])
            + (shown ? note(`Corrected x = <b>${fmtN(c[0], 4)}</b>. Applying R(+${s.th}&deg;) instead would rotate to ${fmtN(mApply(mRot(radOf(s.th)), s.raw)[0], 3)} — twice the misalignment rather than none.`) : '');
        }
      },
      {
        id: 'a6', mod: 'applied', diff: 'expert', fmt: 'num', title: 'Solve a two-point calibration',
        ask: s => `An ADC obeys <code>y = gx + o</code>. It reads ${s.y1} at input ${s.x1} and ${s.y2} at input ${s.x2}. What is the gain g?`,
        hint: 'Two equations, two unknowns. Subtract them to eliminate the offset.',
        concept: 'Two-point calibration is a 2×2 linear solve, and writing it as a matrix makes the failure mode obvious: if the two calibration inputs are close together, the system is nearly singular and the gain estimate amplifies every measurement error. Spreading the calibration points as far apart as the range allows is the whole reason calibration procedures specify near-zero and near-full-scale.',
        setup() {
          const g = pick([0.5, 1, 2, 2.5, 4]), o = rnd(-20, 20);
          const x1 = rnd(0, 20), x2 = x1 + rnd(30, 200);
          return num(g, Math.max(0.005, g * 0.01), {g, o, x1, x2, y1: g * x1 + o, y2: g * x2 + o});
        },
        render(s, shown) {
          const g = (s.y2 - s.y1) / (s.x2 - s.x1), off = s.y1 - g * s.x1;
          return eq(`${s.y1} = g·${s.x1} + o`,
            `${s.y2} = g·${s.x2} + o`,
            `subtract:  ${fmtN(s.y2 - s.y1, 3)} = g·${s.x2 - s.x1}`,
            shown ? `g = ${fmtN(g, 5)},  o = ${fmtN(off, 4)}` : 'g = ?')
            + plotCT([{f: x => g * x + off, label: 'fitted line', color: 'var(--hl)'}],
              {x: [0, s.x2 * 1.2], y: [Math.min(0, s.y1, s.y2) - 5, Math.max(s.y1, s.y2) * 1.2 + 5], xlabel: 'input', ylabel: 'reading',
                marks: [{x: s.x1, y: s.y1, color: 'var(--accent)'}, {x: s.x2, y: s.y2, color: 'var(--accent)'}]})
            + (shown ? note(`g = <b>${fmtN(g, 5)}</b>, offset ${fmtN(off, 4)}. The two points are ${s.x2 - s.x1} apart; halving that separation would double the sensitivity of g to any noise on the readings.`) : '');
        }
      }
    ];

    const PROBLEMS = [...P_A, ...P_B, ...P_C].sort((a, b) => MOD_INDEX[a.mod] - MOD_INDEX[b.mod]);
    const BY_ID = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
    PROBLEMS.forEach(p => {p.s = p.setup();});

    /* ============================================================
       PART 4 — answer checking
       Accept any reasonable spelling of the same value.
       ============================================================ */
    function norm(v) {return String(v).trim().toLowerCase().replace(/[\s_,]/g, '').replace(/[−–—]/g, '-');}

    function boolOf(s) {
      if (['yes', 'y', 'true', 't'].includes(s)) return true;
      if (['no', 'n', 'false', 'f'].includes(s)) return false;
      return null;
    }

    function numOf(s) {
      if (/^-?\d*\.?\d+(e[-+]?\d+)?$/.test(s)) return parseFloat(s);
      if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) {const [a, b] = s.split('/').map(Number); return a / b;}
      if (/^-?0x[0-9a-f]+$/.test(s)) return parseInt(s.replace('-0x', '0x'), 16) * (s[0] === '-' ? -1 : 1);
      if (/^-?0b[01]+$/.test(s)) return parseInt(s.replace('-0b', '0b').slice(2), 2) * (s[0] === '-' ? -1 : 1);
      return null;
    }

    function accepts(expected, given) {
      const e = norm(expected), g = norm(given);
      if (!g) return false;
      if (e === g) return true;
      const eb = boolOf(e);
      if (eb !== null) return boolOf(g) === eb;
      const en = numOf(e), gn = numOf(g);
      return en !== null && gn !== null && Math.abs(en - gn) < 1e-9;
    }

    /* numeric problems carry s.val and s.tol */
    function checkAnswer(p, given) {
      const s = p.s;
      if (s.tol !== undefined && s.val !== undefined) {
        const g = numOf(norm(given));
        if (g !== null && Math.abs(g - s.val) <= s.tol) return true;
        return (s.alts || []).some(c => accepts(c, given));
      }
      return [s.answer, ...(s.alts || [])].some(c => accepts(c, given));
    }

    const FMT_HELP = {
      num: 'a number — a couple of decimals is plenty',
      dec: 'a whole number',
      hex: 'answer in hex, e.g. 0x2A',
      bin: 'answer in binary, e.g. 0b1011',
      yesno: 'yes or no',
      expr: 'an expression, e.g. 3x^2 - 2x',
      mc: 'pick one'
    };

    /* ============================================================
       PART 5 — application state
       ============================================================ */
    const STORE_KEY = 'linlab.progress.v1';

    const app = {
      tab: 'learn', cur: 0,
      solved: new Set(),
      tried: {}, feedback: {}, inputs: {}, pick: {}, hint: {}, reveal: {}, why: {}
    };

    function save() {try {localStorage.setItem(STORE_KEY, JSON.stringify([...app.solved]));} catch (e) { }}
    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) JSON.parse(raw).forEach(id => {if (BY_ID[id]) app.solved.add(id);});
      } catch (e) { }
    }

    const isShown = p => app.feedback[p.id] === 'correct' || app.reveal[p.id];
    const askOf = p => typeof p.ask === 'function' ? p.ask(p.s) : p.ask;

    /* ============================================================
       PART 6 — views
       ============================================================ */
    function view() {
      const solved = app.solved.size, total = PROBLEMS.length;
      let h = `<div class="masthead">
          <h1>Linalg Lab</h1>
          <span class="sub">vectors, matrices &amp; transforms &mdash; ${total} problems across ${MODULES.length} modules</span>
        </div>
        <div class="tab-bar">
          ${[['learn', 'Learn'], ['problems', `Problems (${solved}/${total})`], ['ref', 'Reference']]
          .map(([k, t]) => `<button class="tab ${app.tab === k ? 'active' : ''}" onclick="setTab('${k}')">${t}</button>`).join('')}
        </div>`;

      if (app.tab === 'learn') h += viewLearn();
      else if (app.tab === 'problems') h += viewList();
      else h += viewRef();

      document.getElementById('app').innerHTML = h;
      if (app.tab === 'learn') {
        const el = document.getElementById('ans');
        if (el) el.focus();
      }
    }

    function viewLearn() {
      const p = PROBLEMS[app.cur], s = p.s, shown = isShown(p);
      const mod = MODULES[MOD_INDEX[p.mod]];
      const firstOfMod = PROBLEMS.findIndex(x => x.mod === p.mod) === app.cur;
      const inMod = PROBLEMS.filter(x => x.mod === p.mod);

      let h = '';
      if (firstOfMod) {
        h += `<div class="modcard">
            <div class="t">Module ${MOD_INDEX[p.mod] + 1} of ${MODULES.length}</div>
            <h2>${mod.name}</h2>
            <p>${mod.blurb}</p>
          </div>`;
      }

      h += `<div class="card">
          <div class="problem-header">
            <div>
              <div class="crumb">${mod.name} &middot; ${inMod.indexOf(p) + 1} of ${inMod.length}</div>
              <h3>${p.title}</h3>
            </div>
            <span class="badge badge-${p.diff}">${p.diff}</span>
          </div>
          <p class="ask">${askOf(p)}</p>
          ${p.render(s, shown)}`;

      if (p.fmt === 'mc') {
        const picked = app.pick[p.id];
        h += `<div class="choices">` + s.choices.map((c, i) => {
          let cls = '';
          if (shown && i === s.ai) cls = 'right';
          else if (picked === i && app.feedback[p.id] === 'wrong') cls = 'picked';
          return `<button class="choice ${cls}" ${shown ? 'disabled' : ''} onclick="chooseMC(${i})">
              <span class="key">${'ABCD'[i]}</span><span>${c}</span></button>`;
        }).join('') + `</div>`;
      }

      if (!shown) {
        h += `<div class="answer-row">`;
        if (p.fmt !== 'mc') {
          h += `<input type="text" id="ans" placeholder="${FMT_HELP[p.fmt]}" value="${esc(app.inputs[p.id] || '')}"
                   oninput="app.inputs['${p.id}']=this.value"
                   onkeydown="if(event.key==='Enter')submit()">
            <button class="btn btn-primary" onclick="submit()">Check</button>`;
        }
        h += `<button class="linkbtn" onclick="tog('hint','${p.id}')">${app.hint[p.id] ? 'hide hint' : 'hint'}</button>
            <button class="linkbtn" onclick="tog('reveal','${p.id}')">show me</button>
          </div>`;
        if (app.hint[p.id]) h += `<div class="feedback hint">${p.hint}</div>`;
        if (app.feedback[p.id] === 'wrong') {
          const n = app.tried[p.id] || 0;
          h += `<div class="feedback wrong">Not quite &mdash; ${n >= 3 ? 'try the hint, or use <b>show me</b> to walk through it.' : 'have another go.'}</div>`;
        }
      } else {
        const correct = app.feedback[p.id] === 'correct';
        h += `<div class="feedback ${correct ? 'correct' : 'hint'}">
            ${correct ? '&#10003; Correct' : 'Answer'}: <span class="mono"><b>${esc(s.answer)}</b></span>
            &nbsp;<button class="linkbtn" style="color:inherit" onclick="tog('why','${p.id}')">${app.why[p.id] ? 'hide' : 'why this matters'}</button>
            ${app.why[p.id] ? `<div style="margin-top:8px;color:var(--tx-2)">${p.concept}</div>` : ''}
          </div>`;
      }

      h += `<div class="navrow">
          <button class="btn btn-sm" onclick="nav(-1)" ${app.cur === 0 ? 'disabled style="opacity:.4"' : ''}>&larr; Prev</button>
          <button class="btn btn-sm" onclick="nav(1)" ${app.cur === PROBLEMS.length - 1 ? 'disabled style="opacity:.4"' : ''}>Next &rarr;</button>
          <button class="btn btn-sm" onclick="regen()">${p.fmt === 'mc' ? 'Reshuffle' : 'New numbers'}</button>
          <span class="spacer"></span>
          <span style="font-size:12px;color:var(--tx-3)">${app.cur + 1} / ${PROBLEMS.length}</span>
        </div></div>`;
      return h;
    }

    function viewList() {
      const solved = app.solved.size, total = PROBLEMS.length;
      const byDiff = d => PROBLEMS.filter(p => p.diff === d && app.solved.has(p.id)).length;
      let h = `<div class="stat-grid">
          <div class="stat"><div class="stat-val">${solved}</div><div class="stat-lbl">solved</div></div>
          <div class="stat"><div class="stat-val">${total - solved}</div><div class="stat-lbl">remaining</div></div>
          <div class="stat"><div class="stat-val">${Math.round(solved / total * 100)}%</div><div class="stat-lbl">complete</div></div>
          <div class="stat"><div class="stat-val">${byDiff('hard') + byDiff('expert')}</div><div class="stat-lbl">hard+ solved</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${solved / total * 100}%"></div></div>
        <div class="card">`;

      MODULES.forEach((m, mi) => {
        const list = PROBLEMS.filter(p => p.mod === m.id);
        const done = list.filter(p => app.solved.has(p.id)).length;
        h += `<div class="modhead"><span class="t">${mi + 1}. ${m.name}</span><span class="line"></span><span class="c">${done}/${list.length}</span></div>`;
        list.forEach(p => {
          const i = PROBLEMS.indexOf(p), ok = app.solved.has(p.id);
          h += `<div class="pitem ${ok ? 'solved' : ''} ${i === app.cur ? 'current' : ''}" onclick="go(${i})">
              <div class="pi-icon ${ok ? 'yes' : 'no'}">${ok ? '&#10003;' : i + 1}</div>
              <div class="pi-info"><div class="pi-title">${p.title}</div><div class="pi-sub">${askOf(p).replace(/<[^>]+>/g, '')}</div></div>
              <span class="badge badge-${p.diff}">${p.diff}</span>
            </div>`;
        });
      });

      h += `<div class="navrow"><button class="btn btn-sm" onclick="resetAll()">Reset progress</button></div></div>`;
      return h;
    }


    function viewRef() {
      return `<div class="card">
        <h2>Vectors</h2>
        ${refTable([
        ['a + b', 'componentwise; geometrically head-to-tail'],
        ['ka', 'scales length; a negative k reverses direction'],
        ['|a|', '√(x² + y² + z²) — prefer |a|² when you only need to compare'],
        ['â = a/|a|', 'unit vector, pure direction — guard against |a| = 0 or you get NaN'],
        ['distance', '|q − p| — the magnitude of the difference'],
        ['Manhattan', '|Δx| + |Δy| — the right metric when movement is axis-aligned'],
        ['perpendicular in 2-D', '(x, y) → (−y, x) — a free 90° rotation, no trigonometry']
      ])}
        <h2 style="margin-top:18px">Dot product — a scalar</h2>
        ${refTable([
        ['a·b', 'Σ aᵢbᵢ — one multiply-accumulate per dimension'],
        ['a·b = |a||b| cos θ', 'the geometric meaning'],
        ['sign of a·b', '+ under 90°, − over 90°, 0 exactly perpendicular'],
        ['angle', 'θ = acos( a·b / (|a||b|) ) — clamp the cosine to [−1,1] first'],
        ['scalar projection', '(a·b)/|b| — how much of a lies along b'],
        ['cosine similarity', 'a·b / (|a||b|) — ignores magnitude entirely'],
        ['cross-track error', 'perp = √(|p|² − proj²) — distance from a line'],
        ['uses', 'lighting, back-face culling, least squares, correlation, similarity search']
      ])}
        <h2 style="margin-top:18px">Cross product — a vector, 3-D only</h2>
        ${refTable([
        ['a × b', '(a_y b_z − a_z b_y, a_z b_x − a_x b_z, a_x b_y − a_y b_x)'],
        ['|a × b|', '|a||b| sin θ — the area of the parallelogram they span'],
        ['direction', 'perpendicular to both; right-hand rule sets the sign'],
        ['a × b = −(b × a)', 'anticommutes — swapping the operands flips the normal'],
        ['2-D "cross"', 'aₓb_y − a_ybₓ — a signed area; the sign gives the turn direction'],
        ['uses', 'surface normals, torque, winding order, convex hulls, point-in-triangle']
      ])}
        <h2 style="margin-top:18px">Matrices</h2>
        ${refTable([
        ['Mv', 'each output component is a row of M dotted with v'],
        ['columns of M', 'where the basis vectors land — read the geometry straight off'],
        ['det [[a,b],[c,d]]', 'ad − bc; the area scale factor, negative if orientation flips'],
        ['det = 0', 'singular — the plane collapses to a line and there is no inverse'],
        ['2×2 inverse', '(1/det)·[[d, −b], [−c, a]]; verify with M·M⁻¹ = I'],
        ['bigger than 2×2', 'do not invert — solve the system with LU or QR instead'],
        ['AB', 'apply B first, then A; reads right to left, and does not commute'],
        ['cost of n×n multiply', 'n³ multiply-accumulates — doubling n costs 8×'],
        ['Mᵀ for a rotation', 'equals M⁻¹ — transposing is free, so never invert a rotation']
      ])}
        <h2 style="margin-top:18px">Transforms and practice</h2>
        ${refTable([
        ['R(θ)', '[[cos θ, −sin θ], [sin θ, cos θ]] — preserves lengths and angles'],
        ['rotate about a point c', 'T(+c) · R(θ) · T(−c) — rightmost applied first'],
        ['scale', 'det = sxsy; non-uniform scaling distorts normals'],
        ['homogeneous coords', 'append 1 to a point, 0 to a direction; lets translation be a matrix'],
        ['scale vs rotate order', 'R·S scales in the object frame; S·R shears — a distinctive bug'],
        ['tilt from accelerometer', 'atan2(aₓ, a_z); check the magnitude is ≈ 1 g or the reading is invalid'],
        ['dead reckoning', 'add leg vectors; heading error grows the position error with distance'],
        ['row-major (C)', 'iterate rows outer, columns inner — a column walk wastes 15/16 of every cache line'],
        ['two-point calibration', 'a 2×2 solve; spread the points wide or the gain estimate amplifies noise'],
        ['Q15 unit vector', 'components fit in ±32767 by construction; multiply before dividing']
      ])}
      </div>`;
    }

    function refTable(rows) {
      return `<table class="reft">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    }

    /* ---------- actions ---------- */
    function setTab(t) {app.tab = t; view();}
    function go(i) {app.cur = i; app.tab = 'learn'; view();}
    function nav(d) {app.cur = Math.max(0, Math.min(PROBLEMS.length - 1, app.cur + d)); view();}
    function tog(k, id) {app[k][id] = !app[k][id]; view();}

    function mark(p, ok) {
      app.tried[p.id] = (app.tried[p.id] || 0) + 1;
      if (ok) {app.feedback[p.id] = 'correct'; app.solved.add(p.id); save();}
      else app.feedback[p.id] = 'wrong';
      view();
    }

    function submit() {
      const p = PROBLEMS[app.cur];
      const given = app.inputs[p.id] || '';
      if (!given.trim()) return;
      mark(p, checkAnswer(p, given));
    }

    function chooseMC(i) {
      const p = PROBLEMS[app.cur];
      if (isShown(p)) return;
      app.pick[p.id] = i;
      mark(p, i === p.s.ai);
    }

    function regen() {
      const p = PROBLEMS[app.cur];
      p.s = p.setup();
      app.feedback[p.id] = null;
      app.reveal[p.id] = false;
      app.inputs[p.id] = '';
      app.pick[p.id] = null;
      view();
    }

    function resetAll() {
      if (!confirm('Clear all solved problems?')) return;
      app.solved.clear();
      app.feedback = {}; app.inputs = {}; app.pick = {}; app.reveal = {}; app.hint = {}; app.tried = {};
      save();
      view();
    }

    load();
    view();
  </script>
</body>

</html>
