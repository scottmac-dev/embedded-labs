        ask: s => `An ADC reading is noisy. You average ${s.M} consecutive samples of a static signal. By how many dB does the noise drop, assuming the noise is white and uncorrelated?`,
        hint: 'Averaging M uncorrelated samples reduces noise power by M, so amplitude drops by √M. In dB: 10·log₁₀(M).',
        concept: 'Oversampling and averaging is the cheapest resolution you can buy: 10·log₁₀(M) dB, which is half a bit for every doubling — average 4 samples to gain one bit, 256 to gain four. It only works if the noise really is uncorrelated; a coherent interferer such as mains hum averages down not at all unless the window covers whole cycles of it.',
        setup() {
          const M = pick([4, 8, 16, 64, 100, 256]);
          return num(10 * Math.log10(M), 0.1, {M});
        },
        render(s, shown) {
          return eq('noise power ÷ M   →   amplitude ÷ √M',
            'improvement = 10·log₁₀(M) dB = 20·log₁₀(√M) dB',
            shown ? `= 10·log₁₀(${s.M}) = ${fmtN(10 * Math.log10(s.M), 3)} dB  (≈ ${fmtN(10 * Math.log10(s.M) / 6.02, 2)} extra bits)` : '= ?')
            + tbl(['samples averaged', 'dB gained', 'bits gained'], [4, 16, 64, 256, 1024].map(m =>
              [String(m), fmtN(10 * Math.log10(m), 1), fmtN(10 * Math.log10(m) / 6.02, 2)]), 'the exchange rate')
            + (shown ? note(`<b>${fmtN(10 * Math.log10(s.M), 2)} dB</b>. The cost is bandwidth: averaging ${s.M} samples is a ${s.M}-point moving average, so the measurement rate falls by the same factor.`) : '');
        }
      },
      {
        id: 'a7', mod: 'applied', diff: 'hard', fmt: 'num', title: 'One pixel of a 2-D convolution',
        ask: 'Apply the sharpen kernel to the highlighted pixel. What is the output value? (No clamping — give the raw result.)',
        hint: 'Multiply each of the nine neighbours by the kernel entry above it and add. The centre coefficient is 5, the four edge neighbours are −1, the corners are 0.',
        concept: 'Two-dimensional convolution is the same multiply-accumulate, run over a neighbourhood. Sharpen = original + Laplacian: the 5 in the centre is 1 (keep the original) plus 4 (the high-pass gain), which is why it amplifies noise as enthusiastically as it does edges.',
        setup() {
          const px = Array.from({length: 3}, () => Array.from({length: 3}, () => rnd(20, 220)));
          const k = [[0, -1, 0], [-1, 5, -1], [0, -1, 0]];
          let acc = 0;
          for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) acc += k[i][j] * px[i][j];
          return num(acc, 0.5, {px, k});
        },
        render(s, shown) {
          const mk = (v, i, j) => [String(v), i === 1 && j === 1 ? 'mk2' : ''];
          return tbl(['', 'col 0', 'col 1', 'col 2'],
            s.px.map((row, i) => [[`row ${i}`, 'lb']].concat(row.map((v, j) => mk(v, i, j)))), 'pixel neighbourhood')
            + tbl(['', 'col 0', 'col 1', 'col 2'],
              s.k.map((row, i) => [[`row ${i}`, 'lb']].concat(row.map(v => [String(v), v !== 0 ? 'mk' : 'dim']))), 'sharpen kernel')
            + (shown
              ? eq(`5×${s.px[1][1]} − ${s.px[0][1]} − ${s.px[1][0]} − ${s.px[1][2]} − ${s.px[2][1]}`,
                `= ${fmtN(s.val, 0)}`)
              + note(`<b>${fmtN(s.val, 0)}</b>. Real code would clamp this to 0–255; note how easily a sharpen kernel pushes a bright pixel out of range.`)
              : note('The corner coefficients are zero, so four of the nine neighbours contribute nothing.'));
        }
      },
      {
        id: 'a8', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Loop phase margin',
        ask: s => `A control loop has open-loop gain <code>L(s) = ${s.K}/(s·(1 + s·${s.tau}))</code> with τ in seconds. Its gain crosses 0 dB near ω = ${fmtN(s.wc, 3)} rad/s. What is the phase margin, in degrees?`,
        hint: 'Phase margin = 180° + ∠L at crossover. The integrator contributes −90°, and the pole contributes −arctan(ωτ).',
        concept: 'Phase margin is the headroom before the loop oscillates, and 45–60° is the usual target. The integrator spends 90° of the 180° budget before you start, which is why the pole placement and any added filtering matter so much — every extra pole inside the loop bandwidth eats directly into what remains.',
        setup() {
          const K = pick([10, 20, 50, 100]), tau = pick([0.001, 0.005, 0.01]);
          /* crossover of K/(w·sqrt(1+(wτ)²)) = 1, solved numerically */
          let w = K;
          for (let i = 0; i < 200; i++) {
            const m = K / (w * Math.hypot(1, w * tau));
            w *= Math.pow(m, 0.3);
          }
          const pm = 180 - 90 - degOf(Math.atan(w * tau));
          return num(pm, 1.0, {K, tau, wc: w, pm});
        },
        render(s, shown) {
          const L = w => cDiv(C(s.K, 0), cMul(C(0, w), C(1, w * s.tau)));
          return eq('∠L(ω) = −90° − arctan(ωτ)',
            `at ω_c = ${fmtN(s.wc, 3)} rad/s:  arctan(${fmtN(s.wc * s.tau, 4)}) = ${fmtN(degOf(Math.atan(s.wc * s.tau)), 2)}°`,
            shown ? `PM = 180° − 90° − ${fmtN(degOf(Math.atan(s.wc * s.tau)), 2)}° = ${fmtN(s.pm, 3)}°` : 'PM = ?')
            + bodePlot(L, {w: [s.wc / 100, s.wc * 100], ymin: -60, ymax: 60, phase: true,
              label: 'open-loop gain', pmin: -190, pmax: -80, pticks: [-180, -150, -120, -90],
              hlines: [{y: 0, label: '0 dB', color: 'var(--tx-3)'}],
              vlines: [{x: Math.log10(s.wc), label: 'ω_c'}],
              pvlines: [{x: Math.log10(s.wc), label: 'ω_c'}]})
            + (shown ? note(`<b>${fmtN(s.pm, 2)}°</b> — ${s.pm > 60 ? 'comfortable, possibly sluggish' : s.pm > 45 ? 'a healthy target' : 'thin; expect overshoot and ringing'}. Adding a sensor filter inside this loop would subtract directly from it.`) : '');
        }
      },
      {
        id: 'a9', mod: 'applied', diff: 'hard', fmt: 'num', title: 'Symbol rate and bandwidth',
        ask: s => `A digital link sends ${s.Rs} kilosymbols per second using a raised-cosine pulse with roll-off β = ${s.beta}. How much bandwidth does it need, in kHz?`,
        hint: 'BW = (1 + β)·Rs/2 for the baseband signal. β = 0 would be the ideal brick-wall minimum.',
        concept: 'The Nyquist bandwidth Rs/2 is the floor; roll-off buys a realisable pulse shape at the cost of extra spectrum. β = 0.35 is the classic compromise — 35 % more bandwidth for a filter that can actually be built and a pulse that decays fast enough to tolerate timing jitter.',
        setup() {
          const Rs = pick([10, 100, 250, 1000]), beta = pick([0, 0.2, 0.25, 0.35, 0.5]);
          return num((1 + beta) * Rs / 2, 0.05, {Rs, beta});
        },
        render(s, shown) {
          const B = (1 + s.beta) * s.Rs / 2, N = s.Rs / 2;
          const rc = f => {
            const a = s.beta, T = 1 / s.Rs;
            const f1 = (1 - a) / (2 * T), f2 = (1 + a) / (2 * T);
            const af = Math.abs(f);
            if (af <= f1) return 1;
            if (af >= f2) return 0;
            return 0.5 * (1 + Math.cos(PI * T / a * (af - f1)));
          };
          return eq('BW = (1 + β)·Rs/2',
            `Nyquist minimum = Rs/2 = ${fmtN(N, 3)} kHz`,
            shown ? `BW = (1 + ${s.beta}) × ${fmtN(N, 3)} = ${fmtN(B, 4)} kHz` : 'BW = ?')
            + plotCT([{f: rc, color: 'var(--accent)', fill: true}],
              {x: [0, s.Rs], y: [0, 1.2], xlabel: 'f (kHz)', label: 'raised-cosine spectrum',
                vlines: [{x: N, label: 'Rs/2', color: 'var(--tx-3)'}].concat(shown ? [{x: B, label: fmtN(B, 1) + ' kHz', color: 'var(--on)'}] : [])})
            + (shown ? note(`<b>${fmtN(B, 4)} kHz</b>. ${s.beta === 0 ? 'β = 0 is the theoretical ideal — an unrealisable brick wall with a pulse that decays only as 1/t.' : `The ${fmtN(s.beta * 100, 0)} % excess buys a filter that can be built and a pulse tolerant of sampling-instant error.`}`) : '');
        }
      },
      {
        id: 'a10', mod: 'applied', diff: 'expert', fmt: 'mc', title: 'Filtering inside a control loop',
        ask: 'A motor loop runs at 1 kHz. Encoder noise is troubling the derivative term, so a 64-tap linear-phase FIR is added to the feedback path. The loop then oscillates. Why?',
        hint: 'Work out the group delay of that filter in milliseconds, then ask what it does to phase at the loop crossover.',
        concept: 'A 64-tap FIR at 1 kHz has 31.5 samples of group delay — 31.5 ms. At a 10 Hz crossover that is over 100° of extra phase lag, far more than any loop\'s margin. Filters in a feedback path must be short: a one-pole IIR or a 4-point average, sized against the phase budget, not against how clean the signal looks.',
        setup() {
          return mc('Its group delay of 31.5 samples is 31.5 ms of pure lag, which at the loop crossover consumes far more phase margin than the loop had',
            ['FIR filters cannot be used in feedback paths because they are not causal',
              'The filter is unstable at 1 kHz sample rates',
              'Linear phase inverts the sign of the derivative term']);
        },
        render(s, shown) {
          return chainDiag([{t: 'sum', label: '−'}, {t: 'box', label: 'PID'}, {t: 'box', label: 'motor'}, {t: 'node', label: 'θ'}],
            {fb: {from: 3, to: 0, label: '64-tap FIR'}, label: 'the delay is inside the loop'})
            + eq('group delay = (N − 1)/2 = 31.5 samples',
              '            = 31.5 ms at 1 kHz',
              'extra phase lag at ω_c = −ω_c × 31.5 ms',
              '#at a 10 Hz crossover that is −113°  — more than the whole margin')
            + (shown ? note('The fix is a shorter filter, a higher sample rate, or filtering the derivative term alone with a single pole. Noise reduction in a loop is always bought with phase.') : '');
        }
      }
    ];

    const PROBLEMS = [...P_A, ...P_B, ...P_C, ...P_D]
      .sort((a, b) => MOD_INDEX[a.mod] - MOD_INDEX[b.mod]);
    const BY_ID = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
    PROBLEMS.forEach(p => {p.s = p.setup();});
    /* ============================================================
       PART 4 — answer checking
       Accept any reasonable spelling of the same value.
       ============================================================ */
    function norm(v) {return String(v).trim().toLowerCase().replace(/[\s_,]/g, '').replace(/[−–—]/g, '-');}

    function boolOf(s) {
      if (['yes', 'y', 'true', 't'].includes(s)) return true;
      if (['no', 'n', 'false', 'f'].includes(s)) return false;
      return null;
    }

    function numOf(s) {
      if (/^-?\d*\.?\d+(e[-+]?\d+)?$/.test(s)) return parseFloat(s);
      if (/^-?\d+\/\d+$/.test(s)) {const [a, b] = s.split('/').map(Number); return a / b;}
      return null;
    }

    function accepts(expected, given) {
      const e = norm(expected), g = norm(given);
      if (!g) return false;
      if (e === g) return true;
      const eb = boolOf(e);
      if (eb !== null) return boolOf(g) === eb;
      const en = numOf(e), gn = numOf(g);
      return en !== null && gn !== null && Math.abs(en - gn) < 1e-9;
    }

    /* numeric problems carry s.val and s.tol */
    function checkAnswer(p, given) {
      const s = p.s;
      if (s.tol !== undefined && s.val !== undefined) {
        const g = numOf(norm(given));
        return g !== null && Math.abs(g - s.val) <= s.tol;
      }
      return [s.answer, ...(s.alts || [])].some(c => accepts(c, given));
    }

    const FMT_HELP = {
      num: 'a number — a couple of decimals is plenty',
      dec: 'a whole number',
      yesno: 'yes or no',
      mc: 'pick one'
    };

    /* ============================================================
       PART 5 — application state
       ============================================================ */
    const STORE_KEY = 'sigslab.progress.v1';

    const app = {
      tab: 'learn', cur: 0,
      solved: new Set(),
      tried: {}, feedback: {}, inputs: {}, pick: {}, hint: {}, reveal: {}, why: {},
      focusId: null, afterRender: null,
      lab: {
        tool: 'builder',
        comps: [{a: 1, f: 3, ph: 0}, {a: 0.5, f: 7, ph: 0}, {a: 0, f: 15, ph: 0}],
        noise: 0,
        conv: {x: 'box', h: 'exp', n: 3},
        pz: {zeros: [], poles: [{re: 0.75, im: 0.35}, {re: 0.75, im: -0.35}], mode: 'pole'},
        alias: {f: 30, fs: 40}
      }
    };

    function save() {try {localStorage.setItem(STORE_KEY, JSON.stringify([...app.solved]));} catch (e) { }}
    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) JSON.parse(raw).forEach(id => {if (BY_ID[id]) app.solved.add(id);});
      } catch (e) { }
    }

    const isShown = p => app.feedback[p.id] === 'correct' || app.reveal[p.id];
    const askOf = p => typeof p.ask === 'function' ? p.ask(p.s) : p.ask;

    /* ============================================================
       PART 6 — views
       ============================================================ */
    function view() {
      const solved = app.solved.size, total = PROBLEMS.length;
      let h = `<div class="masthead">
          <h1>Signal Lab</h1>
          <span class="sub">signals &amp; systems for software and electrical engineers &mdash; ${total} problems across ${MODULES.length} modules</span>
        </div>
        <div class="tab-bar">
          ${[['learn', 'Learn'], ['problems', `Problems (${solved}/${total})`], ['lab', 'Signal lab'], ['ref', 'Reference']]
          .map(([k, t]) => `<button class="tab ${app.tab === k ? 'active' : ''}" onclick="setTab('${k}')">${t}</button>`).join('')}
        </div>`;

      app.afterRender = null;
      if (app.tab === 'learn') h += viewLearn();
      else if (app.tab === 'problems') h += viewList();
      else if (app.tab === 'lab') h += viewLab();
      else h += viewRef();

      document.getElementById('app').innerHTML = h;

      if (app.tab === 'learn') {
        const el = document.getElementById('ans');
        if (el) el.focus();
      }
      if (app.focusId) {
        const el = document.getElementById(app.focusId);
        if (el) {el.focus(); if (el.setSelectionRange) {const n = el.value.length; el.setSelectionRange(n, n);} }
        app.focusId = null;
      }
      if (app.afterRender) app.afterRender();
    }

    function viewLearn() {
      const p = PROBLEMS[app.cur], s = p.s, shown = isShown(p);
      const mod = MODULES[MOD_INDEX[p.mod]];
      const firstOfMod = PROBLEMS.findIndex(x => x.mod === p.mod) === app.cur;
      const inMod = PROBLEMS.filter(x => x.mod === p.mod);

      let h = '';
      if (firstOfMod) {
        h += `<div class="modcard">
            <div class="t">Module ${MOD_INDEX[p.mod] + 1} of ${MODULES.length}</div>
            <h2>${mod.name}</h2>
            <p>${mod.blurb}</p>
          </div>`;
      }

      h += `<div class="card">
          <div class="problem-header">
            <div>
              <div class="crumb">${mod.name} &middot; ${inMod.indexOf(p) + 1} of ${inMod.length}</div>
              <h3>${p.title}</h3>
            </div>
            <span class="badge badge-${p.diff}">${p.diff}</span>
          </div>
          <p class="ask">${askOf(p)}</p>
          ${p.render(s, shown)}`;

      if (p.fmt === 'mc') {
        const picked = app.pick[p.id];
        h += `<div class="choices">` + s.choices.map((c, i) => {
          let cls = '';
          if (shown && i === s.ai) cls = 'right';
          else if (picked === i && app.feedback[p.id] === 'wrong') cls = 'picked';
          return `<button class="choice ${cls}" ${shown ? 'disabled' : ''} onclick="chooseMC(${i})">
              <span class="key">${'ABCD'[i]}</span><span>${c}</span></button>`;
        }).join('') + `</div>`;
      }

      if (!shown) {
        h += `<div class="answer-row">`;
        if (p.fmt !== 'mc') {
          h += `<input type="text" id="ans" placeholder="${FMT_HELP[p.fmt]}" value="${esc(app.inputs[p.id] || '')}"
                   oninput="app.inputs['${p.id}']=this.value"
                   onkeydown="if(event.key==='Enter')submit()">
            <button class="btn btn-primary" onclick="submit()">Check</button>`;
        }
        h += `<button class="linkbtn" onclick="tog('hint','${p.id}')">${app.hint[p.id] ? 'hide hint' : 'hint'}</button>
            <button class="linkbtn" onclick="tog('reveal','${p.id}')">show me</button>
          </div>`;
        if (app.hint[p.id]) h += `<div class="feedback hint">${p.hint}</div>`;
        if (app.feedback[p.id] === 'wrong') {
          const n = app.tried[p.id] || 0;
          h += `<div class="feedback wrong">Not quite &mdash; ${n >= 3 ? 'try the hint, or use <b>show me</b> to walk through it.' : 'have another go.'}</div>`;
        }
      } else {
        const correct = app.feedback[p.id] === 'correct';
        h += `<div class="feedback ${correct ? 'correct' : 'hint'}">
            ${correct ? '&#10003; Correct' : 'Answer'}: <span class="mono"><b>${esc(s.answer)}</b></span>
            ${s.tol !== undefined ? `<span style="opacity:.7"> (anything within ±${fmtN(s.tol, 4)} accepted)</span>` : ''}
            &nbsp;<button class="linkbtn" style="color:inherit" onclick="tog('why','${p.id}')">${app.why[p.id] ? 'hide' : 'why this matters'}</button>
            ${app.why[p.id] ? `<div style="margin-top:8px;color:var(--tx-2)">${p.concept}</div>` : ''}
          </div>`;
      }

      h += `<div class="navrow">
          <button class="btn btn-sm" onclick="nav(-1)" ${app.cur === 0 ? 'disabled style="opacity:.4"' : ''}>&larr; Prev</button>
          <button class="btn btn-sm" onclick="nav(1)" ${app.cur === PROBLEMS.length - 1 ? 'disabled style="opacity:.4"' : ''}>Next &rarr;</button>
          <button class="btn btn-sm" onclick="regen()">${p.fmt === 'mc' ? 'Reshuffle' : 'New numbers'}</button>
          <span class="spacer"></span>
          <span style="font-size:12px;color:var(--tx-3)">${app.cur + 1} / ${PROBLEMS.length}</span>
        </div></div>`;
      return h;
    }

    function viewList() {
      const solved = app.solved.size, total = PROBLEMS.length;
      const byDiff = d => PROBLEMS.filter(p => p.diff === d && app.solved.has(p.id)).length;
      let h = `<div class="stat-grid">
          <div class="stat"><div class="stat-val">${solved}</div><div class="stat-lbl">solved</div></div>
          <div class="stat"><div class="stat-val">${total - solved}</div><div class="stat-lbl">remaining</div></div>
          <div class="stat"><div class="stat-val">${Math.round(solved / total * 100)}%</div><div class="stat-lbl">complete</div></div>
          <div class="stat"><div class="stat-val">${byDiff('hard') + byDiff('expert')}</div><div class="stat-lbl">hard+ solved</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${solved / total * 100}%"></div></div>
        <div class="card">`;

      MODULES.forEach((m, mi) => {
        const list = PROBLEMS.filter(p => p.mod === m.id);
        const done = list.filter(p => app.solved.has(p.id)).length;
        h += `<div class="modhead"><span class="t">${mi + 1}. ${m.name}</span><span class="line"></span><span class="c">${done}/${list.length}</span></div>`;
        list.forEach(p => {
          const i = PROBLEMS.indexOf(p), ok = app.solved.has(p.id);
          h += `<div class="pitem ${ok ? 'solved' : ''} ${i === app.cur ? 'current' : ''}" onclick="go(${i})">
              <div class="pi-icon ${ok ? 'yes' : 'no'}">${ok ? '&#10003;' : i + 1}</div>
              <div class="pi-info"><div class="pi-title">${p.title}</div><div class="pi-sub">${askOf(p).replace(/<[^>]+>/g, '')}</div></div>
              <span class="badge badge-${p.diff}">${p.diff}</span>
            </div>`;
        });
      });

      h += `<div class="navrow"><button class="btn btn-sm" onclick="resetAll()">Reset progress</button></div></div>`;
      return h;
    }

    /* ============================================================
       PART 7 — the Signal lab
       Nothing here is graded; it is for building intuition.
       ============================================================ */
    const COL = {
      bg: '#1a2434', panel: '#111827', grid: '#2b3648', axis: '#4b5563', tx: '#9ca3af', dim: '#6b7280',
      acc: '#60a5fa', on: '#4ade80', hl: '#fbbf24', off: '#f87171', unk: '#c084fc'
    };

    function canvasCtx(id, h) {
      const c = document.getElementById(id);
      if (!c) return null;
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(280, c.clientWidth || 600);
      c.style.height = h + 'px';
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      const g = c.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      return {g, w, h, el: c};
    }

    /* axes + gridlines on a canvas; returns coordinate mappers */
    function cframe(g, w, h, xr, yr, o = {}) {
      const L = o.L === undefined ? 40 : o.L, R = 10, T = 12, B = 24;
      g.clearRect(0, 0, w, h);
      g.fillStyle = COL.bg; g.fillRect(0, 0, w, h);
      const X = v => L + (v - xr[0]) / (xr[1] - xr[0]) * (w - L - R);
      const Y = v => T + (yr[1] - v) / (yr[1] - yr[0]) * (h - T - B);
      g.font = '10px ui-monospace, Menlo, Consolas, monospace';
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      (o.xticks || ticks(xr[0], xr[1], 6)).forEach(v => {
        const x = X(v);
        if (x < L - 1 || x > w - R + 1) return;
        g.strokeStyle = COL.grid; g.lineWidth = 1;
        g.beginPath(); g.moveTo(x, T); g.lineTo(x, h - B); g.stroke();
        g.fillStyle = COL.dim; g.fillText((o.xfmt || (u2 => fmtN(u2, 2)))(v), x, h - B + 13);
      });
      g.textAlign = 'right';
      (o.yticks || ticks(yr[0], yr[1], 4)).forEach(v => {
        const y = Y(v);
        if (y < T - 1 || y > h - B + 1) return;
        g.strokeStyle = COL.grid; g.lineWidth = 1;
        g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
        g.fillStyle = COL.dim; g.fillText((o.yfmt || (u2 => fmtN(u2, 2)))(v), L - 5, y + 3.5);
      });
      g.strokeStyle = COL.axis; g.lineWidth = 1.4;
      if (yr[0] <= 0 && yr[1] >= 0) {g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(w - R, Y(0)); g.stroke();}
      if (xr[0] <= 0 && xr[1] >= 0) {g.beginPath(); g.moveTo(X(0), T); g.lineTo(X(0), h - B); g.stroke();}
      g.strokeStyle = COL.grid; g.lineWidth = 1;
      g.strokeRect(L, T, w - L - R, h - T - B);
      if (o.label) {
        g.fillStyle = COL.tx; g.textAlign = 'left';
        g.fillText(o.label, L + 4, T + 12);
      }
      if (o.xlabel) {g.fillStyle = COL.dim; g.textAlign = 'right'; g.fillText(o.xlabel, w - R, h - 4);}
      return {X, Y, L, R, T, B};
    }

    function cline(g, fr, pts, col, width = 2, dash) {
      g.save();
      g.strokeStyle = col; g.lineWidth = width;
      if (dash) g.setLineDash(dash);
      g.beginPath();
      pts.forEach(([x, y], i) => {const px = fr.X(x), py = fr.Y(y); i ? g.lineTo(px, py) : g.moveTo(px, py);});
      g.stroke();
      g.restore();
    }

    function cstem(g, fr, seq, n0, col, r = 3, skipZero) {
      g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.8;
      const y0 = fr.Y(0);
      seq.forEach((v, i) => {
        if (skipZero && Math.abs(v) < skipZero) return;
        const x = fr.X(n0 + i);
        g.beginPath(); g.moveTo(x, y0); g.lineTo(x, fr.Y(v)); g.stroke();
        g.beginPath(); g.arc(x, fr.Y(v), r, 0, TAU); g.fill();
      });
    }

    /* ---------- lab: shared chrome ---------- */
    const LAB_TOOLS = [['builder', 'Signal builder'], ['conv', 'Convolution stepper'],
    ['pz', 'Pole–zero explorer'], ['alias', 'Sampling & aliasing']];

    function viewLab() {
      const L = app.lab;
      let h = `<div class="labbar">${LAB_TOOLS.map(([k, t]) =>
        `<button class="btn btn-sm ${L.tool === k ? 'on' : ''}" onclick="labTool('${k}')">${t}</button>`).join('')}</div>`;
      h += `<div class="card">`;
      if (L.tool === 'builder') h += labBuilder();
      else if (L.tool === 'conv') h += labConv();
      else if (L.tool === 'pz') h += labPZ();
      else h += labAlias();
      h += `</div>`;
      return h;
    }

    function slider(label, val, min, max, step, fn, fmt) {
      return `<div class="labfield"><label>${label}<span class="v">${fmt ? fmt(val) : val}</span></label>
        <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="${fn}(this.value)"></div>`;
    }

    /* ---------- tool 1: signal builder ---------- */
    function labBuilder() {
      const L = app.lab;
      app.afterRender = drawBuilder;
      /* three components, three parameters each */
      const ctrls = L.comps.map((c, i) => `<div class="labgrid">
          ${slider(`component ${i + 1} — amplitude`, c.a, 0, 1, 0.05, `labComp${i}a`, v => fmtN(+v, 2))}
          ${slider('frequency (Hz)', c.f, 1, 40, 1, `labComp${i}f`, v => v + ' Hz')}
          ${slider('phase (°)', c.ph, -180, 180, 15, `labComp${i}p`, v => v + '°')}
        </div>`).join('');

      return `<h3>Signal builder</h3>
        <p class="note">Add up to three sinusoids, add noise, and watch the waveform and its DFT magnitude at the same time. The window is 256 samples at 256 Hz, so bin k sits at exactly k Hz.</p>
        ${ctrls}
        <div class="labgrid">${slider('noise', L.noise, 0, 0.5, 0.02, 'labNoise', v => fmtN(+v, 2))}</div>
        <canvas id="cv-wave"></canvas>
        <canvas id="cv-spec"></canvas>
        <div class="note">Try two close frequencies to see beating; raise the noise until a component disappears into the floor; set one component to 40 Hz and note where its energy lands.</div>`;
    }

    function builderSeq(N) {
      const L = app.lab;
      const x = [];
      for (let n = 0; n < N; n++) {
        let v = 0;
        L.comps.forEach(c => {v += c.a * Math.cos(TAU * c.f * n / 256 + radOf(c.ph));});
        v += L.noise * (Math.random() * 2 - 1);
        x.push(v);
      }
      return x;
    }

    function drawBuilder() {
      const x = builderSeq(256);
      const w1 = canvasCtx('cv-wave', 200);
      if (w1) {
        const peak = Math.max(1, ...x.map(Math.abs)) * 1.15;
        const fr = cframe(w1.g, w1.w, w1.h, [0, 255], [-peak, peak], {label: 'waveform (256 samples = 1 s)', xlabel: 'n'});
        cline(w1.g, fr, x.map((v, n) => [n, v]), COL.acc, 1.6);
      }
      const s1 = canvasCtx('cv-spec', 190);
      if (s1) {
        const X = dft(x).slice(0, 60).map(z => 2 * cAbs(z) / 256);
        const peak = Math.max(0.2, ...X) * 1.2;
        const fr = cframe(s1.g, s1.w, s1.h, [0, 59], [0, peak], {label: 'DFT magnitude', xlabel: 'f (Hz)'});
        cstem(s1.g, fr, X, 0, COL.on, 2.2, peak * 0.004);
      }
    }

    /* ---------- tool 2: convolution stepper ---------- */
    const CONV_PRESETS = {
      impulse: [1], step: [1, 1, 1, 1, 1, 1], box: [1, 1, 1, 1],
      ramp: [1, 2, 3, 4], exp: [1, 0.7, 0.49, 0.34, 0.24, 0.17], diff: [1, -1], alt: [1, -1, 1, -1]
    };

    function labConv() {
      const L = app.lab.conv;
      app.afterRender = drawConv;
      const x = CONV_PRESETS[L.x], h = CONV_PRESETS[L.h];
      const y = conv(x, h);
      const opt = (sel, fn) => Object.keys(CONV_PRESETS).map(k =>
        `<option value="${k}" ${sel === k ? 'selected' : ''}>${k} [${CONV_PRESETS[k].join(', ')}]</option>`).join('');
      return `<h3>Convolution stepper</h3>
        <p class="note">Flip h, slide it to position n, multiply the overlap and add. The running total is y[n] — exactly what an FIR filter computes each sample.</p>
        <div class="labgrid">
          <div class="labfield"><label>x[n]</label><select onchange="labConvSet('x',this.value)">${opt(L.x)}</select></div>
          <div class="labfield"><label>h[n]</label><select onchange="labConvSet('h',this.value)">${opt(L.h)}</select></div>
        </div>
        <div class="oprow">
          <button class="btn btn-sm" onclick="labConvStep(-1)">&larr; n−1</button>
          <span class="chip">n = <b>${L.n}</b></span>
          <button class="btn btn-sm" onclick="labConvStep(1)">n+1 &rarr;</button>
          <span class="chip hot">y[${L.n}] = <b>${L.n >= 0 && L.n < y.length ? fmtN(y[L.n], 3) : '0'}</b></span>
          <span class="chip">output length ${x.length} + ${h.length} − 1 = <b>${y.length}</b></span>
        </div>
        <canvas id="cv-conv"></canvas>
        <canvas id="cv-convy"></canvas>
        ${convStrip(x, h, L.n, {showSum: false, label: 'the overlap at this n'})}`;
    }

    function drawConv() {
      const L = app.lab.conv;
      const x = CONV_PRESETS[L.x], h = CONV_PRESETS[L.h], y = conv(x, h);
      const lo = Math.min(0, L.n - h.length + 1) - 1, hi = Math.max(x.length, L.n + 1) + 1;
      const c1 = canvasCtx('cv-conv', 200);
      if (c1) {
        const vals = x.concat(h);
        const peak = Math.max(1, ...vals.map(Math.abs)) * 1.3;
        const fr = cframe(c1.g, c1.w, c1.h, [lo, hi], [-peak, peak], {label: `x[k] (blue)   and   h[${L.n}−k] (amber)`, xlabel: 'k'});
        cstem(c1.g, fr, x, 0, COL.acc, 3.2);
        /* flipped and shifted h */
        const hs = [], start = L.n - h.length + 1;
        for (let i = h.length - 1; i >= 0; i--) hs.push(h[i]);
        cstem(c1.g, fr, hs, start, COL.hl, 2.6);
        /* shade the overlap */
        c1.g.fillStyle = 'rgba(96,165,250,.10)';
        const a = Math.max(0, start), b = Math.min(x.length - 1, L.n);
        if (b >= a) c1.g.fillRect(fr.X(a - 0.4), fr.T, fr.X(b + 0.4) - fr.X(a - 0.4), c1.h - fr.T - fr.B);
      }
      const c2 = canvasCtx('cv-convy', 180);
      if (c2) {
        const peak = Math.max(1, ...y.map(Math.abs)) * 1.25;
        const fr = cframe(c2.g, c2.w, c2.h, [lo, hi], [-peak, peak], {label: 'y[n] = x ∗ h, filled in up to n', xlabel: 'n'});
        const known = y.slice(0, Math.max(0, Math.min(y.length, L.n + 1)));
        cstem(c2.g, fr, known, 0, COL.on, 3.2);
        if (L.n >= 0 && L.n < y.length) {
          c2.g.strokeStyle = COL.hl; c2.g.lineWidth = 2;
          c2.g.beginPath(); c2.g.arc(fr.X(L.n), fr.Y(y[L.n]), 6, 0, TAU); c2.g.stroke();
        }
      }
    }

    /* ---------- tool 3: pole–zero explorer ---------- */
    /* equal units on both axes, so the unit circle is actually a circle */
    function pzGeom(w, h) {
      const L = 32, R = 10, T = 12, B = 24, lim = 1.7;
      const asp = (w - L - R) / (h - T - B);
      return {L, R, T, B, lim, xr: [-lim * asp, lim * asp], yr: [-lim, lim]};
    }


    function polyFromRoots(roots) {
      let c = [C(1, 0)];
      roots.forEach(rt => {
        const out = new Array(c.length + 1).fill(0).map(() => C(0, 0));
        for (let i = 0; i < c.length; i++) {
          out[i] = cAdd(out[i], c[i]);
          out[i + 1] = cSub(out[i + 1], cMul(c[i], rt));
        }
        c = out;
      });
      return c.map(v => v.re);
    }

    function pzCoeffs() {
      const P = app.lab.pz;
      const poles = P.poles.map(p => C(p.re, p.im));
      const zeros = P.zeros.map(p => C(p.re, p.im));
      /* pad with zeros at the origin so numerator and denominator have equal degree */
      const n = Math.max(poles.length, zeros.length);
      while (zeros.length < n) zeros.push(C(0, 0));
      while (poles.length < n) poles.push(C(0, 0));
      let b = polyFromRoots(zeros), a = polyFromRoots(poles);
      if (!a.length) {a = [1]; b = [1];}
      /* normalise to unity peak gain over 0..π so the plot stays on screen */
      let peak = 0;
      for (let i = 0; i <= 200; i++) peak = Math.max(peak, cAbs(respBA(b, a, PI * i / 200)));
      if (peak > 0 && isFinite(peak)) b = b.map(v => v / peak);
      return {b, a};
    }

    function labPZ() {
      const P = app.lab.pz;
      app.afterRender = drawPZ;
      const maxr = P.poles.reduce((m, p) => Math.max(m, Math.hypot(p.re, p.im)), 0);
      const verdict = P.poles.length === 0 ? ['ok', 'FIR — no poles, always stable']
        : maxr < 0.999 ? ['ok', `stable — largest pole radius ${fmtN(maxr, 3)}`]
          : ['bad', `unstable — largest pole radius ${fmtN(maxr, 3)} ≥ 1`];
      return `<h3>Pole–zero explorer</h3>
        <p class="note">Click inside the z-plane to place a feature. Anything off the real axis is added as a conjugate pair, so the coefficients stay real. The magnitude response and impulse response update as you go.</p>
        <div class="oprow">
          ${[['pole', '× add pole'], ['zero', '○ add zero'], ['erase', 'erase nearest']].map(([k, t]) =>
        `<button class="btn btn-sm ${P.mode === k ? 'on' : ''}" onclick="labPZMode('${k}')">${t}</button>`).join('')}
          <button class="btn btn-sm" onclick="labPZClear()">clear</button>
          <button class="btn btn-sm" onclick="labPZPreset('lp')">1-pole LP</button>
          <button class="btn btn-sm" onclick="labPZPreset('reson')">resonator</button>
          <button class="btn btn-sm" onclick="labPZPreset('notch')">notch</button>
        </div>
        <div class="oprow"><span class="verdict ${verdict[0]}">${verdict[1]}</span>
          <span class="chip">${P.poles.length} pole(s)</span><span class="chip">${P.zeros.length} zero(s)</span></div>
        <canvas id="cv-pz" onclick="labPZClick(event)" style="max-width:420px;margin-left:auto;margin-right:auto"></canvas>
        <canvas id="cv-pzmag"></canvas>
        <canvas id="cv-pzimp"></canvas>`;
    }

    function drawPZ() {
      const P = app.lab.pz;
      const c1 = canvasCtx('cv-pz', 320);
      if (c1) {
        const g = c1.g, G = pzGeom(c1.w, c1.h);
        const fr = cframe(g, c1.w, c1.h, G.xr, G.yr, {label: 'z-plane', L: G.L, xticks: [-1, 0, 1], yticks: [-1, 0, 1]});
        /* unit circle */
        g.save();
        g.strokeStyle = COL.dim; g.lineWidth = 1.4; g.setLineDash([5, 3]);
        g.beginPath();
        for (let i = 0; i <= 90; i++) {
          const th = TAU * i / 90, px = fr.X(Math.cos(th)), py = fr.Y(Math.sin(th));
          i ? g.lineTo(px, py) : g.moveTo(px, py);
        }
        g.stroke(); g.restore();
        g.fillStyle = 'rgba(74,222,128,.06)';
        g.beginPath(); g.ellipse(fr.X(0), fr.Y(0), fr.X(1) - fr.X(0), fr.Y(0) - fr.Y(1), 0, 0, TAU); g.fill();
        P.zeros.forEach(z => {
          g.strokeStyle = COL.acc; g.lineWidth = 2;
          g.beginPath(); g.arc(fr.X(z.re), fr.Y(z.im), 6, 0, TAU); g.stroke();
        });
        P.poles.forEach(p => {
          g.strokeStyle = COL.off; g.lineWidth = 2.2;
          const x = fr.X(p.re), y = fr.Y(p.im), d = 5.5;
          g.beginPath(); g.moveTo(x - d, y - d); g.lineTo(x + d, y + d); g.moveTo(x - d, y + d); g.lineTo(x + d, y - d); g.stroke();
        });
      }
      const {b, a} = pzCoeffs();
      const c2 = canvasCtx('cv-pzmag', 180);
      if (c2) {
        const pts = [];
        for (let i = 0; i <= 240; i++) {const w = PI * i / 240; pts.push([i / 240, cAbs(respBA(b, a, w))]);}
        const peak = Math.max(0.2, ...pts.map(p => p[1])) * 1.2;
        const fr = cframe(c2.g, c2.w, c2.h, [0, 1], [0, peak], {label: 'magnitude response', xlabel: 'ω / π'});
        cline(c2.g, fr, pts, COL.acc, 2);
      }
      const c3 = canvasCtx('cv-pzimp', 180);
      if (c3) {
        const imp = filterSeq(b, a, [1].concat(new Array(47).fill(0)), 48).map(v => clamp(v, -8, 8));
        const peak = Math.max(0.3, ...imp.map(Math.abs)) * 1.25;
        const fr = cframe(c3.g, c3.w, c3.h, [-1, 48], [-peak, peak], {label: 'impulse response (clipped at ±8)', xlabel: 'n'});
        cstem(c3.g, fr, imp, 0, COL.hl, 2.4);
      }
    }

    /* ---------- tool 4: sampling & aliasing ---------- */
    function labAlias() {
      const A = app.lab.alias;
      app.afterRender = drawAlias;
      const alias = Math.abs(A.f - A.fs * Math.round(A.f / A.fs));
      const ok = A.f < A.fs / 2;
      return `<h3>Sampling &amp; aliasing</h3>
        <p class="note">Move the signal frequency past half the sample rate and watch the reconstructed waveform fold back down. The samples are identical for both curves — that is the whole point.</p>
        <div class="labgrid">
          ${slider('signal frequency', A.f, 1, 120, 1, 'labAliasF', v => v + ' Hz')}
          ${slider('sample rate', A.fs, 8, 200, 2, 'labAliasFs', v => v + ' Hz')}
        </div>
        <div class="oprow">
          <span class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'below Nyquist — sampled correctly' : 'above Nyquist — aliased'}</span>
          <span class="chip">f_s/2 = <b>${fmtN(A.fs / 2, 1)} Hz</b></span>
          <span class="chip ${ok ? '' : 'bad'}">apparent frequency = <b>${fmtN(alias, 2)} Hz</b></span>
        </div>
        <canvas id="cv-alias"></canvas>
        <canvas id="cv-aliasspec"></canvas>
        <div class="note">The lower plot shows the spectral replicas that sampling creates at every multiple of f_s. Aliasing is what happens when a replica lands inside the baseband.</div>`;
    }

    function drawAlias() {
      const A = app.lab.alias;
      const alias = Math.abs(A.f - A.fs * Math.round(A.f / A.fs));
      const T = Math.max(3 / Math.max(alias, 1), 4 / A.fs);
      const c1 = canvasCtx('cv-alias', 210);
      if (c1) {
        const fr = cframe(c1.g, c1.w, c1.h, [0, T], [-1.35, 1.35], {label: 'true signal (blue), alias (red), samples (amber)', xlabel: 't (s)'});
        const pts = [], apts = [];
        for (let i = 0; i <= 600; i++) {
          const t = T * i / 600;
          pts.push([t, Math.cos(TAU * A.f * t)]);
          apts.push([t, Math.cos(TAU * alias * t)]);
        }
        cline(c1.g, fr, pts, COL.acc, 1.6);
        if (Math.abs(alias - A.f) > 1e-9) cline(c1.g, fr, apts, COL.off, 2, [6, 4]);
        c1.g.fillStyle = COL.hl;
        for (let n = 0; n * (1 / A.fs) <= T; n++) {
          const t = n / A.fs;
          c1.g.beginPath(); c1.g.arc(fr.X(t), fr.Y(Math.cos(TAU * A.f * t)), 3.6, 0, TAU); c1.g.fill();
        }
      }
      const c2 = canvasCtx('cv-aliasspec', 180);
      if (c2) {
        const fmax = Math.max(A.f * 1.5, A.fs * 2.4);
        const fr = cframe(c2.g, c2.w, c2.h, [0, fmax], [0, 1.3], {label: 'spectrum: original (blue) and its replicas (red)', xlabel: 'f (Hz)'});
        const stem = (f, col, w2) => {
          if (f < 0 || f > fmax) return;
          c2.g.strokeStyle = col; c2.g.lineWidth = w2; c2.g.fillStyle = col;
          c2.g.beginPath(); c2.g.moveTo(fr.X(f), fr.Y(0)); c2.g.lineTo(fr.X(f), fr.Y(1)); c2.g.stroke();
          c2.g.beginPath(); c2.g.arc(fr.X(f), fr.Y(1), 3.4, 0, TAU); c2.g.fill();
        };
        for (let k = 1; k <= 3; k++) {stem(k * A.fs - A.f, COL.off, 2); stem(k * A.fs + A.f, COL.off, 2);}
        stem(A.f, COL.acc, 2.6);
        c2.g.strokeStyle = COL.on; c2.g.lineWidth = 1.5; c2.g.setLineDash([5, 3]);
        c2.g.beginPath(); c2.g.moveTo(fr.X(A.fs / 2), fr.T); c2.g.lineTo(fr.X(A.fs / 2), c2.h - fr.B); c2.g.stroke();
        c2.g.setLineDash([]);
        c2.g.fillStyle = COL.on; c2.g.textAlign = 'left';
        c2.g.fillText('f_s/2', fr.X(A.fs / 2) + 4, fr.T + 24);
      }
    }

    /* ---------- lab actions ---------- */
    function labTool(t) {app.lab.tool = t; view();}
    function labNoise(v) {app.lab.noise = +v; view();}
    function labComp(i, k, v) {app.lab.comps[i][k] = +v; view();}
    function labComp0a(v) {labComp(0, 'a', v);} function labComp0f(v) {labComp(0, 'f', v);} function labComp0p(v) {labComp(0, 'ph', v);}
    function labComp1a(v) {labComp(1, 'a', v);} function labComp1f(v) {labComp(1, 'f', v);} function labComp1p(v) {labComp(1, 'ph', v);}
    function labComp2a(v) {labComp(2, 'a', v);} function labComp2f(v) {labComp(2, 'f', v);} function labComp2p(v) {labComp(2, 'ph', v);}
    function labConvSet(k, v) {app.lab.conv[k] = v; app.lab.conv.n = clamp(app.lab.conv.n, 0, CONV_PRESETS[app.lab.conv.x].length + CONV_PRESETS[app.lab.conv.h].length - 2); view();}
    function labConvStep(d) {
      const c = app.lab.conv, max = CONV_PRESETS[c.x].length + CONV_PRESETS[c.h].length - 2;
      c.n = clamp(c.n + d, -1, max + 1); view();
    }
    function labPZMode(m) {app.lab.pz.mode = m; view();}
    function labPZClear() {app.lab.pz.zeros = []; app.lab.pz.poles = []; view();}
    function labPZPreset(k) {
      const P = app.lab.pz;
      if (k === 'lp') {P.poles = [{re: 0.8, im: 0}]; P.zeros = [{re: -1, im: 0}];}
      else if (k === 'reson') {P.poles = [{re: 0.9 * Math.cos(0.6), im: 0.9 * Math.sin(0.6)}, {re: 0.9 * Math.cos(0.6), im: -0.9 * Math.sin(0.6)}]; P.zeros = [];}
      else {P.poles = [{re: 0.95 * Math.cos(1.0), im: 0.95 * Math.sin(1.0)}, {re: 0.95 * Math.cos(1.0), im: -0.95 * Math.sin(1.0)}];
        P.zeros = [{re: Math.cos(1.0), im: Math.sin(1.0)}, {re: Math.cos(1.0), im: -Math.sin(1.0)}];}
      view();
    }
    function labPZClick(ev) {
      const P = app.lab.pz, el = ev.currentTarget;
      const r = el.getBoundingClientRect();
      const G = pzGeom(r.width, r.height);
      const re = G.xr[0] + (ev.clientX - r.left - G.L) / (r.width - G.L - G.R) * (G.xr[1] - G.xr[0]);
      const im = G.yr[1] - (ev.clientY - r.top - G.T) / (r.height - G.T - G.B) * (G.yr[1] - G.yr[0]);
      if (Math.abs(re) > G.lim * 1.2 || Math.abs(im) > G.lim) return;
      const snap = Math.abs(im) < 0.06 ? 0 : im;
      if (P.mode === 'erase') {
        const all = P.poles.map((p, i) => ({p, i, k: 'poles'})).concat(P.zeros.map((p, i) => ({p, i, k: 'zeros'})));
        if (!all.length) return;
        let best = all[0], bd = 1e9;
        all.forEach(o => {const d = Math.hypot(o.p.re - re, o.p.im - im); if (d < bd) {bd = d; best = o;}});
        const target = P[best.k], v = target[best.i];
        P[best.k] = target.filter(q => !(q.re === v.re && Math.abs(q.im) === Math.abs(v.im)));
      } else {
        const list = P.mode === 'pole' ? P.poles : P.zeros;
        if (list.length >= 8) return;
        list.push({re, im: snap});
        if (snap !== 0) list.push({re, im: -snap});
      }
      view();
    }
    function labAliasF(v) {app.lab.alias.f = +v; view();}
    function labAliasFs(v) {app.lab.alias.fs = +v; view();}

    /* ============================================================
       PART 8 — reference
       ============================================================ */
    function refTable(rows) {
      return `<table class="reft">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    }

    function viewRef() {
      return `<div class="card">
        <h2>Elementary signals</h2>
        ${refTable([
        ['δ(t), δ[n]', 'impulse — unit area (CT) or a single 1 (DT); sifts out one value under an integral or sum'],
        ['u(t), u[n]', 'unit step — 0 before the origin, 1 from it onward; the integral of δ'],
        ['r(t) = t·u(t)', 'ramp — the integral of the step'],
        ['e^{st}, s = σ + jω', 'complex exponential — σ sets growth or decay, ω sets oscillation'],
        ['A·cos(ω₀t + φ)', 'sinusoid — the eigenfunction of every LTI system'],
        ['rect(t/τ)', 'rectangular pulse of width τ; transform is τ·sinc(fτ)'],
        ['sinc(x) = sin(πx)/(πx)', 'the ideal filter\'s impulse response; nulls at every non-zero integer']
      ])}

        <h2 style="margin-top:18px">Signal classification</h2>
        ${refTable([
        ['periodic (CT)', 'x(t + T₀) = x(t); a sum of sinusoids repeats at the gcd of their frequencies'],
        ['periodic (DT)', 'needs ω/2π rational — not every discrete sinusoid is periodic'],
        ['even / odd', 'x(−t) = x(t) / x(−t) = −x(t); every signal splits uniquely into the two'],
        ['energy signal', 'E = ∫|x|² finite, P = 0 — transients and pulses'],
        ['power signal', 'P finite and non-zero, E infinite — carriers, noise, the step'],
        ['average power of A·cos', 'A²/2 into 1 Ω; RMS value A/√2']
      ])}

        <h2 style="margin-top:18px">System properties</h2>
        ${refTable([
        ['linear', 'T{a·x₁ + b·x₂} = a·T{x₁} + b·T{x₂}; zero input must give zero output'],
        ['time-invariant', 'x[n−D] → y[n−D] for every D; no explicit t or n in the rule'],
        ['causal', 'y at time n uses no input later than n'],
        ['BIBO stable', 'bounded in, bounded out; for LTI, Σ|h[n]| < ∞'],
        ['memoryless', 'output depends only on the present input — no state'],
        ['invertible', 'distinct inputs give distinct outputs; otherwise information is destroyed']
      ])}

        <h2 style="margin-top:18px">Convolution</h2>
        ${refTable([
        ['y(t) = ∫x(τ)h(t−τ)dτ', 'continuous-time convolution'],
        ['y[n] = Σ x[k]h[n−k]', 'discrete convolution — the FIR inner loop'],
        ['length', 'Nx + Nh − 1 output samples'],
        ['x ∗ δ = x', 'the impulse is the identity; δ[n−k] is a pure delay'],
        ['commutative / associative', 'x ∗ h = h ∗ x; cascades can be pre-combined into one h'],
        ['distributive', 'x ∗ (h₁ + h₂) = x ∗ h₁ + x ∗ h₂ — parallel paths add'],
        ['rect ∗ rect', 'a triangle of twice the width — convolution always widens']
      ])}

        <h2 style="margin-top:18px">Fourier series &amp; transform</h2>
        ${refTable([
        ['series applies to', 'periodic signals only; the spectrum is a set of lines at n·f₀'],
        ['square wave', '(4A/π)·Σ sin(nω₀t)/n over odd n — odd harmonics, 1/n roll-off'],
        ['PWM average', 'a₀ = V × duty — the basis of a PWM DAC'],
        ['Parseval', 'P = a₀² + Σ Aₙ²/2 — power adds across harmonics'],
        ['Gibbs', '~9 % overshoot at a discontinuity; narrows with more terms but never shrinks'],
        ['δ(t) ⟷ 1', 'an impulse is flat across all frequencies'],
        ['rect(t/τ) ⟷ τ·sinc(fτ)', 'first null at f = 1/τ — the working definition of pulse bandwidth'],
        ['e^{−at}u(t) ⟷ 1/(a + jω)', 'one-pole spectrum; |X| = 1/√(a² + ω²)'],
        ['x(t − t₀) ⟷ X·e^{−jωt₀}', 'delay changes phase only, with slope −t₀'],
        ['x(at) ⟷ (1/|a|)X(jω/a)', 'compress in time, stretch in frequency'],
        ['x·cos(ω_c t)', 'shifts the spectrum to ±f_c — AM, mixing, and double the bandwidth'],
        ['x ∗ h ⟷ X·H', 'convolution becomes multiplication (and the dual causes spectral leakage)']
      ])}

        <h2 style="margin-top:18px">Frequency response</h2>
        ${refTable([
        ['RC low-pass', 'f_c = 1/(2πRC); |H| = 1/√(1+(f/f_c)²); ∠H = −arctan(f/f_c)'],
        ['at f_c', '0.707 of the input (−3 dB) and −45° of phase'],
        ['first-order slope', '−20 dB/decade, i.e. −6 dB/octave; n poles give −20n'],
        ['two identical stages', 'combined −3 dB point falls to 0.6436·f_c'],
        ['group delay', '−d∠H/dω; constant only when the phase is linear'],
        ['linear-phase FIR', 'group delay (N−1)/2 samples — the same for every frequency'],
        ['distortionless', '|H| constant and ∠H linear across the signal band']
      ])}

        <h2 style="margin-top:18px">Laplace &amp; the s-domain</h2>
        ${refTable([
        ['d/dt ⟷ s', 'differential equations become polynomials'],
        ['∫dt ⟷ 1/s', 'an integrator is a pole at the origin'],
        ['1/(s+a)', 'e^{−at}u(t), ROC Re{s} > −a'],
        ['ω/(s²+ω²), s/(s²+ω²)', 'sin(ωt)u(t), cos(ωt)u(t)'],
        ['stability', 'every pole strictly in the left half plane'],
        ['pole at σ ± jω_d', 'envelope e^{σt}, ringing at ω_d/2π Hz'],
        ['second order', 'H = ωₙ²/(s² + 2ζωₙs + ωₙ²)'],
        ['overshoot', 'M_p = exp(−πζ/√(1−ζ²)); ζ=0.5 → 16 %, ζ=0.707 → 4.3 %'],
        ['settling (2 %)', 't_s ≈ 4/(ζωₙ)'],
        ['series RLC', 'ωₙ = 1/√(LC), ζ = (R/2)√(C/L)'],
        ['RHP zero', 'still stable, but non-minimum-phase: initial response goes the wrong way']
      ])}

        <h2 style="margin-top:18px">Sampling</h2>
        ${refTable([
        ['Nyquist', 'f_s > 2·f_max; real systems use 2.2–2.5× to leave filter transition room'],
        ['alias frequency', 'f_alias = |f − k·f_s| with k the nearest integer'],
        ['images', 'k·f_s ± f appear at the DAC output; the lowest is f_s − f'],
        ['anti-alias filter', 'must be analogue and before the ADC — after sampling nothing can separate them'],
        ['quantisation SNR', '6.02·N + 1.76 dB for a full-scale sine'],
        ['averaging M samples', '10·log₁₀(M) dB — half a bit per doubling, if the noise is uncorrelated'],
        ['zero-order hold', 'sinc droop, −3.92 dB at f_s/2; correctable with an inverse-sinc filter'],
        ['bandpass sampling', 'f_s > 2·B suffices if the band folds into one Nyquist zone cleanly']
      ])}

        <h2 style="margin-top:18px">Discrete time &amp; the z-transform</h2>
        ${refTable([
        ['z⁻¹', 'one sample of delay — one stored variable in code'],
        ['aⁿu[n] ⟷ 1/(1−az⁻¹)', 'single pole at z = a, ROC |z| > |a|'],
        ['stability', 'every pole strictly inside the unit circle'],
        ['frequency response', 'H(z) evaluated at z = e^{jω}; ω = 2πf/f_s, and π is always f_s/2'],
        ['DC gain', 'H(1) = Σb / Σa'],
        ['Nyquist gain', 'H(−1) = alternating sum of the coefficients'],
        ['EMA coefficient', 'a = e^{−T/τ}; time constant −1/ln(a) samples'],
        ['z = e^{sT}', 'left half plane → inside the unit circle; jω axis → the circle itself'],
        ['geometric reading', '|H| = Π(distances to zeros) / Π(distances to poles) from e^{jω}']
      ])}

        <h2 style="margin-top:18px">Digital filters</h2>
        ${refTable([
        ['FIR', 'no feedback; always stable, can be exactly linear-phase, needs many taps'],
        ['IIR', 'feedback; few coefficients, never linear-phase, stability depends on coefficients'],
        ['moving average', 'nulls at k·f_s/M — choose M to kill a known interferer'],
        ['Butterworth', '|H| = 1/√(1 + (f/f_c)^{2n}) — maximally flat passband'],
        ['FIR length (Kaiser)', 'N ≈ (A − 8)/(2.285·Δω), Δω = 2π·Δf/f_s'],
        ['windowing', 'rectangular truncation sticks at −21 dB sidelobes; Hamming −53, Blackman −74'],
        ['Q15 coefficients', 'round(a·32768)/32768; quantisation moves poles'],
        ['cascaded biquads', 'the standard high-order structure — far less coefficient sensitivity'],
        ['filters in a loop', 'group delay is phase lag; keep feedback-path filters short']
      ])}

        <h2 style="margin-top:18px">Symbols</h2>
        ${refTable([
        ['f, ω', 'frequency in Hz and in rad/s: ω = 2πf'],
        ['ω (discrete)', 'radians per sample: ω = 2πf/f_s, with π at f_s/2'],
        ['f_s, T', 'sample rate and sample period, T = 1/f_s'],
        ['s = σ + jω', 'Laplace variable — σ is growth/decay, ω is oscillation'],
        ['z = e^{sT}', 'z-transform variable; |z| = 1 is the frequency axis'],
        ['H(jω), H(z)', 'frequency response and transfer function'],
        ['h(t), h[n]', 'impulse response — the complete description of an LTI system'],
        ['τ, ζ, ωₙ', 'time constant, damping ratio, undamped natural frequency']
      ])}
      </div>`;
    }

    /* ============================================================
       PART 9 — actions
       ============================================================ */
    function setTab(t) {app.tab = t; view();}
    function go(i) {app.cur = i; app.tab = 'learn'; view();}
    function nav(d) {app.cur = clamp(app.cur + d, 0, PROBLEMS.length - 1); view();}
    function tog(k, id) {app[k][id] = !app[k][id]; view();}

    function mark(p, ok) {
      app.tried[p.id] = (app.tried[p.id] || 0) + 1;
      if (ok) {app.feedback[p.id] = 'correct'; app.solved.add(p.id); save();}
      else app.feedback[p.id] = 'wrong';
      view();
    }

    function submit() {
      const p = PROBLEMS[app.cur];
      const given = app.inputs[p.id] || '';
      if (!given.trim()) return;
      mark(p, checkAnswer(p, given));
    }

    function chooseMC(i) {
      const p = PROBLEMS[app.cur];
      if (isShown(p)) return;
      app.pick[p.id] = i;
      mark(p, i === p.s.ai);
    }

    function regen() {
      const p = PROBLEMS[app.cur];
      p.s = p.setup();
      app.feedback[p.id] = null;
      app.reveal[p.id] = false;
      app.inputs[p.id] = '';
      app.pick[p.id] = null;
      view();
    }

    function resetAll() {
      if (!confirm('Clear all solved problems?')) return;
      app.solved.clear();
      app.feedback = {}; app.inputs = {}; app.pick = {}; app.reveal = {}; app.hint = {}; app.tried = {};
      save();
      view();
    }

    window.addEventListener('resize', () => {if (app.tab === 'lab' && app.afterRender) app.afterRender();});

    load();
    view();
  </script>
</body>
