<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Lab — signals &amp; systems for software and electrical engineers</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --bg-1: #111827;
      --bg-2: #1a2434;
      --bg-3: #232f42;

      --tx-1: #f3f4f6;
      --tx-2: #9ca3af;
      --tx-3: #6b7280;

      --bd-1: #2b3648;
      --bd-2: #374151;

      --accent: #60a5fa;
      --accent-dim: rgba(96, 165, 250, 0.15);

      --on: #4ade80;
      --off: #f87171;
      --hl: #fbbf24;
      --fill: #38bdf8;
      --unk: #c084fc;

      --r-sm: 5px;
      --r-md: 8px;
      --r-lg: 14px;

      --font-sans: Inter, system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--tx-1);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
    }

    /* ---------- header / tabs ---------- */
    .masthead {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .masthead h1 {
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .masthead .sub {
      font-size: 13px;
      color: var(--tx-3);
    }

    .tab-bar {
      display: flex;
      gap: 2px;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--bd-1);
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 15px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--tx-2);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: inherit;
      transition: color .15s, background .15s;
    }

    .tab.active {
      color: var(--tx-1);
      border-bottom-color: var(--accent);
      font-weight: 550;
    }

    .tab:hover:not(.active) {
      color: var(--tx-1);
      background: rgba(255, 255, 255, .03);
    }

    .card {
      background: var(--bg-1);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-lg);
      padding: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .18);
    }

    .card+.card {
      margin-top: 1rem;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
    }

    h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .mono {
      font-family: var(--font-mono);
    }

    code {
      font-family: var(--font-mono);
      font-size: .92em;
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--tx-1);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--r-md);
      white-space: nowrap;
    }

    .badge-easy {
      background: rgba(34, 197, 94, .15);
      color: #86efac;
    }

    .badge-medium {
      background: rgba(245, 158, 11, .15);
      color: #fcd34d;
    }

    .badge-hard {
      background: rgba(239, 68, 68, .15);
      color: #fca5a5;
    }

    .badge-expert {
      background: rgba(139, 92, 246, .15);
      color: #c4b5fd;
    }

    .section-title {
      font-size: 11px;
      font-weight: 650;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 16px 0 6px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    /* ---------- module intro ---------- */
    .modcard {
      background: linear-gradient(180deg, rgba(96, 165, 250, .10), rgba(96, 165, 250, .02));
      border: 1px solid rgba(96, 165, 250, .28);
      border-radius: var(--r-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    .modcard .t {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--accent);
      font-weight: 650;
    }

    .modcard h2 {
      margin: 2px 0 5px;
    }

    .modcard p {
      font-size: 13.5px;
      color: var(--tx-2);
      max-width: 68ch;
    }

    /* ---------- problem chrome ---------- */
    .problem-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .crumb {
      font-size: 11px;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600;
    }

    .ask {
      color: var(--tx-1);
      margin-bottom: 12px;
      font-size: 14.5px;
    }

    .note {
      font-size: 13px;
      color: var(--tx-2);
      margin: 8px 0 2px;
      max-width: 78ch;
    }

    /* ---------- equations ---------- */
    .eqblk {
      font-family: var(--font-mono);
      font-size: 14px;
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-left: 3px solid var(--accent);
      border-radius: var(--r-md);
      padding: 9px 13px;
      margin: 8px 0;
      overflow-x: auto;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .eqblk .el {
      display: block;
    }

    .eqblk .ec {
      color: var(--tx-3);
    }

    .eqblk b {
      color: var(--hl);
      font-weight: 600;
    }

    .eqblk .q {
      color: var(--unk);
      font-weight: 700;
    }

    /* ---------- code block ---------- */
    .code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      padding: 10px 13px;
      margin: 8px 0;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.6;
    }

    .code .k {
      color: var(--accent);
    }

    .code .c {
      color: var(--tx-3);
    }

    .code .h {
      color: var(--hl);
    }

    /* ---------- plots ---------- */
    .plot {
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      padding: 9px 11px 6px;
      margin: 8px 0;
      overflow-x: auto;
    }

    .plot .plbl {
      font-size: 11px;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 650;
      margin-bottom: 4px;
    }

    .plot svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 320px;
    }

    .plotgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 10px;
      margin: 8px 0;
    }

    .plotgrid .plot {
      margin: 0;
    }

    .lgd {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11.5px;
      color: var(--tx-2);
      margin-top: 4px;
    }

    .lgd i {
      display: inline-block;
      width: 14px;
      height: 3px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 5px;
    }

    /* ---------- tables ---------- */
    .board {
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      padding: 10px 12px;
      margin: 8px 0;
      overflow-x: auto;
    }

    .board .blbl {
      font-size: 11px;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 650;
      margin-bottom: 7px;
    }

    .memt {
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      margin: 2px 0;
    }

    .memt th,
    .memt td {
      border: 1px solid var(--bd-1);
      padding: 4px 9px;
      text-align: center;
      white-space: nowrap;
    }

    .memt th {
      color: var(--tx-3);
      font-weight: 500;
      background: var(--bg-1);
      font-size: 11px;
    }

    .memt td {
      background: var(--bg-3);
      color: var(--tx-1);
      font-weight: 600;
    }

    .memt td.lb {
      background: var(--bg-1);
      color: var(--tx-2);
      font-weight: 500;
      text-align: right;
      font-size: 11px;
    }

    .memt td.mk {
      background: rgba(56, 189, 248, .18);
      border-color: var(--fill);
      color: #bae6fd;
    }

    .memt td.mk2 {
      background: rgba(251, 191, 36, .16);
      border-color: var(--hl);
      color: #fde68a;
    }

    .memt td.dim {
      background: var(--bg-1);
      color: var(--tx-3);
      font-weight: 400;
    }

    .memt td.q {
      color: var(--unk);
      border-style: dashed;
      border-color: rgba(192, 132, 252, .55);
    }

    /* ---------- value cells ---------- */
    .rrow {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .reg {
      min-width: 118px;
      background: var(--bg-3);
      border: 1px solid var(--bd-2);
      border-radius: var(--r-sm);
      padding: 5px 9px;
    }

    .reg .rn {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--tx-3);
      letter-spacing: .03em;
    }

    .reg .rv {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--tx-1);
      font-weight: 600;
    }

    .reg.hl {
      border-color: var(--hl);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, .45);
    }

    .reg.new {
      border-color: var(--on);
      background: rgba(34, 197, 94, .14);
    }

    .reg.new .rv {
      color: #bbf7d0;
    }

    .reg.q .rv {
      color: var(--unk);
    }

    .reg.q {
      border-style: dashed;
      border-color: rgba(192, 132, 252, .55);
    }

    /* ---------- chips ---------- */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .chip {
      font-size: 11.5px;
      color: var(--tx-2);
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: 20px;
      padding: 3px 11px;
      font-family: var(--font-mono);
    }

    .chip b {
      color: var(--tx-1);
    }

    .chip.hot {
      border-color: rgba(251, 191, 36, .45);
      color: #fde68a;
    }

    .chip.cool {
      border-color: rgba(56, 189, 248, .45);
      color: #bae6fd;
    }

    .chip.good {
      border-color: rgba(34, 197, 94, .45);
      color: #bbf7d0;
    }

    .chip.bad {
      border-color: rgba(248, 113, 113, .45);
      color: #fecaca;
    }

    /* ---------- answers ---------- */
    .answer-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    input[type=text] {
      background: var(--bg-2);
      border: 1px solid var(--bd-2);
      border-radius: var(--r-md);
      color: var(--tx-1);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 8px 11px;
      width: 280px;
      outline: none;
    }

    input[type=text]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    select {
      background: var(--bg-2);
      border: 1px solid var(--bd-2);
      border-radius: var(--r-md);
      color: var(--tx-1);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 9px;
      outline: none;
    }

    .btn {
      font-family: inherit;
      font-size: 13.5px;
      border-radius: var(--r-md);
      border: 1px solid var(--bd-2);
      background: var(--bg-2);
      color: var(--tx-1);
      padding: 8px 15px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0f1a;
      font-weight: 600;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-sm {
      padding: 5px 11px;
      font-size: 12.5px;
    }

    .btn.on {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .linkbtn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      padding: 4px 2px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 12px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--bd-2);
      border-radius: var(--r-md);
      color: var(--tx-1);
      font-family: inherit;
      font-size: 13.5px;
      padding: 9px 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .choice:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--bg-3);
    }

    .choice .key {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--tx-3);
      border: 1px solid var(--bd-2);
      border-radius: 4px;
      padding: 0 6px;
      line-height: 19px;
      flex-shrink: 0;
    }

    .choice.picked {
      border-color: var(--off);
      background: rgba(248, 113, 113, .10);
    }

    .choice.right {
      border-color: var(--on);
      background: rgba(34, 197, 94, .12);
    }

    .choice.right .key,
    .choice.picked .key {
      color: var(--tx-1);
    }

    .choice:disabled {
      cursor: default;
      opacity: .85;
    }

    .feedback {
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: var(--r-md);
      font-size: 13.5px;
      border: 1px solid;
    }

    .feedback.correct {
      background: rgba(34, 197, 94, .12);
      border-color: rgba(34, 197, 94, .4);
      color: #bbf7d0;
    }

    .feedback.wrong {
      background: rgba(248, 113, 113, .10);
      border-color: rgba(248, 113, 113, .4);
      color: #fecaca;
    }

    .feedback.hint {
      background: rgba(251, 191, 36, .09);
      border-color: rgba(251, 191, 36, .33);
      color: #fde68a;
    }

    .navrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--bd-1);
      flex-wrap: wrap;
    }

    .spacer {
      flex: 1;
    }

    /* ---------- problem list ---------- */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      background: var(--bg-1);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      padding: 11px 13px;
    }

    .stat-val {
      font-size: 21px;
      font-weight: 650;
      font-family: var(--font-mono);
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .progress-bar {
      height: 5px;
      background: var(--bg-2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width .25s;
    }

    .modhead {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 6px;
    }

    .modhead:first-child {
      margin-top: 0;
    }

    .modhead .t {
      font-size: 11.5px;
      font-weight: 650;
      color: var(--tx-2);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .modhead .line {
      flex: 1;
      height: 1px;
      background: var(--bd-1);
    }

    .modhead .c {
      font-size: 11.5px;
      color: var(--tx-3);
      font-family: var(--font-mono);
    }

    .pitem {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 10px;
      border-radius: var(--r-md);
      cursor: pointer;
      border: 1px solid transparent;
    }

    .pitem:hover {
      background: var(--bg-2);
    }

    .pitem.current {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .pi-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-family: var(--font-mono);
      flex-shrink: 0;
      border: 1px solid var(--bd-2);
      color: var(--tx-3);
    }

    .pi-icon.yes {
      background: rgba(34, 197, 94, .18);
      border-color: rgba(34, 197, 94, .5);
      color: var(--on);
    }

    .pi-info {
      flex: 1;
      min-width: 0;
    }

    .pi-title {
      font-size: 13.5px;
      font-weight: 550;
    }

    .pi-sub {
      font-size: 12px;
      color: var(--tx-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pitem.solved .pi-title {
      color: var(--tx-2);
    }

    /* ---------- reference ---------- */
    .reft {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 4px 0 6px;
    }

    .reft td {
      border-bottom: 1px solid var(--bd-1);
      padding: 6px 8px;
      vertical-align: top;
    }

    .reft td:first-child {
      font-family: var(--font-mono);
      color: var(--tx-1);
      white-space: nowrap;
      width: 38%;
    }

    .reft td:last-child {
      color: var(--tx-2);
    }

    /* ---------- lab ---------- */
    .labbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .labgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      margin: 8px 0;
    }

    .labfield label {
      display: block;
      font-size: 11px;
      color: var(--tx-3);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }

    .labfield input[type=text] {
      width: 100%;
    }

    .labfield input[type=range] {
      width: 100%;
      accent-color: var(--accent);
    }

    .labfield .v {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--tx-1);
      float: right;
    }

    .oprow {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin: 7px 0;
    }

    canvas {
      display: block;
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--bd-1);
      border-radius: var(--r-md);
      margin: 8px 0;
      touch-action: none;
    }

    .verdict {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: var(--r-md);
      border: 1px solid;
    }

    .verdict.ok {
      background: rgba(34, 197, 94, .12);
      border-color: rgba(34, 197, 94, .45);
      color: #bbf7d0;
    }

    .verdict.bad {
      background: rgba(248, 113, 113, .10);
      border-color: rgba(248, 113, 113, .45);
      color: #fecaca;
    }

    .verdict.warn {
      background: rgba(251, 191, 36, .10);
      border-color: rgba(251, 191, 36, .4);
      color: #fde68a;
    }
  </style>
</head>

<body>
  <div class="app" id="app"></div>
  <script>
    /* ============================================================
       PART 1 — numeric, complex and DSP helpers
       ============================================================ */
    const PI = Math.PI, TAU = 2 * Math.PI;
    const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const pick = a => a[Math.floor(Math.random() * a.length)];
    function shuffle(a) {const r = a.slice(); for (let i = r.length - 1; i > 0; i--) {const j = rnd(0, i);[r[i], r[j]] = [r[j], r[i]];} return r;}
    function esc(s) {return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');}
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    /* round to n decimals and drop trailing zeros: 3.10 -> "3.1", 4.00 -> "4" */
    function fmtN(v, d = 3) {
      if (!isFinite(v)) return '∞';
      if (Math.abs(v) < 5e-11) v = 0;
      let s = v.toFixed(d);
      if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
      return s === '-0' ? '0' : s;
    }
    const f2 = v => fmtN(v, 2);
    const f3 = v => fmtN(v, 3);
    const db = v => 20 * Math.log10(v);
    const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
    const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);

    /* ---------- complex numbers, as {re, im} ---------- */
    const C = (re, im = 0) => ({re, im});
    const cAdd = (a, b) => C(a.re + b.re, a.im + b.im);
    const cSub = (a, b) => C(a.re - b.re, a.im - b.im);
    const cMul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
    function cDiv(a, b) {
      const d = b.re * b.re + b.im * b.im;
      return C((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d);
    }
    const cExp = th => C(Math.cos(th), Math.sin(th));            /* e^{jθ} */
    const cAbs = a => Math.hypot(a.re, a.im);
    const cArg = a => Math.atan2(a.im, a.re);
    const degOf = r => r * 180 / PI;
    const radOf = d => d * PI / 180;

    /* "3 + j4" / "5 ∠ 53.13°" */
    function rect(z, d = 2) {
      const im = z.im;
      const re = fmtN(z.re, d).replace('-', '−');      /* display minus, not a hyphen */
      if (Math.abs(im) < 5e-11) return re;
      if (Math.abs(z.re) < 5e-11) return (im < 0 ? '−j' : 'j') + fmtN(Math.abs(im), d);
      return `${re} ${im < 0 ? '−' : '+'} j${fmtN(Math.abs(im), d)}`;
    }
    function polar(z, d = 2) {return `${fmtN(cAbs(z), d)} ∠ ${fmtN(degOf(cArg(z)), d)}°`;}

    /* ---------- sequences ---------- */
    function conv(x, h) {
      const y = new Array(x.length + h.length - 1).fill(0);
      for (let i = 0; i < x.length; i++) for (let k = 0; k < h.length; k++) y[i + k] += x[i] * h[k];
      return y;
    }
    /* naive DFT — plenty fast for the sizes used here */
    function dft(x) {
      const N = x.length, out = [];
      for (let k = 0; k < N; k++) {
        let re = 0, im = 0;
        for (let n = 0; n < N; n++) {
          const th = -TAU * k * n / N;
          re += x[n] * Math.cos(th); im += x[n] * Math.sin(th);
        }
        out.push(C(re, im));
      }
      return out;
    }
    /* run a difference equation y[n] = Σ b[k]x[n−k] − Σ a[k]y[n−k]  (a[0] assumed 1) */
    function filterSeq(b, a, x, N) {
      const y = [];
      for (let n = 0; n < N; n++) {
        let acc = 0;
        for (let k = 0; k < b.length; k++) if (n - k >= 0) acc += b[k] * (x[n - k] || 0);
        for (let k = 1; k < a.length; k++) if (n - k >= 0) acc -= a[k] * y[n - k];
        y.push(acc);
      }
      return y;
    }

    /* H evaluated from gain / zeros / poles.
       plane 'z': evaluate at z = e^{jw};  plane 's': evaluate at s = jw */
    function respAt(pt, zeros, poles, k = 1) {
      let num = C(k, 0), den = C(1, 0);
      zeros.forEach(z => {num = cMul(num, cSub(pt, z));});
      poles.forEach(p => {den = cMul(den, cSub(pt, p));});
      return cDiv(num, den);
    }
    const respZ = (w, z, p, k) => respAt(cExp(w), z, p, k);
    const respS = (w, z, p, k) => respAt(C(0, w), z, p, k);

    /* frequency response of a difference equation at digital frequency w */
    function respBA(b, a, w) {
      let num = C(0, 0), den = C(0, 0);
      b.forEach((c, k) => {num = cAdd(num, cMul(C(c, 0), cExp(-w * k)));});
      a.forEach((c, k) => {den = cAdd(den, cMul(C(c, 0), cExp(-w * k)));});
      return cDiv(num, den);
    }

    /* ---------- elementary signals ---------- */
    const u = t => t >= 0 ? 1 : 0;                     /* unit step */
    const r = t => t >= 0 ? t : 0;                     /* unit ramp */
    const rect1 = (t, w) => Math.abs(t) <= w / 2 ? 1 : 0;
    const sinc = x => Math.abs(x) < 1e-9 ? 1 : Math.sin(PI * x) / (PI * x);

    /* multiple-choice helper: build {choices, ai, answer} from a correct
       string plus distractors, shuffled so the right answer moves around. */
    function mc(correct, wrong) {
      const opts = shuffle([correct, ...wrong]);
      return {choices: opts, ai: opts.indexOf(correct), answer: correct};
    }
    /* numeric answer with a tolerance band. The printed answer keeps enough
       decimals that it is itself comfortably inside the band. */
    function num(v, tol, extra) {
      const d = clamp(Math.ceil(-Math.log10(tol || 1e-3)) + 1, 2, 8);
      return Object.assign({answer: fmtN(v, d), val: v, tol}, extra || {});
    }

    /* ============================================================
       PART 2 — render helpers
       Everything returns an HTML string, so it drops straight into
       a problem's render(s, shown).
       ============================================================ */
    function title(t) {return `<div class="section-title">${t}</div>`;}
    function note(html) {return `<div class="note">${html}</div>`;}
    function chips(list) {return `<div class="chips">${list.map(c => `<span class="chip ${c[2] || ''}">${c[0]} <b>${c[1]}</b></span>`).join('')}</div>`;}

    /* boxed formula. Lines starting with "#" are dimmed commentary. */
    function eq(...lines) {
      const body = lines.map(l => {
        if (l.startsWith('#')) return `<span class="el ec">${l.slice(1).trim()}</span>`;
        return `<span class="el">${l}</span>`;
      }).join('');
      return `<div class="eqblk">${body}</div>`;
    }

    /* C / pseudo-code block */
    function code(src) {
      const s = esc(src)
        .replace(/(\b\d+\.\d+\b|\b0x[0-9A-Fa-f]+\b)/g, '<span class="h">$1</span>')
        .replace(/\/\/[^\n]*/g, '<span class="c">$&</span>')
        .replace(/\b(float|double|int|uint8_t|uint16_t|uint32_t|int16_t|int32_t|void|static|const|for|if|else|while|return|struct|typedef)\b/g, '<span class="k">$1</span>');
      return `<div class="code">${s}</div>`;
    }

    /* labelled value cells */
    function cells(rows, label) {
      const body = rows.map(([n, v, cls]) =>
        `<div class="reg ${cls || ''}"><div class="rn">${n}</div><div class="rv">${v}</div></div>`).join('');
      return `<div class="board">${label ? `<div class="blbl">${label}</div>` : ''}<div class="rrow">${body}</div></div>`;
    }

    /* generic table: head = [..], rows = [[cell | [cell, cls], ...], ..] */
    function tbl(head, rows, label) {
      const th = head.map(h => `<th>${h}</th>`).join('');
      const tr = rows.map(rw => '<tr>' + rw.map(c => {
        const [v, cls] = Array.isArray(c) ? c : [c, ''];
        return `<td class="${cls}">${v}</td>`;
      }).join('') + '</tr>').join('');
      return `<div class="board">${label ? `<div class="blbl">${label}</div>` : ''}
        <table class="memt"><tr>${th}</tr>${tr}</table></div>`;
    }

    /* ---------- plot primitives ---------- */
    const PAL = ['var(--accent)', 'var(--on)', 'var(--hl)', 'var(--unk)', 'var(--off)'];

    function scales(o) {
      const W = o.W || 640, H = o.H || 170, L = o.L === undefined ? 44 : o.L,
        R = o.R === undefined ? 14 : o.R, T = o.T === undefined ? 12 : o.T, B = o.B === undefined ? 26 : o.B;
      const [x0, x1] = o.x, [y0, y1] = o.y;
      return {
        W, H, L, R, T, B, x0, x1, y0, y1,
        X: v => L + (clamp(v, x0, x1) - x0) / (x1 - x0) * (W - L - R),
        Y: v => T + (y1 - clamp(v, y0, y1)) / (y1 - y0) * (H - T - B),
        Xr: v => L + (v - x0) / (x1 - x0) * (W - L - R),
        Yr: v => T + (y1 - v) / (y1 - y0) * (H - T - B)
      };
    }

    function ticks(a, b, n) {
      const raw = (b - a) / n;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 2.5, 5, 10].find(m => m * mag >= raw * 0.999) * mag;
      const out = [];
      for (let v = Math.ceil(a / step) * step; v <= b + step * 1e-6; v += step) out.push(Math.abs(v) < step / 1e6 ? 0 : v);
      return out;
    }

    function txt(x, y, s, o = {}) {
      return `<text x="${f2(x)}" y="${f2(y)}" text-anchor="${o.anchor || 'middle'}" font-size="${o.size || 10}"
        fill="${o.fill || 'var(--tx-3)'}" font-family="var(--font-mono)" ${o.weight ? `font-weight="${o.weight}"` : ''}
        ${o.rotate ? `transform="rotate(${o.rotate} ${f2(x)} ${f2(y)})"` : ''}>${s}</text>`;
    }

    function axesSVG(sc, o) {
      let g = '';
      const xt = o.xticks || ticks(sc.x0, sc.x1, o.nxt || 6);
      const yt = o.yticks || ticks(sc.y0, sc.y1, o.nyt || 4);
      const xf = o.xfmt || (v => fmtN(v, 2)), yf = o.yfmt || (v => fmtN(v, 2));
      xt.forEach(v => {
        const X = sc.Xr(v);
        if (X < sc.L - .5 || X > sc.W - sc.R + .5) return;
        g += `<line x1="${f2(X)}" y1="${sc.T}" x2="${f2(X)}" y2="${sc.H - sc.B}" stroke="var(--bd-1)" stroke-width="1"/>`;
        if (o.noxlab) return;
        g += txt(X, sc.H - sc.B + 13, esc(xf(v)));
      });
      yt.forEach(v => {
        const Y = sc.Yr(v);
        if (Y < sc.T - .5 || Y > sc.H - sc.B + .5) return;
        g += `<line x1="${sc.L}" y1="${f2(Y)}" x2="${sc.W - sc.R}" y2="${f2(Y)}" stroke="var(--bd-1)" stroke-width="1"/>`;
        g += txt(sc.L - 6, Y + 3.5, esc(yf(v)), {anchor: 'end'});
      });
      /* the axes themselves, drawn brighter */
      if (sc.y0 <= 0 && sc.y1 >= 0) g += `<line x1="${sc.L}" y1="${f2(sc.Yr(0))}" x2="${sc.W - sc.R}" y2="${f2(sc.Yr(0))}" stroke="var(--bd-2)" stroke-width="1.5"/>`;
      if (sc.x0 <= 0 && sc.x1 >= 0) g += `<line x1="${f2(sc.Xr(0))}" y1="${sc.T}" x2="${f2(sc.Xr(0))}" y2="${sc.H - sc.B}" stroke="var(--bd-2)" stroke-width="1.5"/>`;
      g += `<rect x="${sc.L}" y="${sc.T}" width="${sc.W - sc.L - sc.R}" height="${sc.H - sc.T - sc.B}" fill="none" stroke="var(--bd-1)"/>`;
      if (o.xlabel) g += txt(sc.W - sc.R, sc.H - 3, esc(o.xlabel), {anchor: 'end', fill: 'var(--tx-2)', size: 10.5});
      if (o.ylabel) g += txt(11, sc.T + (sc.H - sc.T - sc.B) / 2, esc(o.ylabel), {rotate: -90, fill: 'var(--tx-2)', size: 10.5});
      return g;
    }

    function legend(items) {
      if (!items || !items.length) return '';
      return `<div class="lgd">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;
    }

    function plotBox(label, sc, body, lgd) {
      return `<div class="plot" style="max-width:${sc.W + 26}px">${label ? `<div class="plbl">${label}</div>` : ''}
        <svg viewBox="0 0 ${sc.W} ${sc.H}" preserveAspectRatio="xMidYMid meet" role="img">${body}</svg>
        ${legend(lgd)}</div>`;
    }

    /* annotations shared by every plot type */
    function annotate(sc, o) {
      let g = '';
      (o.vlines || []).forEach(v => {
        const X = sc.Xr(v.x);
        g += `<line x1="${f2(X)}" y1="${sc.T}" x2="${f2(X)}" y2="${sc.H - sc.B}" stroke="${v.color || 'var(--hl)'}"
          stroke-width="1.4" stroke-dasharray="${v.dash || '4 3'}"/>`;
        if (v.label) g += txt(X, sc.T + 11, esc(v.label), {fill: v.color || 'var(--hl)', size: 10.5});
      });
      (o.hlines || []).forEach(v => {
        const Y = sc.Yr(v.y);
        g += `<line x1="${sc.L}" y1="${f2(Y)}" x2="${sc.W - sc.R}" y2="${f2(Y)}" stroke="${v.color || 'var(--hl)'}"
          stroke-width="1.4" stroke-dasharray="${v.dash || '4 3'}"/>`;
        if (v.label) g += txt(sc.W - sc.R - 4, Y - 4, esc(v.label), {anchor: 'end', fill: v.color || 'var(--hl)', size: 10.5});
      });
      (o.marks || []).forEach(m => {
        const X = sc.Xr(m.x), Y = sc.Yr(m.y);
        g += `<circle cx="${f2(X)}" cy="${f2(Y)}" r="4" fill="${m.color || 'var(--hl)'}" stroke="var(--bg-2)" stroke-width="1.5"/>`;
        if (m.label) g += txt(X, Y - 9, esc(m.label), {fill: m.color || 'var(--hl)', size: 10.5, weight: 600});
      });
      (o.texts || []).forEach(t => {
        g += txt(sc.Xr(t.x), sc.Yr(t.y), esc(t.s), {fill: t.color || 'var(--tx-2)', size: t.size || 10.5, anchor: t.anchor});
      });
      return g;
    }

    function pathOf(pts, sc) {
      let d = '', pen = false;
      pts.forEach(([x, y]) => {
        if (!isFinite(y)) {pen = false; return;}
        const cy = clamp(y, sc.y0, sc.y1);
        d += (pen ? 'L' : 'M') + f2(sc.Xr(x)) + ' ' + f2(sc.Yr(cy)) + ' ';
        pen = true;
      });
      return d.trim();
    }

    /* ---------- continuous-time waveform ---------- */
    /* series: [{f: t=>y | pts:[[t,y]], color, dash, width, fill, label}] */
    function plotCT(series, o = {}) {
      o = Object.assign({x: [-1, 5], y: [-1.4, 1.4], W: 640, H: 170, xlabel: 't', N: 500}, o);
      const sc = scales(o);
      let g = axesSVG(sc, o);
      series.forEach((s, i) => {
        const col = s.color || PAL[i % PAL.length];
        let pts = s.pts;
        if (!pts) {
          pts = [];
          for (let k = 0; k <= o.N; k++) {const t = sc.x0 + (sc.x1 - sc.x0) * k / o.N; pts.push([t, s.f(t)]);}
        }
        const d = pathOf(pts, sc);
        if (s.fill) {
          const base = sc.Yr(clamp(0, sc.y0, sc.y1));
          g += `<path d="${d} L ${f2(sc.Xr(pts[pts.length - 1][0]))} ${f2(base)} L ${f2(sc.Xr(pts[0][0]))} ${f2(base)} Z"
            fill="${col}" opacity=".16" stroke="none"/>`;
        }
        g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${s.width || 2}"
          ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round" stroke-linecap="round" opacity="${s.op || 1}"/>`;
      });
      g += annotate(sc, o);
      const lgd = series.filter(s => s.label).map((s, i) => [s.color || PAL[series.indexOf(s) % PAL.length], s.label]);
      return plotBox(o.label, sc, g, o.legend === false ? null : lgd);
    }

    /* ---------- discrete-time stem plot ---------- */
    /* seq: array of numbers; o.n0 = index of seq[0] */
    function plotDT(seq, o = {}) {
      const n0 = o.n0 === undefined ? 0 : o.n0;
      const vals = seq.filter(v => isFinite(v));
      const top = o.ymax !== undefined ? o.ymax : Math.max(1, ...vals.map(Math.abs)) * 1.25;
      const bot = o.ymin !== undefined ? o.ymin : (Math.min(0, ...vals) < 0 ? -top : -top * 0.25);
      o = Object.assign({
        x: [n0 - 1, n0 + seq.length], y: [bot, top], W: 640, H: 170, xlabel: 'n',
        xticks: seq.map((_, i) => n0 + i).filter((v, i) => seq.length <= 22 || i % 2 === 0)
      }, o);
      const sc = scales(o);
      let g = axesSVG(sc, o);
      const zero = sc.Yr(clamp(0, sc.y0, sc.y1));
      const hi = o.hi || [], unknown = o.unknown || [];
      seq.forEach((v, i) => {
        const n = n0 + i, X = sc.Xr(n);
        if (X < sc.L || X > sc.W - sc.R) return;
        const isQ = unknown.includes(n);
        const col = isQ ? 'var(--unk)' : (hi.includes(n) ? 'var(--hl)' : (o.color || 'var(--accent)'));
        if (isQ) {
          g += `<line x1="${f2(X)}" y1="${f2(zero)}" x2="${f2(X)}" y2="${f2(zero - 26)}" stroke="var(--unk)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
          g += txt(X, zero - 31, '?', {fill: 'var(--unk)', size: 13, weight: 700});
          return;
        }
        const Y = sc.Yr(v);
        g += `<line x1="${f2(X)}" y1="${f2(zero)}" x2="${f2(X)}" y2="${f2(Y)}" stroke="${col}" stroke-width="${hi.includes(n) ? 2.4 : 1.8}"/>`;
        g += `<circle cx="${f2(X)}" cy="${f2(Y)}" r="${hi.includes(n) ? 4.2 : 3.4}" fill="${col}"/>`;
        if (o.values && v !== 0) g += txt(X, Y + (v >= 0 ? -8 : 13), esc(fmtN(v, 2)), {fill: col, size: 10});
      });
      g += annotate(sc, o);
      return plotBox(o.label, sc, g, o.legend || null);
    }

    /* ---------- line spectrum ---------- */
    /* comps: [{f, a, label}]  drawn as stems against frequency */
    function specPlot(comps, o = {}) {
      const fs = comps.map(c => c.f), as = comps.map(c => Math.abs(c.a));
      o = Object.assign({
        x: [o.twoSided ? -Math.max(...fs) * 1.2 : -Math.max(...fs) * 0.08, Math.max(...fs, 1) * 1.2],
        y: [0, Math.max(...as, 1) * 1.3], W: 640, H: 160, xlabel: o.xlabel || 'f (Hz)', ylabel: '|X|'
      }, o);
      const sc = scales(o);
      let g = axesSVG(sc, o);
      const list = o.twoSided ? comps.flatMap(c => c.f === 0 ? [c] : [c, {f: -c.f, a: c.a, label: c.label}]) : comps;
      list.forEach(c => {
        const X = sc.Xr(c.f), Y = sc.Yr(Math.abs(c.a)), z = sc.Yr(0);
        if (X < sc.L - 1 || X > sc.W - sc.R + 1) return;
        const col = c.color || 'var(--accent)';
        g += `<line x1="${f2(X)}" y1="${f2(z)}" x2="${f2(X)}" y2="${f2(Y)}" stroke="${col}" stroke-width="2.2"/>`;
        g += `<circle cx="${f2(X)}" cy="${f2(Y)}" r="3.6" fill="${col}"/>`;
        if (c.label) g += txt(X, Y - 8, esc(c.label), {fill: col, size: 10, weight: 600});
      });
      g += annotate(sc, o);
      return plotBox(o.label, sc, g, o.legend || null);
    }

    /* ---------- pole–zero map ---------- */
    /* zeros / poles are complex {re,im}; o.plane = 'z' | 's' */
    function pzPlot(zeros, poles, o = {}) {
      const zp = o.plane || 'z';
      const lim = o.lim || (zp === 'z' ? 1.6 : 3);
      o = Object.assign({
        x: [-lim, lim], y: [-lim, lim], W: 340, H: 300, L: 34, B: 24,
        xlabel: zp === 'z' ? 'Re{z}' : 'σ', ylabel: zp === 'z' ? 'Im{z}' : 'jω', nxt: 4, nyt: 4
      }, o);
      const sc = scales(o);
      let g = '';
      /* stability region shading */
      if (zp === 's' && o.shade !== false) {
        g += `<rect x="${sc.L}" y="${sc.T}" width="${f2(sc.Xr(0) - sc.L)}" height="${sc.H - sc.T - sc.B}"
          fill="var(--on)" opacity=".07"/>`;
      }
      g += axesSVG(sc, o);
      if (zp === 'z') {
        const cx = sc.Xr(0), cy = sc.Yr(0), rx = sc.Xr(1) - sc.Xr(0), ry = sc.Yr(0) - sc.Yr(1);
        if (o.shade !== false) g += `<ellipse cx="${f2(cx)}" cy="${f2(cy)}" rx="${f2(rx)}" ry="${f2(ry)}" fill="var(--on)" opacity=".07"/>`;
        g += `<ellipse cx="${f2(cx)}" cy="${f2(cy)}" rx="${f2(rx)}" ry="${f2(ry)}" fill="none" stroke="var(--tx-3)" stroke-width="1.3" stroke-dasharray="5 3"/>`;
        g += txt(cx + rx * 0.72, cy - ry * 0.78, '|z| = 1', {fill: 'var(--tx-3)', size: 9.5});
      }
      /* ROC: annulus (z-plane) or half plane (s-plane) */
      if (o.roc) {
        const R = o.roc;
        if (zp === 'z') {
          const cx = sc.Xr(0), cy = sc.Yr(0), s = sc.Xr(1) - sc.Xr(0);
          if (R.type === 'out') g += `<circle cx="${f2(cx)}" cy="${f2(cy)}" r="${f2(R.r * s)}" fill="var(--bg-2)" opacity=".0" stroke="var(--fill)" stroke-width="1.6"/>`;
          g += `<circle cx="${f2(cx)}" cy="${f2(cy)}" r="${f2(R.r * s)}" fill="none" stroke="var(--fill)" stroke-width="1.6"/>`;
        } else {
          const X = sc.Xr(R.sigma);
          g += `<rect x="${f2(X)}" y="${sc.T}" width="${f2(sc.W - sc.R - X)}" height="${sc.H - sc.T - sc.B}" fill="var(--fill)" opacity=".13"/>`;
          g += `<line x1="${f2(X)}" y1="${sc.T}" x2="${f2(X)}" y2="${sc.H - sc.B}" stroke="var(--fill)" stroke-width="1.6"/>`;
        }
      }
      const seen = {};
      const key = p => `${f2(p.re)},${f2(p.im)}`;
      function mult(list, p) {return list.filter(q => key(q) === key(p)).length;}
      zeros.forEach(z => {
        const X = sc.Xr(z.re), Y = sc.Yr(z.im);
        g += `<circle cx="${f2(X)}" cy="${f2(Y)}" r="6" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
        const m = mult(zeros, z);
        if (m > 1 && !seen['z' + key(z)]) {seen['z' + key(z)] = 1; g += txt(X + 11, Y - 6, '×' + m, {fill: 'var(--accent)', size: 10});}
      });
      poles.forEach(p => {
        const X = sc.Xr(p.re), Y = sc.Yr(p.im), d = 5.5;
        const col = p.color || 'var(--off)';
        g += `<line x1="${f2(X - d)}" y1="${f2(Y - d)}" x2="${f2(X + d)}" y2="${f2(Y + d)}" stroke="${col}" stroke-width="2.2"/>`;
        g += `<line x1="${f2(X - d)}" y1="${f2(Y + d)}" x2="${f2(X + d)}" y2="${f2(Y - d)}" stroke="${col}" stroke-width="2.2"/>`;
        const m = mult(poles, p);
        if (m > 1 && !seen['p' + key(p)]) {seen['p' + key(p)] = 1; g += txt(X + 11, Y - 6, '×' + m, {fill: col, size: 10});}
      });
      g += annotate(sc, o);
      return plotBox(o.label, sc, g, o.legend === false ? null : [['var(--off)', '× pole'], ['var(--accent)', '○ zero']]);
    }

    /* ---------- Bode-style log-frequency plot ---------- */
    /* H: w => complex.  o.w = [wmin, wmax] (decades), o.phase = true */
    function bodePlot(H, o = {}) {
      o = Object.assign({w: [0.01, 100], W: 640, H: 160, N: 400, ymin: -60, ymax: 20}, o);
      const lo = Math.log10(o.w[0]), hi = Math.log10(o.w[1]);
      const pts = [], ph = [];
      for (let i = 0; i <= o.N; i++) {
        const L = lo + (hi - lo) * i / o.N, w = Math.pow(10, L), h = H(w);
        pts.push([L, db(cAbs(h))]);
        ph.push([L, degOf(cArg(h))]);
      }
      const decades = [];
      for (let d = Math.ceil(lo); d <= Math.floor(hi); d++) decades.push(d);
      const xf = L => {
        const v = Math.pow(10, L);
        return v >= 1000 ? (v / 1000) + 'k' : fmtN(v, 3);
      };
      const magOpt = Object.assign({}, o, {
        x: [lo, hi], y: [o.ymin, o.ymax], xticks: decades, xfmt: xf,
        xlabel: o.xlabel || 'ω (rad/s, log)', ylabel: '|H| dB', label: o.label || 'magnitude'
      });
      let out = plotCT([{pts, color: 'var(--accent)'}].concat(o.extra || []), magOpt);
      if (o.phase) {
        out += plotCT([{pts: ph, color: 'var(--on)'}], Object.assign({}, o, {
          x: [lo, hi], y: [o.pmin === undefined ? -180 : o.pmin, o.pmax === undefined ? 90 : o.pmax],
          xticks: decades, xfmt: xf, yticks: o.pticks || [-180, -135, -90, -45, 0, 45, 90],
          xlabel: o.xlabel || 'ω (rad/s, log)', ylabel: '∠H (°)', label: 'phase', marks: o.pmarks, vlines: o.pvlines, hlines: null
        }));
      }
      return out;
    }

    /* magnitude response of a digital filter over 0..π (or 0..fs/2) */
    function magPlot(b, a, o = {}) {
      o = Object.assign({W: 640, H: 165, N: 300, fs: null, dbScale: false}, o);
      const pts = [];
      let peak = 0;
      for (let i = 0; i <= o.N; i++) {
        const w = PI * i / o.N, m = cAbs(respBA(b, a, w));
        peak = Math.max(peak, m);
        pts.push([o.fs ? w / PI * o.fs / 2 : w / PI, o.dbScale ? db(m) : m]);
      }
      const xmax = o.fs ? o.fs / 2 : 1;
      return plotCT([{pts, color: o.color || 'var(--accent)', fill: true}], Object.assign({
        x: [0, xmax], y: o.dbScale ? [-60, 6] : [0, Math.max(1.05, peak * 1.15)],
        xlabel: o.fs ? 'f (Hz)' : 'ω / π',
        ylabel: o.dbScale ? '|H| dB' : '|H(ω)|',
        xticks: o.fs ? undefined : [0, 0.25, 0.5, 0.75, 1]
      }, o));
    }

    /* ---------- convolution flip-and-slide table ---------- */
    function convStrip(x, h, n, o = {}) {
      const x0 = o.x0 || 0, h0 = o.h0 || 0;
      const kmin = Math.min(x0, n - h0 - (h.length - 1)), kmax = Math.max(x0 + x.length - 1, n - h0);
      const ks = [];
      for (let k = kmin; k <= kmax; k++) ks.push(k);
      const xv = k => (k - x0 >= 0 && k - x0 < x.length) ? x[k - x0] : 0;
      const hv = k => (n - k - h0 >= 0 && n - k - h0 < h.length) ? h[n - k - h0] : 0;
      const prod = ks.map(k => xv(k) * hv(k));
      const sum = prod.reduce((a, b) => a + b, 0);
      const cell = (v, k) => [fmtN(v, 2), v !== 0 ? 'mk' : 'dim'];
      return tbl(['k'].concat(ks.map(String)), [
        [['x[k]', 'lb']].concat(ks.map(k => cell(xv(k)))),
        [[`h[${n}−k]`, 'lb']].concat(ks.map(k => cell(hv(k)))),
        [['product', 'lb']].concat(prod.map(p => [fmtN(p, 2), p !== 0 ? 'mk2' : 'dim']))
      ], o.label || `flip and slide: h[−k] shifted right by n = ${n}`)
        + (o.showSum === false ? '' : chips([[`y[${n}] = sum of the products`, fmtN(sum, 3), 'hot']]));
    }

    /* ---------- Argand diagram: complex numbers as arrows ---------- */
    /* vecs: [{z, label, color, dash, from}] */
    function argand(vecs, o = {}) {
      const all = vecs.flatMap(v => [Math.abs(v.z.re), Math.abs(v.z.im), v.from ? Math.abs(v.from.re) : 0, v.from ? Math.abs(v.from.im) : 0]);
      const lim = o.lim || Math.max(1, ...all) * 1.35;
      o = Object.assign({x: [-lim, lim], y: [-lim, lim], W: 330, H: 300, L: 34, B: 24, xlabel: 'Re', ylabel: 'Im', nxt: 4, nyt: 4}, o);
      const sc = scales(o);
      let g = axesSVG(sc, o);
      vecs.forEach((v, i) => {
        const col = v.color || PAL[i % PAL.length];
        const a = v.from || C(0, 0);
        const x1 = sc.Xr(a.re), y1 = sc.Yr(a.im), x2 = sc.Xr(v.z.re), y2 = sc.Yr(v.z.im);
        const ang = Math.atan2(y2 - y1, x2 - x1);
        g += `<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" stroke="${col}" stroke-width="2.2"
          ${v.dash ? `stroke-dasharray="${v.dash}"` : ''}/>`;
        g += `<path d="M ${f2(x2)} ${f2(y2)} L ${f2(x2 - 9 * Math.cos(ang - .4))} ${f2(y2 - 9 * Math.sin(ang - .4))}
          L ${f2(x2 - 9 * Math.cos(ang + .4))} ${f2(y2 - 9 * Math.sin(ang + .4))} Z" fill="${col}"/>`;
        if (v.label) g += txt(x2 + (v.z.re >= 0 ? 12 : -12), y2 + (v.z.im >= 0 ? -7 : 14), esc(v.label), {fill: col, size: 11, weight: 600, anchor: v.z.re >= 0 ? 'start' : 'end'});
      });
      g += annotate(sc, o);
      return plotBox(o.label, sc, g, o.legend || null);
    }

    /* ---------- block diagram: a left-to-right chain ---------- */
    /* items: {t:'in'|'out'|'box'|'sum'|'node', label} */
    function chainDiag(items, o = {}) {
      const W = o.W || 640, H = o.H || (o.fb ? 130 : 82), y = o.fb ? 46 : H / 2;
      const gap = (W - 40) / items.length;
      let g = '', x = 24;
      const centres = [];
      items.forEach((it, i) => {
        const cx = 24 + gap * (i + .5);
        centres.push(cx);
        if (it.t === 'box') {
          const bw = Math.min(gap - 18, Math.max(74, (it.label.length) * 7.2));
          g += `<rect x="${f2(cx - bw / 2)}" y="${y - 20}" width="${f2(bw)}" height="40" rx="6"
            fill="var(--bg-3)" stroke="${it.color || 'var(--accent)'}" stroke-width="1.6"/>`;
          g += txt(cx, y + 4.5, esc(it.label), {fill: 'var(--tx-1)', size: 12.5});
        } else if (it.t === 'sum') {
          g += `<circle cx="${f2(cx)}" cy="${y}" r="14" fill="var(--bg-3)" stroke="var(--tx-2)" stroke-width="1.6"/>`;
          g += txt(cx, y + 5, esc(it.label || '+'), {fill: 'var(--tx-1)', size: 14});
        } else {
          g += txt(cx, y + 4.5, esc(it.label), {fill: 'var(--tx-2)', size: 12.5});
        }
      });
      for (let i = 0; i < items.length - 1; i++) {
        const a = centres[i], b = centres[i + 1];
        const pad = items[i].t === 'box' ? Math.min(gap - 18, Math.max(74, items[i].label.length * 7.2)) / 2 + 4
          : items[i].t === 'sum' ? 18 : 22;
        const pad2 = items[i + 1].t === 'box' ? Math.min(gap - 18, Math.max(74, items[i + 1].label.length * 7.2)) / 2 + 8
          : items[i + 1].t === 'sum' ? 20 : 24;
        g += `<line x1="${f2(a + pad)}" y1="${y}" x2="${f2(b - pad2)}" y2="${y}" stroke="var(--tx-3)" stroke-width="1.5"/>`;
        g += `<path d="M ${f2(b - pad2)} ${y} l -7 -4 l 0 8 z" fill="var(--tx-3)"/>`;
      }
      if (o.fb) {
        const a = centres[o.fb.from], b = centres[o.fb.to], yb = y + 52;
        const bw = 78;
        g += `<line x1="${f2(a)}" y1="${y}" x2="${f2(a)}" y2="${yb}" stroke="var(--tx-3)" stroke-width="1.5"/>`;
        g += `<line x1="${f2(a)}" y1="${yb}" x2="${f2((a + b) / 2 + bw / 2)}" y2="${yb}" stroke="var(--tx-3)" stroke-width="1.5"/>`;
        g += `<rect x="${f2((a + b) / 2 - bw / 2)}" y="${yb - 16}" width="${bw}" height="32" rx="6" fill="var(--bg-3)" stroke="var(--on)" stroke-width="1.6"/>`;
        g += txt((a + b) / 2, yb + 4.5, esc(o.fb.label || 'H(s)'), {fill: 'var(--tx-1)', size: 12});
        g += `<line x1="${f2((a + b) / 2 - bw / 2)}" y1="${yb}" x2="${f2(b)}" y2="${yb}" stroke="var(--tx-3)" stroke-width="1.5"/>`;
        g += `<line x1="${f2(b)}" y1="${yb}" x2="${f2(b)}" y2="${y + 15}" stroke="var(--tx-3)" stroke-width="1.5"/>`;
        g += `<path d="M ${f2(b)} ${y + 15} l -4 7 l 8 0 z" fill="var(--tx-3)"/>`;
      }
      return `<div class="plot" style="max-width:${W + 26}px">${o.label ? `<div class="plbl">${o.label}</div>` : ''}
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg></div>`;
    }
    /* ============================================================
       PART 3 — curriculum
       Modules run in dependency order: nothing here needs an idea
       that a later module introduces.
       ============================================================ */
    const MODULES = [
      {id: 'prereq', name: 'Complex numbers & phasors', blurb: 'The arithmetic everything else is written in. A sinusoid of fixed frequency is one complex number; a filter is what you multiply it by. Get comfortable moving between rectangular, polar and decibels.'},
      {id: 'signals', name: 'Signals', blurb: 'What a signal is before anything is done to it: continuous or discrete, periodic or not, even or odd, finite-energy or finite-power — plus the five building-block signals and the three ways to bend the time axis.'},
      {id: 'systems', name: 'System properties', blurb: 'Six yes/no questions you ask about any block of code or circuit: linear, time-invariant, causal, stable, memoryless, invertible. The answers decide which analysis tools are even legal.'},
      {id: 'lti', name: 'LTI systems & convolution', blurb: 'If a system is linear and time-invariant, one impulse response tells you everything. Convolution is how you cash that in — and it is literally the inner loop of an FIR filter.'},
      {id: 'fs', name: 'Fourier series', blurb: 'Any periodic signal is a sum of harmonics of its fundamental. This is where a square wave becomes 1/n-weighted odd harmonics, and where EMI from a PWM output comes from.'},
      {id: 'ft', name: 'Fourier transform', blurb: 'Drop the periodicity requirement and the line spectrum becomes a continuous one. The properties matter more than the integrals: shift, scale, modulate, and convolution becoming multiplication.'},
      {id: 'freq', name: 'Frequency-domain analysis', blurb: 'Reading a system off its magnitude and phase response: gain at a frequency, −3 dB bandwidth, linear phase and group delay, and what "filtering" actually does to a spectrum.'},
      {id: 'laplace', name: 'Laplace & the s-domain', blurb: 'Differential equations become algebra. Poles and zeros replace the equation entirely, and where the poles sit tells you stability, ringing and settling time at a glance.'},
      {id: 'sampling', name: 'Sampling & reconstruction', blurb: 'The bridge from continuous to discrete. Nyquist, the alias frequency you actually get when you break it, anti-alias filtering, reconstruction, and how many bits of ADC buy how much SNR.'},
      {id: 'dt', name: 'Discrete-time systems', blurb: 'Difference equations are just code with state. Run them by hand, find impulse and step responses, and learn to think in normalised frequency where π is always half the sample rate.'},
      {id: 'ztrans', name: 'The z-transform', blurb: 'The discrete counterpart of Laplace. The unit circle replaces the jω axis, poles inside it mean stability, and H(z) comes straight off the difference equation.'},
      {id: 'filters', name: 'Digital filters & frequency response', blurb: 'FIR vs IIR, the four filter shapes, how a pole position sets a cutoff, what phase response costs you, and reading a Bode plot from its asymptotes.'},
      {id: 'applied', name: 'Applied: audio, image, comms, control', blurb: 'The same maths wearing different clothes: reverb taps, image kernels, AM spectra, PID loops and the sensor filter running on an MCU.'}
    ];
    const MOD_INDEX = Object.fromEntries(MODULES.map((m, i) => [m.id, i]));

    const TRIPLES = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29], [9, 12, 15], [6, 8, 10]];

    /* ---------- Module 0: complex numbers & phasors ---------- */
    const P_A = [
      {
        id: 'x1', mod: 'prereq', diff: 'easy', fmt: 'num', title: 'Magnitude of a phasor',
        ask: s => `A phasor is given in rectangular form as <code>Z = ${rect(s.z)}</code>. What is its magnitude |Z|?`,
        hint: 'The magnitude is the length of the arrow: √(real² + imaginary²). The sign of the imaginary part does not affect it.',
        concept: 'Magnitude is the amplitude of the sinusoid the phasor stands for, and it is the only part a magnitude response plot shows. Because |Z| squares both parts, a phasor and its conjugate have the same magnitude — which is why real signals always have symmetric magnitude spectra.',
        setup() {
          const [a, b, c] = pick(TRIPLES);
          const z = C(pick([1, -1]) * a, pick([1, -1]) * b);
          return num(c, 0.02, {z});
        },
        render(s, shown) {
          return argand([{z: s.z, label: shown ? `|Z| = ${fmtN(cAbs(s.z), 2)}` : 'Z', color: 'var(--accent)'}], {label: 'Argand plane'})
            + chips([['Re{Z}', fmtN(s.z.re, 2)], ['Im{Z}', fmtN(s.z.im, 2)], ['|Z|', shown ? fmtN(cAbs(s.z), 3) : '?', shown ? 'hot' : '']])
            + (shown ? note(`√(${fmtN(s.z.re, 0)}² + ${fmtN(s.z.im, 0)}²) = √${s.z.re * s.z.re + s.z.im * s.z.im} = <b>${fmtN(cAbs(s.z), 3)}</b>.`)
              : note('Both axes are labelled — read the real and imaginary parts off the arrow tip.'));
        }
      },
      {
        id: 'x2', mod: 'prereq', diff: 'easy', fmt: 'num', title: 'Phase angle in degrees',
        ask: s => `Same style of number: <code>Z = ${rect(s.z)}</code>. What is ∠Z in degrees, in the range −180° to +180°?`,
        hint: 'Use atan2, not atan — the quadrant matters. A negative real part puts you in the second or third quadrant, well past ±90°.',
        concept: 'Phase is the time offset of the sinusoid, expressed as an angle. Every language has <code>atan2(im, re)</code> precisely because plain <code>atan(im/re)</code> throws away the quadrant and folds the third quadrant onto the first — a bug that shows up as a phase-unwrapping glitch in FFT code.',
        setup() {
          const [a, b] = pick(TRIPLES);
          const z = C(pick([1, -1]) * a, pick([1, -1]) * b);
          return num(degOf(cArg(z)), 0.6, {z});
        },
        render(s, shown) {
          const th = degOf(cArg(s.z));
          return argand([{z: s.z, label: shown ? `∠Z = ${fmtN(th, 1)}°` : 'Z'}], {label: 'Argand plane'})
            + chips([['quadrant', (s.z.re >= 0 ? 'right' : 'left') + ' / ' + (s.z.im >= 0 ? 'upper' : 'lower')],
            ['atan(|Im|/|Re|)', fmtN(degOf(Math.atan(Math.abs(s.z.im / s.z.re))), 2) + '°'],
            ['∠Z', shown ? fmtN(th, 2) + '°' : '?', shown ? 'hot' : '']])
            + (shown ? note(`atan2(${fmtN(s.z.im, 0)}, ${fmtN(s.z.re, 0)}) = <b>${fmtN(th, 2)}°</b>. The reference angle is ${fmtN(degOf(Math.atan(Math.abs(s.z.im / s.z.re))), 2)}°; the quadrant decides what happens to it.`) : '');
        }
      },
      {
        id: 'x3', mod: 'prereq', diff: 'easy', fmt: 'num', title: 'Polar back to rectangular',
        ask: s => `A frequency response is measured as <code>H = ${fmtN(s.m, 2)} ∠ ${s.d}°</code>. What is its real part?`,
        hint: 'Re = |H|·cos(θ). Watch the sign of the cosine once the angle passes 90°.',
        concept: 'Rectangular form is what you add in; polar form is what you multiply in. A summing junction of two signal paths needs rectangular; a cascade of two filter stages needs polar. Fluency both ways is most of what phasor analysis is.',
        setup() {
          const m = pick([2, 3, 4, 5, 8, 10]);
          const d = pick([30, 45, 60, 120, 135, -30, -45, -60, -120]);
          return num(m * Math.cos(radOf(d)), 0.02, {m, d});
        },
        render(s, shown) {
          const z = C(s.m * Math.cos(radOf(s.d)), s.m * Math.sin(radOf(s.d)));
          return argand([{z, label: shown ? rect(z) : `${fmtN(s.m, 2)} ∠ ${s.d}°`}], {label: 'Argand plane'})
            + chips([['|H|', fmtN(s.m, 2)], ['∠H', s.d + '°'], ['cos θ', fmtN(Math.cos(radOf(s.d)), 4)],
            ['Re{H}', shown ? fmtN(z.re, 3) : '?', shown ? 'hot' : '']])
            + (shown ? note(`${fmtN(s.m, 2)} × cos(${s.d}°) = ${fmtN(s.m, 2)} × ${fmtN(Math.cos(radOf(s.d)), 4)} = <b>${fmtN(z.re, 3)}</b>, and Im{H} = ${fmtN(z.im, 3)}.`) : '');
        }
      },
      {
        id: 'x4', mod: 'prereq', diff: 'medium', fmt: 'mc', title: 'Euler and the cosine',
        ask: 'Which identity lets a real cosine be written using complex exponentials?',
        hint: 'Two counter-rotating phasors: one spinning forwards, one backwards. Their imaginary parts cancel and their real parts add.',
        concept: 'This identity is why a real signal has a two-sided spectrum with a mirrored negative-frequency half. The negative frequency is not physical — it is the second, backward-spinning phasor that has to be there for the imaginary parts to cancel and leave a real signal.',
        setup() {
          return mc('cos(ωt) = ½(e^{jωt} + e^{−jωt})',
            ['cos(ωt) = ½(e^{jωt} − e^{−jωt})',
              'cos(ωt) = e^{jωt} − j·e^{−jωt}',
              'cos(ωt) = ½j(e^{jωt} + e^{−jωt})']);
        },
        render(s, shown) {
          return eq('e^{jθ} = cos θ + j·sin θ',
            '#Euler\'s formula — the whole of phasor analysis rests on this line',
            '',
            'cos θ = ½(e^{jθ} + e^{−jθ})',
            'sin θ = (1/2j)(e^{jθ} − e^{−jθ})')
            + argand([{z: cExp(radOf(50)), label: 'e^{jθ}', color: 'var(--accent)'},
            {z: cExp(radOf(-50)), label: 'e^{−jθ}', color: 'var(--on)'},
            {z: C(2 * Math.cos(radOf(50)), 0), label: shown ? 'sum: 2cos θ, real' : 'sum', color: 'var(--hl)', dash: '4 3'}],
              {lim: 2.2, label: 'two counter-rotating phasors add to a real number'})
            + (shown ? note('The two vectors have equal and opposite imaginary parts, so the sum lands exactly on the real axis. Halve it and you have cos θ.') : '');
        }
      },
      {
        id: 'x5', mod: 'prereq', diff: 'medium', fmt: 'num', title: 'Adding two sinusoids',
        ask: s => `Two signals at the same frequency are summed: <code>${s.a1}·cos(ωt)</code> and <code>${s.a2}·cos(ωt + 90°)</code>. What is the amplitude of the sum?`,
        hint: 'At a common frequency, add them as phasors: one along the real axis, one straight up the imaginary axis. The amplitude is the length of the resultant.',
        concept: 'Sinusoids of the same frequency add to another sinusoid of that frequency — never a new one. That closure is exactly why a linear time-invariant system cannot create frequencies that were not already in the input, and why any new tone you see on a spectrum analyser means something in the chain is nonlinear.',
        setup() {
          const [a1, a2, c] = pick(TRIPLES);
          return num(c, 0.02, {a1, a2});
        },
        render(s, shown) {
          const z = C(s.a1, s.a2), A = cAbs(z), ph = degOf(cArg(z));
          return plotCT([
            {f: t => s.a1 * Math.cos(TAU * t), label: `${s.a1}cos(ωt)`, color: 'var(--accent)'},
            {f: t => s.a2 * Math.cos(TAU * t + PI / 2), label: `${s.a2}cos(ωt+90°)`, color: 'var(--on)'},
            {f: t => s.a1 * Math.cos(TAU * t) + s.a2 * Math.cos(TAU * t + PI / 2), label: 'sum', color: 'var(--hl)', width: 2.6}
          ], {x: [0, 2], y: [-A * 1.2, A * 1.2], xlabel: 't / T', label: 'time domain'})
            + argand([{z: C(s.a1, 0), label: `${s.a1}∠0°`, color: 'var(--accent)'},
            {z, from: C(s.a1, 0), label: `${s.a2}∠90°`, color: 'var(--on)'},
            {z, label: shown ? `${fmtN(A, 2)}∠${fmtN(ph, 1)}°` : 'sum = ?', color: 'var(--hl)', dash: '4 3'}],
              {label: 'phasor addition'})
            + (shown ? note(`√(${s.a1}² + ${s.a2}²) = <b>${fmtN(A, 3)}</b>, at a phase of ${fmtN(ph, 2)}°. The sum is still a pure sinusoid at the same frequency.`) : '');
        }
      },
      {
        id: 'x6', mod: 'prereq', diff: 'medium', fmt: 'num', title: 'Gain in decibels',
        ask: s => `A stage has a voltage gain of <code>${fmtN(s.g, 3)}</code>. Express that in dB (1 decimal place is fine).`,
        hint: 'For an amplitude ratio the factor is 20, not 10: dB = 20·log₁₀(ratio). The factor of 10 is for power ratios.',
        concept: 'dB turns cascade multiplication into addition, which is why every filter plot uses it. Two numbers worth memorising: ×2 is +6 dB, and ×√2 is +3 dB — the second is where the "−3 dB bandwidth" name comes from, since half the power is amplitude ÷√2.',
        setup() {
          const g = pick([2, 4, 8, 10, 16, 32, 100, 0.5, 0.1, 0.707, 0.25]);
          return num(db(g), 0.15, {g});
        },
        render(s, shown) {

                `y is x compressed by a factor of ${d}`,
